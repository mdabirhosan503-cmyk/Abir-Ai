name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find Expo project
        shell: bash
        run: |
          set -e

          echo "Searching for Expo project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR=$(dirname "$file")

            if grep -q '"expo"' "$file" 2>/dev/null; then
              PROJECT_DIR="$DIR"
              echo "Expo project found:"
              echo "$PROJECT_DIR"
              break
            fi
          done < <(find . -type f -name "package.json" -not -path "./.git/*")

          if [ -z "$PROJECT_DIR" ]; then
            echo "Expo project was not found."
            echo ""
            echo "Available package.json files:"
            find . -type f -name "package.json" -not -path "./.git/*"
            echo ""
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -300
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project
        shell: bash
        run: |
          echo "Project directory:"
          cd "$PROJECT_DIR"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "package.json:"
          cat package.json

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm project detected"

            corepack enable
            pnpm install --frozen-lockfile

          elif [ -f yarn.lock ]; then
            echo "yarn project detected"

            corepack enable
            yarn install --frozen-lockfile

          elif [ -f package-lock.json ]; then
            echo "npm project detected"

            npm ci

          else
            echo "No lock file found."
            echo "Installing with npm..."

            npm install
          fi

      - name: Check Expo
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          npx expo --version

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "android/gradlew" ]; then
            echo "Android project already exists."
          else
            echo "Android project does not exist."
            echo "Running Expo prebuild..."

            npx expo prebuild \
              --platform android \
              --non-interactive
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Android Gradle wrapper was not created."
            exit 1
          fi

          echo "Android project is ready."

          echo "ANDROID_DIR=$PROJECT_DIR/android" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Starting Android APK build..."

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
