name: Build Abir AI 5.4.24

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ABIR_VERSION: "5.4.24"

  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

  CI: "1"
  EXPO_NO_TELEMETRY: "1"

  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:

  build:

    name: Build Abir AI Android APK

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      #
      # IMPORTANT:
      # Gradle cache is NOT enabled here.
      # The Android project exists inside the ZIP and
      # is extracted later.
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. PNPM
      # ==================================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false


      # ==================================================
      # 4. NODE 20
      #
      # Expo SDK 57 / React Native project compatibility
      # ==================================================

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==================================================
      # 5. ENVIRONMENT CHECK
      # ==================================================

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "        ABIR AI BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Abir AI version:"
          echo "$ABIR_VERSION"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Gradle environment:"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-default}"

          echo ""
          echo "Disk:"
          df -h


      # ==================================================
      # 6. ANDROID SDK
      # ==================================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print 2>/dev/null |
              head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK components..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

          echo ""
          echo "Android SDK installation complete."


      # ==================================================
      # 7. PREPARE DIRECTORIES
      # ==================================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/abir_build"
          rm -rf "$GITHUB_WORKSPACE/abir_extracted"
          rm -rf "$GITHUB_WORKSPACE/build-diagnostics"
          rm -rf "$GITHUB_WORKSPACE/release"

          mkdir -p "$GITHUB_WORKSPACE/abir_build"
          mkdir -p "$GITHUB_WORKSPACE/abir_extracted"
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"


      # ==================================================
      # 8. FIND SOURCE ZIP
      # ==================================================

      - name: Find Abir AI 5.4.24 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Abir AI 5.4.24 source ZIP..."

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "AbirAI-5.4.24*.zip" \
              -not -path "*/.git/*" \
              -printf "%T@ %p\n" 2>/dev/null |
            sort -nr |
            head -n 1 |
            cut -d " " -f 2-
          )"

          if [ -z "$ZIP" ]; then

            echo "::error::No AbirAI-5.4.24*.zip source file was found."

            echo ""
            echo "ZIP files found in repository:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "Selected source ZIP:"
          echo "$ZIP"

          cp "$ZIP" \
            "$GITHUB_WORKSPACE/abir_build/source.zip"

          echo ""
          echo "Source ZIP copied successfully."


      # ==================================================
      # 9. VERIFY ZIP
      # ==================================================

      - name: Verify source ZIP integrity
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/abir_build/source.zip"

          echo "Testing ZIP integrity..."

          unzip -tq "$ZIP"

          echo ""
          echo "ZIP integrity: OK"

          echo ""
          echo "ZIP SHA-256:"

          sha256sum "$ZIP" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/source-sha256.txt"

          echo ""
          echo "ZIP file size:"

          ls -lh "$ZIP"


      # ==================================================
      # 10. EXTRACT SOURCE
      # ==================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/abir_build/source.zip"
          DEST="$GITHUB_WORKSPACE/abir_extracted"

          echo "Extracting source..."

          unzip -q "$ZIP" -d "$DEST"

          echo ""
          echo "Source extraction completed."

          echo ""
          echo "Extracted top-level files/directories:"

          find "$DEST" \
            -maxdepth 2 \
            -mindepth 1 \
            -print |
            head -n 200


      # ==================================================
      # 11. DETECT PROJECT ROOT
      # ==================================================

      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACTED="$GITHUB_WORKSPACE/abir_extracted"

          PROJECT_DIR=""

          echo "Searching for Android project..."

          # ------------------------------------------
          # Case 1: project directly at ZIP root
          # ------------------------------------------

          if [ -f "$EXTRACTED/package.json" ] &&
             [ -f "$EXTRACTED/app.json" ] &&
             [ -f "$EXTRACTED/android/gradlew" ]; then

            PROJECT_DIR="$EXTRACTED"

          else

            # ----------------------------------------
            # Case 2: project nested inside ZIP
            # ----------------------------------------

            while IFS= read -r -d '' PKG; do

              ROOT="$(dirname "$PKG")"

              if [ -f "$ROOT/app.json" ] &&
                 [ -f "$ROOT/android/gradlew" ]; then

                PROJECT_DIR="$ROOT"
                break

              fi

            done < <(
              find "$EXTRACTED" \
                -type f \
                -name "package.json" \
                -print0
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "::error::Android project was not found inside ZIP."

            echo ""
            echo "package.json files found:"

            find "$EXTRACTED" \
              -type f \
              -name "package.json" \
              -print || true

            echo ""
            echo "Gradle wrappers found:"

            find "$EXTRACTED" \
              -type f \
              -name "gradlew" \
              -print || true

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "PROJECT ROOT FOUND"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" \
            >> "$GITHUB_ENV"


      # ==================================================
      # 12. SETUP GRADLE CACHE
      #
      # IMPORTANT:
      # This happens AFTER ZIP extraction.
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false


      # ==================================================
      # 13. VERIFY PROJECT STRUCTURE
      # ==================================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking required project files..."

          test -f package.json
          test -f app.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Project structure: OK"

          echo ""
          echo "=========================================="
          echo "PACKAGE INFORMATION"
          echo "=========================================="

          node <<'NODE'
          const p = require("./package.json");

          console.log(JSON.stringify({
            name: p.name || null,
            version: p.version || null,
            expo: p.dependencies?.expo || p.devDependencies?.expo || null,
            react: p.dependencies?.react || p.devDependencies?.react || null,
            reactNative:
              p.dependencies?.["react-native"] ||
              p.devDependencies?.["react-native"] ||
              null,
            expoCamera:
              p.dependencies?.["expo-camera"] ||
              p.devDependencies?.["expo-camera"] ||
              null
          }, null, 2));
          NODE

          echo ""
          echo "=========================================="
          echo "IMPORTANT ABIR AI FILES"
          echo "=========================================="

          for FILE in \
            assistant/voiceManager.ts \
            assistant/androidActions.ts \
            assistant/onlineAssistant.ts \
            app/index.tsx \
            components/ExactReferenceDashboard.tsx \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/WakeWordService.kt \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt
          do

            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "NOTICE: $FILE not found"
            fi

          done


      # ==================================================
      # 14. PREPARE GRADLE WRAPPER
      # ==================================================

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo ""
          echo "Android SDK local.properties:"
          cat local.properties

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties


      # ==================================================
      # 15. INSTALL JAVASCRIPT DEPENDENCIES
      # ==================================================

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Installing JavaScript dependencies..."

          if [ -f pnpm-lock.yaml ]; then

            echo "pnpm-lock.yaml found."
            echo "Using frozen lockfile."

            pnpm install --frozen-lockfile

          else

            echo "::warning::pnpm-lock.yaml was not found."

            pnpm install

          fi

          echo ""
          echo "JavaScript dependencies installed."


      # ==================================================
      # 16. VERIFY EXPO
      # ==================================================

      - name: Verify Expo and project configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "EXPO VERSION"
          echo "=========================================="

          pnpm exec expo --version

          echo ""
          echo "=========================================="
          echo "EXPO CONFIG"
          echo "=========================================="

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

          echo "Expo configuration generated successfully."


      # ==================================================
      # 17. VERIFY IMPORTANT DEPENDENCIES
      # ==================================================

      - name: Verify Expo Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Checking Expo dependency resolution..."

          node <<'NODE'
          const checks = [
            "expo/package.json",
            "react-native/package.json"
          ];

          let failed = false;

          for (const item of checks) {
            try {
              console.log("FOUND:", require.resolve(item));
            } catch (error) {
              console.error("MISSING:", item);
              failed = true;
            }
          }

          if (failed) {
            process.exit(1);
          }
          NODE

          echo ""
          echo "Dependency resolution: OK"


      # ==================================================
      # 18. PREPARE GRADLE PROPERTIES
      # ==================================================

      - name: Prepare Gradle properties
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          touch gradle.properties

          # ------------------------------------------
          # Ensure final newline
          # ------------------------------------------

          if [ -s gradle.properties ]; then

            LAST_BYTE="$(
              tail -c 1 gradle.properties |
              od -An -t x1 |
              tr -d " "
            )"

            if [ "$LAST_BYTE" != "0a" ]; then
              printf "\n" >> gradle.properties
            fi

          fi

          # ------------------------------------------
          # Disable Gradle daemon in CI
          # ------------------------------------------

          if ! grep -qxF "org.gradle.daemon=false" gradle.properties; then
            printf "\norg.gradle.daemon=false\n" >> gradle.properties
          fi

          # ------------------------------------------
          # JVM memory
          # ------------------------------------------

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then

            printf "%s\n" \
              "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
              >> gradle.properties

          fi

          # ------------------------------------------
          # Detect malformed concatenation
          # ------------------------------------------

          if grep -nE \
            "expo\.inlineModules\.watchedDirectories=.*org\.gradle\." \
            gradle.properties; then

            echo "::error::Malformed gradle.properties detected."

            cat gradle.properties

            exit 1

          fi

          echo ""
          echo "Gradle properties:"
          cat gradle.properties


      # ==================================================
      # 19. GRADLE PREFLIGHT
      # ==================================================

      - name: Run Gradle preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew \
            --version \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo ""
          echo "=========================================="
          echo "GRADLE HELP TEST"
          echo "=========================================="

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"


      # ==================================================
      # 20. BUILD RELEASE APK
      # ==================================================

      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=========================================="
          echo "BUILDING ABIR AI $ABIR_VERSION"
          echo "=========================================="

          echo ""
          echo "Running Gradle clean..."

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          echo ""
          echo "Running Release APK build..."

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

          echo ""
          echo "Gradle Release build completed."


      # ==================================================
      # 21. FIND AND VERIFY APK
      # ==================================================

      - name: Collect and verify Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$PROJECT_DIR/android/app/build/outputs/apk"

          APK_DIR="$APK_ROOT/release"

          echo "=========================================="
          echo "SEARCHING FOR RELEASE APK"
          echo "=========================================="

          if [ ! -d "$APK_ROOT" ]; then

            echo "::error::Android APK output directory does not exist."

            find "$PROJECT_DIR/android/app/build" \
              -maxdepth 6 \
              -print 2>/dev/null || true

            exit 1

          fi

          APK="$(
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              -print 2>/dev/null |
            sort |
            tail -n 1 || true
          )"

          if [ -z "$APK" ]; then

            echo "::error::No APK was generated."

            echo ""
            echo "Available APK/build outputs:"

            find "$APK_ROOT" \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi

          echo ""
          echo "Generated APK:"
          echo "$APK"

          OUTPUT_APK="$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          cp "$APK" "$OUTPUT_APK"

          if [ ! -s "$OUTPUT_APK" ]; then
            echo "::error::Generated APK is empty."
            exit 1
          fi

          echo ""
          echo "Testing APK ZIP integrity..."

          unzip -tq "$OUTPUT_APK"

          echo ""
          echo "APK integrity: OK"

          echo ""
          echo "APK information:"

          ls -lh "$OUTPUT_APK"

          echo ""
          echo "APK SHA-256:"

          sha256sum "$OUTPUT_APK" |
            tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

          echo ""
          echo "Final APK:"
          echo "$OUTPUT_APK"


      # ==================================================
      # 22. UPLOAD RELEASE APK
      # ==================================================

      - name: Upload Abir AI 5.4.24 Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14


      # ==================================================
      # 23. UPLOAD BUILD DIAGNOSTICS
      # ==================================================

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14


      # ==================================================
      # 24. FINAL BUILD SUMMARY
      # ==================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "        ABIR AI BUILD SUMMARY"
          echo "=========================================="

          echo ""
          echo "Version:"
          echo "$ABIR_VERSION"

          echo ""
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Release directory:"

          if [ -d "$GITHUB_WORKSPACE/release" ]; then
            ls -lah "$GITHUB_WORKSPACE/release"
          else
            echo "No release directory."
          fi

          echo ""
          echo "Diagnostics directory:"

          if [ -d "$GITHUB_WORKSPACE/build-diagnostics" ]; then
            ls -lah "$GITHUB_WORKSPACE/build-diagnostics"
          else
            echo "No diagnostics directory."
          fi

          echo ""
          echo "=========================================="
