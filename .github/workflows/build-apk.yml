
name: Build Abir AI 5.5.2 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abir-ai-5-5-2-build
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Abir AI 5.5.2 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download Abir AI 5.5.2 Source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          gh release download "v5.4.28-source" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AbirAI-5.5.2-DASHBOARD-VOICE-UPDATE.zip" \
            --dir "$RUNNER_TEMP/abir-source"

          test -s "$RUNNER_TEMP/abir-source/AbirAI-5.5.2-DASHBOARD-VOICE-UPDATE.zip"

          unzip -tq \
            "$RUNNER_TEMP/abir-source/AbirAI-5.5.2-DASHBOARD-VOICE-UPDATE.zip"

      - name: Extract and Verify Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-project"

          unzip -q \
            "$RUNNER_TEMP/abir-source/AbirAI-5.5.2-DASHBOARD-VOICE-UPDATE.zip" \
            -d "$RUNNER_TEMP/abir-project"

          cd "$RUNNER_TEMP/abir-project"

          test -f package.json
          test -f pnpm-workspace.yaml
          test -f app.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f scripts/prepare-whisper.sh
          test -f scripts/prepare-sherpa.sh

          node <<'NODE'
          const p = require('./package.json');
          const a = require('./app.json');

          if (p.version !== '5.5.2') {
            throw new Error('package.json version mismatch: ' + p.version);
          }

          if (a.expo?.version !== '5.5.2') {
            throw new Error('Expo version mismatch: ' + a.expo?.version);
          }

          if (!p.scripts?.typecheck) {
            throw new Error('TypeScript typecheck script missing');
          }

          console.log('Abir AI 5.5.2 project verified.');
          NODE

          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

          echo "PROJECT_DIR=$RUNNER_TEMP/abir-project" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Install Project Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

      - name: Validate Expo Configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo --version \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/expo-version.log"

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

      - name: TypeScript Validation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm run typecheck 2>&1 \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/typecheck.log"

      - name: Prepare Whisper.cpp
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-whisper.sh
          bash scripts/prepare-whisper.sh

          WHISPER="modules/abir-app-launcher/android/src/main/cpp/whisper.cpp"
          MODEL="modules/abir-app-launcher/android/src/main/assets/models/ggml-tiny-q5_1.bin"

          test -s "$WHISPER/CMakeLists.txt"
          test -s "$WHISPER/ggml/CMakeLists.txt"
          test -s "$WHISPER/include/whisper.h"
          test -s "$MODEL"

          sha256sum "$MODEL" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/whisper-model.txt"

      - name: Prepare Sherpa ONNX
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-sherpa.sh
          bash scripts/prepare-sherpa.sh

          ANDROID_MODULE="modules/abir-app-launcher/android"
          JNI_DIR="$ANDROID_MODULE/src/main/jniLibs"
          MODEL_DIR="$ANDROID_MODULE/src/main/assets/models/sherpa-bn"
          KOTLIN_DIR="$ANDROID_MODULE/src/main/java/com/k2fsa/sherpa/onnx"

          test -s "$MODEL_DIR/encoder.onnx"
          test -s "$MODEL_DIR/decoder.onnx"
          test -s "$MODEL_DIR/joiner.onnx"
          test -s "$MODEL_DIR/tokens.txt"

          test -d "$KOTLIN_DIR"

          find "$KOTLIN_DIR" -maxdepth 1 -name '*.kt' \
            -print -quit | grep -q .

          found=0

          for dir in "$JNI_DIR"/*; do
            [ -d "$dir" ] || continue

            if [ -s "$dir/libsherpa-onnx-jni.so" ] &&
               [ -s "$dir/libonnxruntime.so" ]; then
              found=$((found + 1))
              echo "Verified ABI: $(basename "$dir")"
            fi
          done

          test "$found" -gt 0

          (
            cd "$MODEL_DIR"
            sha256sum -c SHA256SUMS.txt
          )

      - name: Configure Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > android/local.properties

          java -version

          android/gradlew --version \
            --no-daemon \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-version.log"

      - name: Gradle Preflight
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-build.log"

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find android/app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -s "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.5.2-release.apk"

          unzip -tq \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.5.2-release.apk"

          unzip -Z1 \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.5.2-release.apk" \
            > "$GITHUB_WORKSPACE/build-diagnostics/apk-file-list.txt"

          sha256sum \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.5.2-release.apk" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

          echo "APK archive verification successful."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.5.2-Release-APK
          path: release/Abir-AI-5.5.2-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.5.2-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          
