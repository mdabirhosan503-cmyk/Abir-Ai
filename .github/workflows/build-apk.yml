
name: Build Abir AI 5.4.28

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Download Source and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Download Source ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v5.4.28-source
          ASSET_NAME: AbirAI-5.4.28-BN-EN-BANGLISH-VOICE-UPDATED.zip
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          echo "Downloading Abir AI source from Release..."

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP/abir-source"

          ZIP_FILE="$RUNNER_TEMP/abir-source/$ASSET_NAME"

          test -f "$ZIP_FILE"

          echo "Source ZIP downloaded successfully."
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract and Locate Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/abir-extracted"
          mkdir -p "$EXTRACT_DIR"

          echo "Extracting source ZIP..."
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_ROOT=""

          while IFS= read -r -d '' FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/pnpm-lock.yaml" ] &&
               [ -f "$CANDIDATE/android/gradlew" ] &&
               [ -f "$CANDIDATE/android/gradle/wrapper/gradle-wrapper.properties" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name package.json -print0)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Required Abir AI project files were not found."
            echo "Files found:"
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_ROOT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          for f in package.json pnpm-lock.yaml android/gradlew android/gradle/wrapper/gradle-wrapper.properties; do
            test -f "$f" || {
              echo "MISSING: $f"
              exit 1
            }
            echo "FOUND: $f"
          done

          node --version
          pnpm --version
          java -version

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          pnpm install --frozen-lockfile

      - name: Check Expo Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if pnpm exec expo --version; then
            pnpm exec expo config --type public
          else
            echo "Expo CLI check skipped."
          fi

      - name: Run TypeScript Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
          else
            echo "No typecheck script found."
          fi

      - name: Prepare Sherpa ONNX
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ ! -f scripts/prepare-sherpa.sh ]; then
            echo "ERROR: Sherpa preparation script not found."
            exit 1
          fi

          chmod +x scripts/prepare-sherpa.sh
          bash scripts/prepare-sherpa.sh

      - name: Verify Sherpa Model and Libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "Checking model files..."

          for f in encoder.onnx decoder.onnx joiner.onnx tokens.txt bpe.model; do
            if find . -type f -name "$f" -print -quit | grep -q .; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

          echo "Checking native libraries..."

          for lib in libsherpa-onnx-jni.so libonnxruntime.so; do
            if find android -type f -name "$lib" -print -quit | grep -q .; then
              echo "FOUND: $lib"
            else
              echo "MISSING: $lib"
              exit 1
            fi
          done

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APK_DIR="android/app/build/outputs/apk/release"

          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"

          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"

          for item in libsherpa-onnx-jni.so libonnxruntime.so encoder.onnx tokens.txt; do
            if grep -q "$item" "$RUNNER_TEMP/apk-list.txt"; then
              echo "APK contains: $item"
            else
              echo "ERROR: APK missing $item"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Release-APK
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
