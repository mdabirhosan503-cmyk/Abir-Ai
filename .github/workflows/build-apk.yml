name: Build Abir AI 4.1.0 Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      # =========================================================
      # EXTRACT V2 FIXED ZIP
      # =========================================================
      - name: Extract 4.1.0 FIXED v2 source
        shell: bash
        run: |
          set -e

          ZIP="Bengali-Voice-Buddy-AbirAI-4.1.0-Ultimate-Final-FIXED-v2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Source extracted:"
          echo "$ZIP"

      # =========================================================
      # FIND PROJECT
      # =========================================================
      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted \
              -type f \
              -name "package.json" \
              -print | while read -r f; do
                d="$(dirname "$f")"
                if [ -d "$d/android" ]; then
                  echo "$d"
                  break
                fi
              done)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

      # =========================================================
      # INSTALL
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

      # =========================================================
      # FIX LAUNCHER GRADLE
      # =========================================================
      - name: Fix launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'^\s*versionCode\s+\d+\s*$\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^\s*versionName\s+"[^"]*"\s*$\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          if re.search(r'^\s*defaultConfig\s*\{', s, re.MULTILINE):
              s = re.sub(
                  r'(^\s*defaultConfig\s*\{)',
                  r'\1\n        versionCode 21\n        versionName "4.1.0"',
                  s,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              s = re.sub(
                  r'(^\s*android\s*\{)',
                  r'''\1
              defaultConfig {
                  versionCode 21
                  versionName "4.1.0"
              }''',
                  s,
                  count=1,
                  flags=re.MULTILINE
              )

          p.write_text(s, encoding="utf-8")
          PY

      # =========================================================
      # FIX CONTACTS
      # =========================================================
      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          test -f "$FILE"

          sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
            "$FILE"

      # =========================================================
      # ACCESSIBILITY COMPATIBILITY FIX
      # =========================================================
      - name: Ensure Accessibility Kotlin compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          test -f "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          # Remove compiler-problematic IME action.
          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER',
              'AccessibilityNodeInfo.ACTION_CLICK'
          )

          # Use compile-safe scroll actions.
          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_LEFT',
              'AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD'
          )

          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_RIGHT',
              'AccessibilityNodeInfo.ACTION_SCROLL_FORWARD'
          )

          # Replace the complete pressImeEnterInternal function
          # with a safe search/done button fallback.
          pattern = (
              r'private fun pressImeEnterInternal\(\): Boolean \{'
              r'.*?'
              r'\n  \}\n\n'
              r'  private fun scrollScreenInternal'
          )

          replacement = '''private fun pressImeEnterInternal(): Boolean {
              val root = rootInActiveWindow ?: return false

              val searchHints = listOf(
                  "search",
                  "সার্চ",
                  "খুঁজ",
                  "go",
                  "enter",
                  "done",
                  "অনুসন্ধান"
              )

              val button = nodes(root).firstOrNull {
                  it.isVisibleToUser &&
                    it.isClickable &&
                    searchHints.any { h ->
                      textOf(it).contains(h, ignoreCase = true)
                    }
              }

              if (button?.performAction(
                      AccessibilityNodeInfo.ACTION_CLICK
                  ) == true) {
                  return true
              }

              val focused = nodes(root).firstOrNull {
                  it.isVisibleToUser &&
                    it.isFocused &&
                    it.className?.toString()
                      ?.contains("EditText", true) == true
              }

              return focused?.performAction(
                  AccessibilityNodeInfo.ACTION_FOCUS
              ) == true
          }

          private fun scrollScreenInternal'''

          if "ACTION_IME_ENTER" in s:
              s, count = re.subn(
                  pattern,
                  replacement,
                  s,
                  count=1,
                  flags=re.DOTALL
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not replace pressImeEnterInternal"
                  )

          # Final cleanup.
          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER',
              'AccessibilityNodeInfo.ACTION_CLICK'
          )

          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_LEFT',
              'AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD'
          )

          s = s.replace(
              'AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_RIGHT',
              'AccessibilityNodeInfo.ACTION_SCROLL_FORWARD'
          )

          p.write_text(s, encoding="utf-8")

          print("Accessibility compatibility check/fix complete.")
          PY

      # =========================================================
      # VERIFY COROUTINE
      # =========================================================
      - name: Verify Offline Speech Coroutine
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          test -f "$FILE"

          grep -F \
            "import expo.modules.kotlin.functions.Coroutine" \
            "$FILE" >/dev/null

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null

          grep -F \
            'AsyncFunction("searchAndOpenInApp") Coroutine' \
            "$FILE" >/dev/null

          echo "Coroutine verification OK."

      # =========================================================
      # VERIFY ACCESSIBILITY
      # =========================================================
      - name: Verify Accessibility fix
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          test -f "$FILE"

          if grep -Fq "ACTION_IME_ENTER" "$FILE"; then
            echo "ERROR: ACTION_IME_ENTER still exists"
            exit 1
          fi

          if grep -Fq "ACTION_SCROLL_LEFT" "$FILE"; then
            echo "ERROR: ACTION_SCROLL_LEFT still exists"
            exit 1
          fi

          if grep -Fq "ACTION_SCROLL_RIGHT" "$FILE"; then
            echo "ERROR: ACTION_SCROLL_RIGHT still exists"
            exit 1
          fi

          grep -F \
            "ACTION_SCROLL_FORWARD" \
            "$FILE" >/dev/null

          grep -F \
            "ACTION_SCROLL_BACKWARD" \
            "$FILE" >/dev/null

          echo "Accessibility compatibility OK."

      # =========================================================
      # APP VERSION
      # =========================================================
      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 21',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "4.1.0"',
              s,
              count=1
          )

          p.write_text(s, encoding="utf-8")
          PY
          fi

          if [ -f app.json ]; then
            sed -i \
              's/"version": "[^"]*"/"version": "4.1.0"/' \
              app.json
          fi

      # =========================================================
      # FEATURE CHECK
      # =========================================================
      - name: Verify Abir AI features
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          test -f assistant/offlineBrain.ts
          test -f assistant/intentParser.ts
          test -f assistant/onlineAssistant.ts

          if ! grep -Rqs \
            "universalSearch\|typeText\|tapText\|scroll" \
            assistant modules; then
            echo "WARNING: Universal screen control not detected"
          fi

          if ! grep -Rqs \
            "volume\|flashlight\|screenshot\|quickSettings" \
            assistant modules; then
            echo "WARNING: Power control not detected"
          fi

          if ! find modules \
            -name "WakeWordService.kt" \
            -print -quit | grep -q .; then
            echo "WARNING: Wake word service not detected"
          fi

          echo "Feature verification complete."

      # =========================================================
      # GRADLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          java -version
          ./gradlew --version

      # =========================================================
      # BUILD RELEASE
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
          NODE_ENV: production
        shell: bash
        run: |
          set -e

          echo "========== CLEAN =========="
          ./gradlew clean --no-daemon

          echo "========== BUILD RELEASE =========="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo "========== BUILD SUCCESS =========="

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/Abir-AI-4.1.0-release.apk

          ls -lh release/Abir-AI-4.1.0-release.apk

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.1.0-release
          path: ${{ env.PROJECT }}/release/Abir-AI-4.1.0-release.apk
          if-no-files-found: error
