name: Build Abir AI 2.9.0 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Find and Extract Abir AI ZIP
      # ==========================================
      - name: Extract Abir AI ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI ZIP"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-2.9.1-Memory200 .zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Abir AI ZIP NOT FOUND!"
            echo ""
            echo "Expected EXACT filename:"
            echo "Bengali-Voice-Buddy-AbirAI-2.9.1-Memory200 .zip"
            echo ""
            echo "Files currently in repository:"
            ls -lah
            echo ""
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP_FILE"
          echo ""

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed successfully."


      # ==========================================
      # 4. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 5. Setup pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false


      # ==========================================
      # 6. Find Abir AI Project
      # ==========================================
      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI PROJECT"
          echo "=========================================="

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: Abir AI project NOT FOUND!"
            echo ""
            echo "Available package.json files:"
            find extracted -type f -name package.json
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Abir AI project:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 7. Install Dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo "Dependencies installed."


      # ==========================================
      # 8. Check Android Project
      # ==========================================
      - name: Check Android project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew NOT FOUND!"
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android Gradle project found."


      # ==========================================
      # 9. Fix Android Version Names
      # ==========================================
      - name: Fix Android versionName
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING ANDROID VERSION NAMES"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          files = (
              list(root.rglob("build.gradle"))
              + list(root.rglob("build.gradle.kts"))
          )

          for p in files:

              try:
                  s = p.read_text()
              except Exception as e:
                  print("READ ERROR:", p, e)
                  continue

              if "android {" not in s:
                  continue

              print("")
              print("Checking:", p)

              # ---------------------------------------------
              # Groovy build.gradle
              # ---------------------------------------------
              if p.name == "build.gradle":

                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n'
                              '    versionName "2.9.1"',
                              1
                          )

                          print("Added versionName:", p)

                  else:

                      s = s.replace(
                          "android {",
                          'android {\n'
                          '    defaultConfig {\n'
                          '        versionName "2.9.1"\n'
                          '    }',
                          1
                      )

                      print("Created defaultConfig:", p)

              # ---------------------------------------------
              # Kotlin build.gradle.kts
              # ---------------------------------------------
              elif p.name == "build.gradle.kts":

                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n'
                              '        versionName = "2.9.1"',
                              1
                          )

                          print("Added Kotlin versionName:", p)

                  else:

                      s = s.replace(
                          "android {",
                          'android {\n'
                          '    defaultConfig {\n'
                          '        versionName = "2.9.1"\n'
                          '    }',
                          1
                      )

                      print("Created Kotlin defaultConfig:", p)

              p.write_text(s)

          print("")
          print("VersionName fixing completed.")
          PY


      # ==========================================
      # 10. Specifically Fix Abir App Launcher
      # ==========================================
      - name: Fix Abir App Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING ABIR APP LAUNCHER"
          echo "=========================================="

          FILE=$(find modules \
            -type f \
            -path "*/abir-app-launcher/android/build.gradle" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "abir-app-launcher build.gradle not found."
            exit 0
          fi

          echo "Launcher Gradle:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          if "android {" in s and "versionName" not in s:

              s = s.replace(
                  "android {\n",
                  'android {\n'
                  '  defaultConfig {\n'
                  '    versionName "2.9.1"\n'
                  '  }\n',
                  1
              )

              p.write_text(s)

              print("abir-app-launcher versionName added.")

          else:
              print("abir-app-launcher already contains versionName.")

          print("")
          print("Final launcher Gradle:")
          print(p.read_text())
          PY


      # ==========================================
      # 11. Fix Accessibility Service
      # ==========================================
      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING ACCESSIBILITY SERVICE"
          echo "=========================================="

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Accessibility service not found."
            exit 0
          fi

          echo "Accessibility file:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          if "import android.view.accessibility.AccessibilityEvent" not in s:

              marker = "import android.view.accessibility.AccessibilityNodeInfo"

              if marker in s:

                  s = s.replace(
                      marker,
                      "import android.view.accessibility.AccessibilityEvent\n"
                      + marker
                  )

          replacements = {
              "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
              "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)

          print("Accessibility Service fixed successfully.")
          PY


      # ==========================================
      # 12. Fix Contacts Kotlin Compatibility
      # ==========================================
      - name: Fix Contacts Kotlin compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING CONTACTS MODULE"
          echo "=========================================="

          FILE=$(find . \
            -type f \
            -name "AbirAppLauncherModule.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Contacts module not found."
            exit 0
          fi

          echo "Contacts module:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0)",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0L.toLong())",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          p.write_text(s)

          print("Contacts compatibility fixed.")
          PY


      # ==========================================
      # 13. Verify Launcher Gradle
      # ==========================================
      - name: Verify Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING LAUNCHER GRADLE"
          echo "=========================================="

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Launcher Gradle file not found."
          fi


      # ==========================================
      # 14. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version


      # ==========================================
      # 15. Clean Android Build
      # ==========================================
      - name: Clean Android build
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING ANDROID BUILD"
          echo "=========================================="

          ./gradlew clean --no-daemon

          echo "Clean completed."


      # ==========================================
      # 16. Build Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI MEMORY 200"
          echo "=========================================="
          echo ""
          echo "App internal version: 2.9.1"
          echo "Memory limit: 200"
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "BUILD COMPLETED."


      # ==========================================
      # 17. Find Release APK
      # ==========================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR RELEASE APK"
          echo "=========================================="

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: RELEASE APK NOT FOUND!"
            echo ""
            echo "Searching all APK files:"
            
            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"
          echo ""

          mkdir -p release

          # ------------------------------------------
          # Keep the old APK filename
          # ------------------------------------------
          cp "$APK" \
            "release/Abir-AI-2.9.0-Final.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release/Abir-AI-2.9.0-Final.apk


      # ==========================================
      # 18. Upload APK Artifact
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-2.9.0-Final
          path: ${{ env.PROJECT }}/release/Abir-AI-2.9.0-Final.apk
          if-no-files-found: error
