name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Checkout repository
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Java 17
      # IMPORTANT:
      # No Gradle cache here because the Android project
      # is inside the ZIP and has not been extracted yet.
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. Setup Node.js 20
      # ==================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==================================================
      # 4. Setup pnpm
      # ==================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false


      # ==================================================
      # 5. Setup Android SDK
      # ==================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          # DO NOT chmod sdkmanager.
          "$SDKMANAGER" --version

          # Accept licenses.
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          # Required Android packages.
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK setup complete."


      # ==================================================
      # 6. Verify ZIP
      # ==================================================
      - name: Verify Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.5.1-Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."

            echo ""
            echo "Repository contents:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          echo "Found Abir AI source:"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # ==================================================
      # 7. Test ZIP integrity
      # ==================================================
      - name: Test ZIP integrity
        shell: bash
        run: |
          set -e

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity check passed."


      # ==================================================
      # 8. Extract project
      # ==================================================
      - name: Extract Abir AI project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction complete."

          echo ""
          echo "Top-level extracted files:"
          find extracted -maxdepth 2 -type f | sort | head -100


      # ==================================================
      # 9. Detect Android project
      # ==================================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Case 1:
          # extracted/package.json
          # extracted/android
          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          # Case 2:
          # extracted/src/package.json
          # extracted/src/android
          elif [ -f "extracted/src/package.json" ] &&
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          else
            echo "Searching for project..."

            FOUND_ANDROID=$(find extracted \
              -type d \
              -name android \
              | head -n 1)

            if [ -n "$FOUND_ANDROID" ]; then
              CANDIDATE="$(dirname "$FOUND_ANDROID")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project could not be detected."

            echo ""
            echo "package.json files:"
            find extracted \
              -name package.json \
              -type f \
              -print

            echo ""
            echo "Android directories:"
            find extracted \
              -type d \
              -name android \
              -print

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project detected:"
          echo "$PROJECT_DIR"


      # ==================================================
      # 10. Show project structure
      # ==================================================
      - name: Verify project structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Project:"
          pwd

          echo ""
          echo "Important files:"

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "✓ package.json"
          echo "✓ android/"
          echo "✓ android/gradlew"

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "✓ gradle-wrapper.properties"
          else
            echo "WARNING: gradle-wrapper.properties not found."
          fi


      # ==================================================
      # 11. Fix old Kotlin compatibility
      # ==================================================
      - name: Apply Kotlin compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Kotlin source files..."

          if [ -d android ]; then

            find android \
              -name "*.kt" \
              -type f \
              -print0 |
            while IFS= read -r -d '' file; do

              sed -i \
                's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
                "$file" || true

            done

          fi

          echo "Kotlin compatibility check complete."


      # ==================================================
      # 12. Install JavaScript dependencies
      # ==================================================
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Installing dependencies..."

          # Do not use frozen lockfile.
          # This prevents old lockfile/catalog problems.
          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo ""
          echo "Dependencies installed."


      # ==================================================
      # 13. Verify node_modules
      # ==================================================
      - name: Verify JavaScript installation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d node_modules ]; then
            echo "ERROR: node_modules was not created."
            exit 1
          fi

          echo "node_modules OK."


      # ==================================================
      # 14. Prepare Gradle wrapper
      # ==================================================
      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          # chmod is ONLY for our project Gradle wrapper.
          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ==================================================
      # 15. Check Gradle project
      # ==================================================
      - name: Check Gradle project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Gradle wrapper:"
          ./gradlew --version

          echo ""
          echo "Gradle wrapper check passed."


      # ==================================================
      # 16. Clean Android project
      # ==================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==================================================
      # 17. Build Release APK
      # ==================================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "      BUILDING ABIR AI 4.5.1"
          echo "=========================================="
          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Release build completed."


      # ==================================================
      # 18. Find APK
      # ==================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching:"
          echo "$APK_DIR"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==================================================
      # 19. Prepare final APK
      # ==================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/Abir-AI-4.5.1-release.apk"

          echo "Final APK:"
          ls -lh release/Abir-AI-4.5.1-release.apk


      # ==================================================
      # 20. Upload APK
      # ==================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.5.1-release
          path: release/Abir-AI-4.5.1-release.apk
          if-no-files-found: error


      # ==================================================
      # 21. Final result
      # ==================================================
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       ABIR AI 4.5.1 SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK generated successfully:"
          ls -lh release/Abir-AI-4.5.1-release.apk
          echo ""
          echo "Artifact:"
          echo "Abir-AI-4.5.1-release"
          echo ""
          echo "=========================================="
