name: Build Abir AI 5.4.24 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SOURCE_ZIP: "AbirAI-5.4.24-DAILY-OFFLINE-TOOLS-UPGRADE.zip"
      RELEASE_TAG: "abirai-5.4.24-source"
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: "27.1.12297006"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Node
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install SDK, NDK and CMake
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses || true

      # 7. Download ZIP from GitHub Release
      - name: Download Abir AI source ZIP from Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p abir_build

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir abir_build

          test -f "abir_build/$SOURCE_ZIP"

          echo "Downloaded source ZIP:"
          ls -lh "abir_build/$SOURCE_ZIP"

          echo "Source ZIP SHA256:"
          sha256sum "abir_build/$SOURCE_ZIP"

      # 8. Extract ZIP
      - name: Extract Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p abir_extracted

          unzip -q "abir_build/$SOURCE_ZIP" -d abir_extracted

          echo "ZIP extraction completed."
          find abir_extracted -maxdepth 3 -type f | head -150

      # 9. Locate project root
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r GRADLE_FILE; do
            ROOT="$(dirname "$GRADLE_FILE")/.."
            ROOT="$(realpath "$ROOT")"

            if [ -f "$ROOT/package.json" ] && \
               [ -f "$ROOT/android/gradlew" ]; then
              FOUND="$ROOT"
              break
            fi
          done < <(find abir_extracted -type f -path "*/android/gradlew")

          if [ -z "$FOUND" ]; then
            echo "::error::Android Expo project not found."
            find abir_extracted -maxdepth 6 -type f | head -250
            exit 1
          fi

          echo "PROJECT_PATH=$FOUND" >> "$GITHUB_ENV"
          echo "Project found: $FOUND"

      # 10. Verify project configuration
      - name: Verify project files
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f pnpm-lock.yaml
          test -f android/gradlew

          echo "Project files verified."
          node --version
          pnpm --version
          java -version

      # 11. Install dependencies
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      # 12. Prepare Whisper multilingual engine
      - name: Prepare Whisper Bengali English engine
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/prepare-whisper.sh

          chmod +x scripts/prepare-whisper.sh
          ./scripts/prepare-whisper.sh

          echo "Whisper preparation completed."

      # 13. Verify seven Bengali model files
      - name: Verify Sherpa Bengali model files
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="modules/abir-app-launcher/android/src/main/assets/models/sherpa-bn"

          for FILE in \
            encoder.onnx \
            decoder.onnx \
            joiner.onnx \
            tokens.txt \
            bpe.model \
            unigram_500.vocab.txt \
            opt.py
          do
            if [ ! -s "$MODEL_DIR/$FILE" ]; then
              echo "::error::Missing Bengali model file: $FILE"
              exit 1
            fi

            echo "Verified: $FILE"
          done

      # 14. Prepare Sherpa ONNX runtime
      - name: Prepare Sherpa Bengali engine
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/prepare-sherpa.sh

          chmod +x scripts/prepare-sherpa.sh
          ./scripts/prepare-sherpa.sh

          echo "Sherpa preparation completed."

      # 15. Expo configuration
      - name: Check Expo configuration
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --type public

      # 16. Android SDK environment
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

      # 17. Prepare Gradle
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --version

      # 18. Gradle task check
      - name: Check Gradle tasks
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all

      # 19. Build Release APK
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 20. Locate APK
      - name: Locate Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          mkdir -p release-apk

          find "$APK_DIR" -type f -name "*.apk" -print

          APK_PATH="$(find "$APK_DIR" -type f \
            -name "*release*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find "$APK_DIR" -type f \
              -name "*.apk" | head -n 1)"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          cp "$APK_PATH" release-apk/AbirAI-5.4.24-release.apk

          ls -lh release-apk/

      # 21. Upload APK artifact
      - name: Upload Abir AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release-apk/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 22. Upload diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Logs
          path: |
            abir_build/
            ${{ env.PROJECT_PATH }}/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
