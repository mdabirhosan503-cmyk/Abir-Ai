
name: Build Abir AI 5.5.4 APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "v5.5.4-source"
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abir-ai-5-5-4-build
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Abir AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Download Release Source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v5.5.4-source"
          fi

          mkdir -p source
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --pattern "AbirAI-5.5.4-UPDATED-SOURCE.zip" \
            --dir source

      - name: Extract Source
        run: |
          unzip -q source/AbirAI-5.5.4-UPDATED-SOURCE.zip -d project

          if [ ! -f project/package.json ]; then
            FOUND="$(find project -name package.json -not -path '*/node_modules/*' | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "package.json not found"
              exit 1
            fi
            ROOT="$(dirname "$FOUND")"
            mkdir -p app-source
            cp -a "$ROOT"/. app-source/
            mv app-source project
          fi

          test -f project/package.json
          test -f project/android/gradlew || test -f project/scripts/build-android.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          java -version
          node --version
          pnpm --version

      - name: Install Dependencies
        working-directory: project
        run: |
          pnpm install --frozen-lockfile

      - name: TypeScript Check
        working-directory: project
        run: |
          pnpm typecheck

      - name: Native Library Verification
        working-directory: project
        run: |
          node scripts/verify-sherpa-jni.mjs
          node scripts/verify-native-alignment.mjs

      - name: Run Static Verifiers
        working-directory: project
        run: |
          node scripts/verify-owner-gate.mjs
          node scripts/verify-hybrid-voice.mjs
          node scripts/verify-chat-voice.mjs
          node scripts/verify-troubleshooting.mjs
          node scripts/verify-zod-compat.mjs

      - name: Build Android APK
        working-directory: project
        run: |
          chmod +x scripts/build-android.sh android/gradlew 2>/dev/null || true
          bash scripts/build-android.sh

      - name: Locate APK
        run: |
          mkdir -p output
          find project -type f -name "*.apk" -exec cp {} output/ \;

          if [ -z "$(ls -A output)" ]; then
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.5.4-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
          
