name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Setup Node.js 20
      # =========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =========================================================
      # 4. Setup pnpm
      # =========================================================
      - name: Setup pnpm 10.12.4
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # =========================================================
      # 5. Check build tools
      # =========================================================
      - name: Check build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ABIR AI BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "=========================================="


      # =========================================================
      # 6. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif command -v sdkmanager >/dev/null 2>&1; then

            SDKMANAGER="$(command -v sdkmanager)"

          else

            echo ""
            echo "ERROR: Android sdkmanager not found."
            exit 1

          fi

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Android SDK Manager:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK READY"
          echo "=========================================="


      # =========================================================
      # 7. Find Abir AI 5.4.4 ZIP
      # =========================================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI SOURCE ZIP"
          echo "=========================================="

          EXACT_ZIP="AbirAI-5.4.4-FUTURISTIC-DASHBOARD-VOICE-OWNER-SECURITY-OFFLINE-ONLINE.zip"

          ZIP_FILE=""

          # -------------------------------------------------------
          # Prefer the exact 5.4.4 source ZIP
          # -------------------------------------------------------
          if [ -f "$EXACT_ZIP" ]; then

            ZIP_FILE="$EXACT_ZIP"

            echo ""
            echo "Exact Abir AI 5.4.4 ZIP found."

          fi


          # -------------------------------------------------------
          # If exact ZIP is not present, find AbirAI ZIP
          # -------------------------------------------------------
          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "Exact 5.4.4 ZIP not found."
            echo "Searching for another AbirAI ZIP..."

            while IFS= read -r file; do

              if [ -z "$ZIP_FILE" ]; then

                ZIP_FILE="$file"

              else

                CURRENT_TIME="$(stat -c %Y "$file")"
                SELECTED_TIME="$(stat -c %Y "$ZIP_FILE")"

                if [ "$CURRENT_TIME" -gt "$SELECTED_TIME" ]; then
                  ZIP_FILE="$file"
                fi

              fi

            done < <(
              find . \
                -type f \
                -name "AbirAI-*.zip" \
                -not -path "./.git/*" \
                -print
            )

          fi


          # -------------------------------------------------------
          # Fail if nothing found
          # -------------------------------------------------------
          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: No Abir AI ZIP found."
            echo ""

            echo "Available ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print || true

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 4 \
              -type f \
              -not -path "./.git/*" \
              -print \
              | head -300

            exit 1

          fi


          echo ""
          echo "Selected source ZIP:"
          echo "$ZIP_FILE"

          echo ""
          echo "ZIP information:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 8. Verify ZIP integrity
      # =========================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING SOURCE ZIP"
          echo "=========================================="

          unzip -tq "$ZIP_FILE"

          echo ""
          echo "ZIP integrity: OK"


      # =========================================================
      # 9. Extract source
      # =========================================================
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Extraction complete."

          echo ""
          echo "Top-level extracted files:"
          find extracted \
            -maxdepth 2 \
            -type f \
            -print \
            | head -200


      # =========================================================
      # 10. Detect Android project
      # =========================================================
      - name: Detect Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          echo "=========================================="
          echo "DETECTING ABIR AI ANDROID PROJECT"
          echo "=========================================="


          # -------------------------------------------------------
          # Layout 1
          # extracted/package.json
          # extracted/android/gradlew
          # -------------------------------------------------------
          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ] &&
             [ -f "extracted/android/gradlew" ]; then

            PROJECT_DIR="extracted"

          fi


          # -------------------------------------------------------
          # Layout 2
          # extracted/src/package.json
          # extracted/src/android/gradlew
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ] &&
             [ -f "extracted/src/package.json" ] &&
             [ -d "extracted/src/android" ] &&
             [ -f "extracted/src/android/gradlew" ]; then

            PROJECT_DIR="extracted/src"

          fi


          # -------------------------------------------------------
          # Layout 3
          # Automatically search
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r android_dir; do

              CANDIDATE="$(dirname "$android_dir")"

              if [ -f "$CANDIDATE/package.json" ] &&
                 [ -f "$CANDIDATE/android/gradlew" ]; then

                PROJECT_DIR="$CANDIDATE"
                break

              fi

            done < <(
              find extracted \
                -type d \
                -name android \
                -print
            )

          fi


          # -------------------------------------------------------
          # Validate project
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Abir AI Android project could not be detected."
            echo ""

            echo "package.json files:"
            find extracted \
              -type f \
              -name package.json \
              -print || true

            echo ""
            echo "Android directories:"
            find extracted \
              -type d \
              -name android \
              -print || true

            exit 1

          fi


          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi


          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi


          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: android/gradlew missing."
            exit 1
          fi


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "ABIR AI PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # =========================================================
      # 11. Read package version
      # =========================================================
      - name: Read package version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          PACKAGE_VERSION="$(
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.stdout.write(String(pkg.version || 'unknown'));
            "
          )"

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "Package version:"
          echo "$PACKAGE_VERSION"


      # =========================================================
      # 12. Read Android version
      # =========================================================
      - name: Read Android version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APP_GRADLE="android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "ERROR: $APP_GRADLE not found."
            exit 1
          fi


          VERSION_CODE="$(
            sed -nE \
              's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*$/\1/p' \
              "$APP_GRADLE" |
            head -n 1
          )"


          VERSION_NAME="$(
            sed -nE \
              's/^[[:space:]]*versionName[[:space:]]+["'\"'\"']([^"'\"'\"']+)["'\"'\"'].*$/\1/p' \
              "$APP_GRADLE" |
            head -n 1
          )"


          if [ -z "$VERSION_CODE" ]; then

            echo "ERROR: Android versionCode not found."
            exit 1

          fi


          if [ -z "$VERSION_NAME" ]; then

            echo "ERROR: Android versionName not found."
            exit 1

          fi


          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "ANDROID VERSION"
          echo "=========================================="
          echo "versionCode: $VERSION_CODE"
          echo "versionName: $VERSION_NAME"


      # =========================================================
      # 13. Verify version consistency
      # =========================================================
      - name: Verify Abir AI version
        shell: bash
        run: |
          set -e

          echo "Checking version consistency..."

          echo ""
          echo "package.json:"
          echo "$PACKAGE_VERSION"

          echo ""
          echo "Android versionName:"
          echo "$ANDROID_VERSION_NAME"

          echo ""
          echo "Android versionCode:"
          echo "$ANDROID_VERSION_CODE"


          if [ "$PACKAGE_VERSION" != "$ANDROID_VERSION_NAME" ]; then

            echo ""
            echo "ERROR: Version mismatch."
            echo ""
            echo "package.json version:"
            echo "$PACKAGE_VERSION"
            echo ""
            echo "Android versionName:"
            echo "$ANDROID_VERSION_NAME"
            echo ""

            exit 1

          fi


          if [ "$ANDROID_VERSION_NAME" != "5.4.4" ]; then

            echo ""
            echo "ERROR: This workflow expects Abir AI 5.4.4."
            echo ""
            echo "Detected:"
            echo "$ANDROID_VERSION_NAME"

            exit 1

          fi


          if [ "$ANDROID_VERSION_CODE" != "43" ]; then

            echo ""
            echo "ERROR: Expected Android versionCode 43."
            echo ""
            echo "Detected:"
            echo "$ANDROID_VERSION_CODE"

            exit 1

          fi


          echo ""
          echo "Version verification: OK"


          echo "ABIR_VERSION=$ANDROID_VERSION_NAME" >> "$GITHUB_ENV"


      # =========================================================
      # 14. Verify project files
      # =========================================================
      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking required files..."

          test -f package.json
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle

          echo ""
          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"
          echo "Gradle wrapper: OK"
          echo "settings.gradle: OK"
          echo "build.gradle: OK"
          echo "app/build.gradle: OK"


      # =========================================================
      # 15. Verify Gradle wrapper version
      # =========================================================
      - name: Verify Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE WRAPPER"
          echo "=========================================="

          cat gradle/wrapper/gradle-wrapper.properties

          echo ""

          if grep -Fq "gradle-9.3.1-bin.zip" \
            gradle/wrapper/gradle-wrapper.properties; then

            echo "Gradle 9.3.1 detected."

          else

            echo "WARNING: Expected Gradle 9.3.1 was not detected."

          fi


      # =========================================================
      # 16. Check broken workspace dependency
      # =========================================================
      - name: Check workspace dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking workspace dependencies..."

          if grep -Fq '"@workspace/api-client-react"' package.json; then

            echo ""
            echo "ERROR:"
            echo "@workspace/api-client-react exists in package.json."
            exit 1

          fi

          echo ""
          echo "Workspace dependency check: OK"


      # =========================================================
      # 17. Install dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING ABIR AI DEPENDENCIES"
          echo "=========================================="

          if [ -f "pnpm-lock.yaml" ]; then

            echo "pnpm-lock.yaml found."

            pnpm install \
              --no-frozen-lockfile

          else

            echo "No pnpm-lock.yaml found."
            echo "Installing from package.json..."

            pnpm install \
              --no-frozen-lockfile

          fi

          echo ""
          echo "Dependencies installed successfully."


      # =========================================================
      # 18. Verify node_modules
      # =========================================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules: OK"


      # =========================================================
      # 19. Verify important Expo/RN packages
      # =========================================================
      - name: Verify Expo and React Native packages
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking installed packages..."

          test -d node_modules/expo
          test -d node_modules/react-native
          test -d node_modules/expo-router
          test -d node_modules/expo-local-authentication
          test -d node_modules/expo-secure-store
          test -d node_modules/expo-speech

          echo ""
          echo "Expo: OK"
          echo "React Native: OK"
          echo "Expo Router: OK"
          echo "Local Authentication: OK"
          echo "Secure Store: OK"
          echo "Speech: OK"


      # =========================================================
      # 20. Inspect Android project
      # =========================================================
      - name: Inspect Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Current dire
