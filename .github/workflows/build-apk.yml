name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --------------------------------------------------
      # 3. Java 17
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Android SDK base setup
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 5. Install Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::ANDROID_HOME / ANDROID_SDK_ROOT is not set."
            exit 1
          fi

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print \
              -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # --------------------------------------------------
      # 6. Find Android project
      # --------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"

          mkdir -p "$EXTRACT"

          WRAPPER=""

          # Already extracted Android project
          if [ -f "$WORK/android/gradlew" ]; then
            WRAPPER="$WORK/android/gradlew"

          elif [ -f "$WORK/gradlew" ]; then
            WRAPPER="$WORK/gradlew"

          else
            # Search for ZIP project
            ZIP_FILE="$(
              find "$WORK" \
                -maxdepth 6 \
                -type f \
                -name '*.zip' \
                ! -path '*/.git/*' \
                -print \
                -quit
            )"

            if [ -n "${ZIP_FILE:-}" ]; then
              echo "Project ZIP found:"
              echo "$ZIP_FILE"

              echo "Extracting project..."
              unzip -oq "$ZIP_FILE" -d "$EXTRACT"

              WRAPPER="$(
                find "$EXTRACT" \
                  -type f \
                  -name gradlew \
                  ! -path '*/node_modules/*' \
                  -print \
                  -quit
              )"
            fi
          fi

          if [ -z "${WRAPPER:-}" ] || [ ! -f "$WRAPPER" ]; then
            echo "::error::Gradle wrapper (gradlew) was not found."
            echo "Repository contents:"
            find "$WORK" -maxdepth 4 -type f | head -200 || true
            exit 1
          fi

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"

          echo "Android project:"
          echo "$ANDROID_DIR"

          # ------------------------------------------------
          # Find project root containing package.json
          # ------------------------------------------------

          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          while [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/package.json" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi

            CURRENT="$(dirname "$CURRENT")"
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::package.json was not found above Android project."
            exit 1
          fi

          echo "Project root:"
          echo "$PROJECT_ROOT"

          # ------------------------------------------------
          # Check Gradle wrapper
          # ------------------------------------------------

          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties not found."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Install npm dependencies
      # --------------------------------------------------
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Installing dependencies..."

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # --------------------------------------------------
      # 8. Verify environment
      # --------------------------------------------------
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"

          cd "$PROJECT_ROOT"

          test -f package.json
          test -d node_modules

          echo "package.json found."
          echo "node_modules found."

          cd "$ANDROID_DIR"

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ]; then
            printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties
          fi

          echo "Gradle:"
          ./gradlew --version

      # --------------------------------------------------
      # 9. Build Release APK
      # --------------------------------------------------
      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "Starting release build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      # --------------------------------------------------
      # 10. Find APK
      # --------------------------------------------------
      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/abir-apk"

          mkdir -p "$OUTPUT"

          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$OUTPUT/" \;

          echo "APK files found:"

          find "$OUTPUT" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print

          if ! find "$OUTPUT" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | grep -q .; then

            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK size:"
          ls -lh "$OUTPUT"/*.apk

      # --------------------------------------------------
      # 11. Upload APK
      # --------------------------------------------------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: ${{ runner.temp }}/abir-apk/*.apk
          if-no-files-found: error
          retention-days: 7
