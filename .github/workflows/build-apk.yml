name: Build Abir AI 4.1.0 Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # Node
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ---------------------------------------------------------
      # pnpm
      # ---------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      # ---------------------------------------------------------
      # Find and extract current 4.1.0 source ZIP
      # ---------------------------------------------------------
      - name: Extract 4.1.0 source ZIP
        shell: bash
        run: |
          set -e

          ZIP="Bengali-Voice-Buddy-AbirAI-4.1.0-Ultimate-Final.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo ""
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using source:"
          echo "$ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Source extracted successfully."

      # ---------------------------------------------------------
      # Find Abir AI project
      # ---------------------------------------------------------
      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname)

          # Fallback: find package.json containing android folder
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted \
              -type f \
              -name "package.json" \
              -print | while read -r f; do
                d="$(dirname "$f")"
                if [ -d "$d/android" ]; then
                  echo "$d"
                  break
                fi
              done)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found"
            echo ""
            echo "package.json files:"
            find extracted -name package.json -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo ""
          echo "========== PROJECT =========="
          echo "$PROJECT"
          echo "============================="

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

      # ---------------------------------------------------------
      # FIX 1: Launcher Gradle
      # ---------------------------------------------------------
      - name: Fix launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          if not re.search(r'^\s*android\s*\{', s, re.MULTILINE):
              raise SystemExit("ERROR: android { block not found")

          # Remove existing version declarations first.
          s = re.sub(
              r'^\s*versionCode\s+\d+\s*$\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          s = re.sub(
              r'^\s*versionName\s+"[^"]*"\s*$\n?',
              '',
              s,
              flags=re.MULTILINE
          )

          # Add a clean defaultConfig if necessary.
          if re.search(r'^\s*defaultConfig\s*\{', s, re.MULTILINE):
              s = re.sub(
                  r'(^\s*defaultConfig\s*\{)',
                  r'\1\n        versionCode 21\n        versionName "4.1.0"',
                  s,
                  count=1,
                  flags=re.MULTILINE
              )
          else:
              s = re.sub(
                  r'(^\s*android\s*\{)',
                  r'''\1
              defaultConfig {
                  versionCode 21
                  versionName "4.1.0"
              }''',
                  s,
                  count=1,
                  flags=re.MULTILINE
              )

          p.write_text(s, encoding="utf-8")
          PY

          echo ""
          echo "========== Launcher Gradle =========="
          cat "$FILE"
          echo "====================================="

      # ---------------------------------------------------------
      # FIX 2: Contacts Kotlin
      # ---------------------------------------------------------
      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Contacts Kotlin file not found"
            exit 1
          fi

          sed -i \
            's/ResolveInfoFlags\.of(0[^L])/ResolveInfoFlags.of(0L)/g' \
            "$FILE"

          echo "Contacts Kotlin checked."

      # ---------------------------------------------------------
      # FIX 3: Accessibility Kotlin compatibility
      # ---------------------------------------------------------
      - name: Fix Accessibility Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          if [ ! -f "$FILE" ]; then
            echo "WARNING: Accessibility Kotlin file not found."
            exit 0
          fi

          # Android accessibility event constants
          sed -i \
            's/AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED/32/g' \
            "$FILE"

          sed -i \
            's/AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED/2048/g' \
            "$FILE"

          sed -i \
            's/AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED/16/g' \
            "$FILE"

          sed -i \
            's/AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED/32/g' \
            "$FILE"

          sed -i \
            's/AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED/2048/g' \
            "$FILE"

          sed -i \
            's/AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED/16/g' \
            "$FILE"

          echo "Accessibility Kotlin checked."

      # ---------------------------------------------------------
      # IMPORTANT:
      # DO NOT REMOVE Coroutine
      # ---------------------------------------------------------
      - name: Verify Offline Speech Coroutine
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Kotlin launcher file not found"
            exit 1
          fi

          echo "========== Coroutine verification =========="

          grep -F \
            "import expo.modules.kotlin.functions.Coroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: Expo Coroutine import missing"
              exit 1
            }

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null || {
              echo "ERROR: recognizeOffline Coroutine builder missing"
              exit 1
            }

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: return@Coroutine missing"
              exit 1
            }

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: suspendCancellableCoroutine missing"
              exit 1
            }

          echo "Coroutine code is correct."
          echo "============================================"

      # ---------------------------------------------------------
      # App version 4.1.0
      # ---------------------------------------------------------
      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          # Android Gradle
          if [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 21',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "4.1.0"',
              s,
              count=1
          )

          p.write_text(s, encoding="utf-8")
          PY
          fi

          # Expo app.json
          if [ -f app.json ]; then
            sed -i \
              's/"version": "[^"]*"/"version": "4.1.0"/' \
              app.json
          fi

          echo "App version fixed to 4.1.0."

      # ---------------------------------------------------------
      # Verify important 4.1.0 features
      # ---------------------------------------------------------
      - name: Verify Abir AI 4.1.0 features
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "========== Feature Verification =========="

          # Offline brain
          if [ -f assistant/offlineBrain.ts ]; then
            echo "OK: Offline brain found"
          else
            echo "WARNING: offlineBrain.ts not found"
          fi

          # Intent parser
          if [ -f assistant/intentParser.ts ]; then
            echo "OK: Intent parser found"
          else
            echo "WARNING: intentParser.ts not found"
          fi

          # Universal screen control
          if grep -Rqs \
            "universalSearch\|typeText\|tapText\|scroll" \
            assistant modules; then
            echo "OK: Universal screen control detected"
          else
            echo "WARNING: Universal screen control not detected"
          fi

          # Power control
          if grep -Rqs \
            "volume\|flashlight\|screenshot\|quickSettings" \
            assistant modules; then
            echo "OK: Power control detected"
          else
            echo "WARNING: Power control not detected"
          fi

          # Gemini
          if [ -f assistant/onlineAssistant.ts ]; then
            echo "OK: Online Gemini assistant found"
          else
            echo "WARNING: onlineAssistant.ts not found"
          fi

          # Wake word
          if find modules -name "WakeWordService.kt" -print -quit | grep -q .; then
            echo "OK: Wake word service found"
          else
            echo "WARNING: Wake word service not found"
          fi

          echo "=========================================="

      # ---------------------------------------------------------
      # Final Kotlin verification
      # ---------------------------------------------------------
      - name: Final Kotlin verification
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          echo "========== Final Kotlin Check =========="

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null

          echo "OK: Coroutine builder present"

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null

          echo "OK: return@Coroutine present"

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null

          echo "OK: suspendCancellableCoroutine present"

          if grep -Eq \
            'ResolveInfoFlags\.of\(0\)' \
            "$FILE"; then
            echo "ERROR: old ResolveInfoFlags.of(0) still exists"
            exit 1
          fi

          if grep -Fq \
            "ResolveInfoFlags.of(0L)" \
            "$FILE"; then
            echo "OK: ResolveInfoFlags uses 0L"
          else
            echo "WARNING: ResolveInfoFlags.of(0L) not found"
          fi

          echo "========================================"

      # ---------------------------------------------------------
      # Prepare Gradle
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "========== Java =========="
          java -version

          echo ""
          echo "========== Gradle =========="
          ./gradlew --version

      # ---------------------------------------------------------
      # Build Release APK
      # ---------------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
          NODE_ENV: production
        shell: bash
        run: |
          set -e

          echo "========== Cleaning =========="
          ./gradlew clean --no-daemon

          echo ""
          echo "========== Building Abir AI 4.1.0 =========="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========== Build completed =========="

      # ---------------------------------------------------------
      # Find APK
      # ---------------------------------------------------------
      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            echo ""
            echo "Available APK files:"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/Abir-AI-4.1.0-release.apk

          echo ""
          echo "========== APK =========="
          ls -lh release/Abir-AI-4.1.0-release.apk
          echo "========================="

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.1.0-release
          path: ${{ env.PROJECT }}/release/Abir-AI-4.1.0-release.apk
          if-no-files-found: error
