name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Reference UI AAPT FIXED ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for f in \
            "AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip" \
            "./AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip"
          do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AAPT-FIXED ZIP not found."
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          cp "$ZIP_FILE" abir-ai-source.zip

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q abir-ai-source.zip -d extracted

          find extracted \
            -maxdepth 6 \
            \( -name gradlew -o -name package.json \) \
            -print | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Checking preinstalled Android SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

          if [ -z "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found."
            exit 1
          fi

          if [ ! -d "$SDK_DIR/platforms" ]; then
            echo "ERROR: Android SDK platforms directory not found."
            exit 1
          fi

          if [ ! -d "$SDK_DIR/build-tools" ]; then
            echo "ERROR: Android SDK build-tools directory not found."
            exit 1
          fi

          echo ""
          echo "Installed Android platforms:"
          find "$SDK_DIR/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' | sort || true

          echo ""
          echo "Installed Android build-tools:"
          find "$SDK_DIR/build-tools" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' | sort || true

          echo ""
          echo "Android SDK is available."

      - name: Verify AAPT PNG assets
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os

          root = "extracted"
          signature = b"\x89PNG\r\n\x1a\n"
          count = 0

          for base, _, files in os.walk(root):
              for name in files:
                  if not name.lower().endswith(".png"):
                      continue

                  path = os.path.join(base, name)

                  with open(path, "rb") as f:
                      data = f.read(8)

                  if data != signature:
                      raise SystemExit(
                          f"ERROR: Invalid PNG asset: {path}"
                      )

                  count += 1

          print(f"Verified {count} PNG asset(s).")
          print("PNG verification passed.")
          PY

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$GITHUB_WORKSPACE/extracted/modules/abir-app-launcher/android/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit(
                  "ERROR: <application> element is missing."
              )

          direct_services = root.findall("service")

          if direct_services:
              raise SystemExit(
                  "ERROR: <service> found directly under <manifest>."
              )

          services = application.findall("service")

          names = [
              s.attrib.get(
                  "{http://schemas.android.com/apk/res/android}name",
                  ""
              )
              for s in services
          ]

          print("Services inside application:")
          for name in names:
              print(" -", name)

          if ".CallAssistantService" not in names:
              raise SystemExit(
                  "ERROR: .CallAssistantService is missing."
              )

          print("Manifest structure is VALID.")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Configure Gradle memory
        shell: bash
        run: |
          set -e

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          sed -i '/^org.gradle.jvmargs=/d' "$GRADLE_PROPERTIES"
          sed -i '/^org.gradle.daemon=/d' "$GRADLE_PROPERTIES"

          cat >> "$GRADLE_PROPERTIES" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          EOF

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          pnpm install --no-frozen-lockfile

      - name: Fix ResolveInfoFlags compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print0 |
          xargs -0 -r sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g'

      - name: Clean Android build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew clean --no-daemon

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "=========================================="
          echo " Building Abir AI 5.4.16"
          echo " Reference UI EXACT"
          echo " AAPT-FIXED"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" |
            head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk"

          ls -lh \
            "release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-REFERENCE-UI-EXACT
          path: release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk
          if-no-files-found: error
