
name: Build Abir AI 5.4.28

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: abir-ai-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NODE_ENV: production
      CI: true

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"
          run_install: false

      # 4. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 6. Verify project
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Abir AI project..."

          test -f package.json
          test -f pnpm-lock.yaml
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Project files verified."

          node --version
          pnpm --version
          java -version

      # 7. Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 8. Expo configuration
      - name: Verify Expo configuration
        shell: bash
        run: |
          set -euo pipefail

          if pnpm exec expo --version; then
            pnpm exec expo config --type public
          else
            echo "::error::Expo CLI is unavailable."
            exit 1
          fi

      # 9. TypeScript check
      - name: TypeScript check
        shell: bash
        run: |
          set -euo pipefail

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
          else
            echo "No typecheck script found; skipping."
          fi

      # 10. Prepare Sherpa-ONNX
      - name: Prepare Sherpa-ONNX runtime and Bengali model
        shell: bash
        run: |
          set -euo pipefail

          SCRIPT="scripts/prepare-sherpa.sh"

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::scripts/prepare-sherpa.sh not found."
            exit 1
          fi

          chmod +x "$SCRIPT"
          bash "$SCRIPT"

          echo "Sherpa preparation script completed."

      # 11. Verify Sherpa model files
      - name: Verify Bengali Sherpa model
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            encoder.onnx
            decoder.onnx
            joiner.onnx
            tokens.txt
            bpe.model
            unigram_500.vocab
            opt.py
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            MATCH="$(find . \
              -type f \
              -name "$FILE" \
              ! -path "*/node_modules/*" \
              ! -path "*/.git/*" \
              -print -quit)"

            if [ -z "$MATCH" ]; then
              echo "::error::Sherpa model file missing: $FILE"
              exit 1
            fi

            echo "Found: $MATCH"
          done

          echo "Bengali model file checks passed."

      # 12. Verify Sherpa Android libraries
      - name: Verify Sherpa JNI and ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail

          JNI="$(find . \
            -type f \
            -name "libsherpa-onnx-jni.so" \
            ! -path "*/node_modules/*" \
            -print -quit)"

          ONNX="$(find . \
            -type f \
            -name "libonnxruntime.so" \
            ! -path "*/node_modules/*" \
            -print -quit)"

          if [ -z "$JNI" ]; then
            echo "::error::libsherpa-onnx-jni.so not found."
            exit 1
          fi

          if [ -z "$ONNX" ]; then
            echo "::error::libonnxruntime.so not found."
            exit 1
          fi

          echo "Sherpa JNI: $JNI"
          echo "ONNX Runtime: $ONNX"

          echo "Sherpa native library checks passed."

      # 13. Verify Kotlin integration
      - name: Verify voice recognition integration
        shell: bash
        run: |
          set -euo pipefail

          RECOGNIZER="$(find . \
            -type f \
            -name "OnlineRecognizer.kt" \
            ! -path "*/node_modules/*" \
            -print -quit)"

          if [ -z "$RECOGNIZER" ]; then
            echo "::error::OnlineRecognizer.kt not found."
            exit 1
          fi

          echo "Found: $RECOGNIZER"

          grep -R -n \
            --include="*.kt" \
            "OnlineRecognizer" \
            android modules 2>/dev/null || true

      # 14. Prepare Gradle
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "::error::Android SDK not found."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties

          cd android
          ./gradlew --version

      # 15. Build APK
      - name: Build Abir AI Release APK
        shell: bash
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -euo pipefail

          cd android

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --build-cache

      # 16. Find APK
      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-apk

          APK="$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            ! -name "*-unsigned.apk" \
            -print \
            | sort \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Release APK not found."
            find android -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK" release-apk/Abir-AI-5.4.28-release.apk

          ls -lh release-apk/

      # 17. Verify APK contents
      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          APK="release-apk/Abir-AI-5.4.28-release.apk"

          test -s "$APK"

          echo "APK size:"
          stat -c%s "$APK"

          echo "Checking native libraries..."

          unzip -l "$APK" > apk-contents.txt

          grep -q "libsherpa-onnx-jni.so" apk-contents.txt || {
            echo "::error::Sherpa JNI library missing from APK."
            exit 1
          }

          grep -q "libonnxruntime.so" apk-contents.txt || {
            echo "::error::ONNX Runtime missing from APK."
            exit 1
          }

          echo "Checking Bengali model assets..."

          grep -q "encoder.onnx" apk-contents.txt || {
            echo "::error::encoder.onnx missing from APK."
            exit 1
          }

          grep -q "tokens.txt" apk-contents.txt || {
            echo "::error::tokens.txt missing from APK."
            exit 1
          }

          echo "APK content verification passed."

      # 18. Upload APK
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-release-APK
          path: release-apk/Abir-AI-5.4.28-release.apk
          if-no-files-found: error
          retention-days: 14

      # 19. Upload diagnostic files
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-build-diagnostics
          path: |
            android/app/build/outputs/logs/
            android/app/build/reports/
            apk-contents.txt
          if-no-files-found: ignore
          retention-days: 7

      # 20. Build summary
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "ABIR AI 5.4.28 BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK: Abir-AI-5.4.28-release.apk"
          echo "Sherpa JNI: checked"
          echo "ONNX Runtime: checked"
          echo "Bengali model assets: checked"
          
