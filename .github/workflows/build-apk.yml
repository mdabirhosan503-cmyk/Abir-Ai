
name: Build Abir AI 5.5.0 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abir-ai-android-build
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"
  SOURCE_ZIP: AbirAI-5.5.0-FULL-HISTORY-PRESERVED.zip

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Checkout workflow repository
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # 2. Download source ZIP from latest GitHub Release
      - name: Download Abir AI source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"
          mkdir -p build-diagnostics release

          gh release download \
            --pattern "$SOURCE_ZIP" \
            --dir "$RUNNER_TEMP/abir-source"

          ZIP="$RUNNER_TEMP/abir-source/$SOURCE_ZIP"

          test -s "$ZIP"

          unzip -tq "$ZIP"

          echo "Source ZIP downloaded and verified."

      # 3. Extract and automatically find actual project root
      - name: Extract and detect project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$RUNNER_TEMP/abir-extracted"
          mkdir -p "$EXTRACT"

          unzip -q \
            "$RUNNER_TEMP/abir-source/$SOURCE_ZIP" \
            -d "$EXTRACT"

          PROJECT_ROOT=""

          while IFS= read -r -d '' GRADLE_FILE; do
            CANDIDATE="${GRADLE_FILE%/android/gradlew}"

            if [ -f "$CANDIDATE/package.json" ] &&
               [ -f "$CANDIDATE/android/gradle/wrapper/gradle-wrapper.properties" ]; then

              if [ -z "$PROJECT_ROOT" ] ||
                 [ "${#CANDIDATE}" -lt "${#PROJECT_ROOT}" ]; then
                PROJECT_ROOT="$CANDIDATE"
              fi
            fi
          done < <(
            find "$EXTRACT" \
              -type f \
              -path '*/android/gradlew' \
              -print0
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Abir AI Android project not found."

            find "$EXTRACT" -maxdepth 4 -type f \
              | head -200 \
              > build-diagnostics/extracted-files.txt

            exit 1
          fi

          echo "Detected project: $PROJECT_ROOT"

          mkdir -p "$GITHUB_WORKSPACE/build-source"

          cp -a "$PROJECT_ROOT"/. \
            "$GITHUB_WORKSPACE/build-source/"

          echo "PROJECT_ROOT=$GITHUB_WORKSPACE/build-source" \
            >> "$GITHUB_ENV"

          test -f build-source/package.json
          test -f build-source/android/gradlew

          echo "Project extraction successful."

      # 4. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5. Setup Node
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 6. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses \
            > /dev/null 2>&1 || true

          sdkmanager "platform-tools"

      # 7. Install JavaScript dependencies
      - name: Install project dependencies
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail

          corepack enable

          if [ -f pnpm-lock.yaml ]; then
            echo "Using pnpm."

            PM_VERSION="$(node -p \
              "require('./package.json').packageManager || 'pnpm@10.12.4'")"

            PM_VERSION="${PM_VERSION%%+*}"

            case "$PM_VERSION" in
              pnpm@*) ;;
              *) PM_VERSION="pnpm@10.12.4" ;;
            esac

            corepack prepare "$PM_VERSION" --activate
            pnpm install --no-frozen-lockfile

          elif [ -f yarn.lock ]; then
            echo "Using Yarn."

            corepack prepare yarn@1.22.22 --activate
            yarn install --non-interactive

          elif [ -f package-lock.json ]; then
            echo "Using npm lockfile."

            npm ci

          else
            echo "No lockfile found. Using npm install."

            npm install
          fi

      # 8. Prepare Whisper if script exists
      - name: Prepare Whisper offline engine
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/prepare-whisper.sh ]; then
            chmod +x scripts/prepare-whisper.sh
            bash scripts/prepare-whisper.sh
          else
            echo "Whisper preparation script not found."
            echo "Continuing; Gradle will validate native sources."
          fi

      # 9. Prepare Sherpa ONNX if script exists
      - name: Prepare Sherpa ONNX offline engine
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail

          if [ -f scripts/prepare-sherpa.sh ]; then
            chmod +x scripts/prepare-sherpa.sh
            bash scripts/prepare-sherpa.sh
          else
            echo "Sherpa preparation script not found."
            echo "Continuing; Gradle will validate native sources."
          fi

      # 10. TypeScript check if configured
      - name: TypeScript validation
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail

          if node -e "
            const p = require('./package.json');
            process.exit(p.scripts?.typecheck ? 0 : 1);
          "; then

            if [ -f pnpm-lock.yaml ]; then
              pnpm run typecheck
            elif [ -f yarn.lock ]; then
              yarn typecheck
            else
              npm run typecheck
            fi

          elif [ -f tsconfig.json ]; then
            echo "No typecheck script; running TypeScript compiler."

            if [ -f pnpm-lock.yaml ]; then
              pnpm exec tsc --noEmit
            elif [ -f yarn.lock ]; then
              yarn tsc --noEmit
            else
              npx tsc --noEmit
            fi
          else
            echo "No TypeScript configuration found."
          fi

      # 11. Configure Android project
      - name: Configure Android project
        working-directory: build-source
        shell: bash
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          mkdir -p build-diagnostics

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > android/local.properties

          echo "Android project configured."

      # 12. Gradle preflight
      - name: Gradle preflight
        working-directory: build-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version \
            --no-daemon \
            --stacktrace \
            --console=plain

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../../build-diagnostics/gradle-help.log

      # 13. Build APK
      - name: Build Release APK
        working-directory: build-source/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee ../../build-diagnostics/gradle-clean.log

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee ../../build-diagnostics/gradle-build.log

      # 14. Verify and copy APK
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find build-source/android/app/build/outputs/apk \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/Abir-AI-5.5.0-release.apk

          unzip -tq release/Abir-AI-5.5.0-release.apk

          sha256sum release/Abir-AI-5.5.0-release.apk \
            | tee build-diagnostics/apk-sha256.txt

          echo "APK verification successful."

      # 15. Upload APK artifact
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.5.0-Release-APK
          path: release/Abir-AI-5.5.0-release.apk
          if-no-files-found: error
          retention-days: 14

      # 16. Upload diagnostics even on failure
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.5.0-Build-Diagnostics
          path: |
            build-diagnostics/
            build-source/android/**/*.log
          if-no-files-found: warn
          retention-days: 14
          
