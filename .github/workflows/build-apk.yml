name: Build Abir AI 5.4.24

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"
      EXTRACT_DIR: "${{ github.workspace }}/abir_extracted"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Verify environment
        run: |
          node --version
          npm --version
          pnpm --version
          java -version

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            \( -iname 'AbirAI-5.4.24*.zip' \
            -o -iname 'Abir-AI-5.4.24*.zip' \) \
            -print | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Abir AI 5.4.24 ZIP was not found."
            find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verify and extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$ZIP_FILE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          find "$EXTRACT_DIR" -maxdepth 5 -type f \
            \( -name package.json \
            -o -name gradlew \
            -o -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -print | sort | head -n 100

      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          while IFS= read -r gradlew; do
            candidate="$(dirname "$gradlew")"

            if [ -f "$candidate/settings.gradle" ] || \
               [ -f "$candidate/settings.gradle.kts" ]; then
              PROJECT_ROOT="$candidate"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Android Gradle project not found."
            find "$EXTRACT_DIR" -type f \
              \( -name gradlew \
              -o -name settings.gradle \
              -o -name settings.gradle.kts \) \
              -print || true
            exit 1
          fi

          PROJECT_ROOT="$(cd "$PROJECT_ROOT" && pwd)"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Detected project:"
          echo "$PROJECT_ROOT"

      - name: Verify project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            node -e '
              const p=require("./package.json");
              console.log("Package version:", p.version || "missing");
              console.log("Expo:", p.dependencies?.expo || "missing");
              console.log("React Native:", p.dependencies?.["react-native"] || "missing");
            '
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_ROOT/android/gradlew" ]; then
            GRADLE_DIR="$PROJECT_ROOT/android"
          elif [ -f "$PROJECT_ROOT/gradlew" ]; then
            GRADLE_DIR="$PROJECT_ROOT"
          else
            echo "::error::gradlew not found."
            exit 1
          fi

          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          chmod +x "$GRADLE_DIR/gradlew"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$GRADLE_DIR/local.properties"

          echo "Gradle directory:"
          echo "$GRADLE_DIR"

      - name: Apply Android compatibility fix
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_ROOT" -type f \
            \( -name '*.kt' -o -name '*.kts' -o -name '*.java' \) \
            -print0 |
          xargs -0 -r sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g'

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          touch "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.jvmargs=' \
            "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            >> "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.daemon=' \
            "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.daemon=false' \
            >> "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.parallel=' \
            "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.parallel=false' \
            >> "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.caching=' \
            "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.caching=true' \
            >> "$GRADLE_DIR/gradle.properties"

      - name: Check Gradle
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version

          ./gradlew help \
            --no-daemon \
            --stacktrace

      - name: Build Release APK
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -o pipefail

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$GRADLE_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' \
            -print 2>/dev/null | sort | tail -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."

            find "$GRADLE_DIR/app/build/outputs" \
              -type f -print 2>/dev/null || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Logs
          path: |
            abir-build.log
            ${{ env.GRADLE_DIR }}/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
