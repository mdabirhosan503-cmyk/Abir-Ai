name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy
        run: |
          set -e
          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Check Android project
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "Android project found"

      - name: Fix abir-app-launcher versionName
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          BUILD_FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: $BUILD_FILE not found"
            exit 1
          fi

          echo "Found launcher build.gradle"

          if grep -q "versionName" "$BUILD_FILE"; then
            echo "versionName already exists"
          else
            python3 - "$BUILD_FILE" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

marker = 'namespace "expo.modules.abirapp"'

if marker not in text:
    raise SystemExit("ERROR: namespace marker not found")

replacement = marker + '\n\n  defaultConfig {\n    versionName "1.0.0"\n  }'

text = text.replace(marker, replacement, 1)

with open(path, "w", encoding="utf-8") as f:
    f.write(text)

print("versionName added successfully")
PY
          fi

      - name: Make Gradle executable
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          chmod +x gradlew

      - name: Build APK
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK created:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-debug-apk
          path: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
