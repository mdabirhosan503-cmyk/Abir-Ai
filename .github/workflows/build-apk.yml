name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Find and extract the project ZIP if necessary
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            ZIP_FILE="$(find . -maxdepth 4 -type f -name '*.zip' \
              ! -path './.git/*' -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No gradlew or project ZIP found in repository."
              echo "Upload the Android project or its ZIP to GitHub."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            mkdir -p "$RUNNER_TEMP/abir-project"
            unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/abir-project"

            WRAPPER="$(find "$RUNNER_TEMP/abir-project" \
              -type f -name gradlew -print -quit || true)"

            if [ -z "$WRAPPER" ]; then
              echo "::error::The ZIP does not contain gradlew."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$WRAPPER")"
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      # 3. Set up Node.js for React Native / Expo
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Set up Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 6. Verify Android project
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "::error::gradlew is missing."
            exit 1
          fi

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          chmod +x gradlew

          echo "Checking Android Gradle files..."
          find . -maxdepth 4 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) -print

      # 7. Install JavaScript dependencies
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "::error::package.json not found."
            exit 1
          fi

      # 8. Build the release APK
      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 9. Verify that APK was generated
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK_COUNT="$(find . -type f \
            -path '*/build/outputs/apk/release/*.apk' | wc -l)"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No release APK was generated."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          echo "Generated APK files:"
          find . -type f \
            -path '*/build/outputs/apk/release/*.apk' -print

      # 10. Upload APK to GitHub Actions Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
