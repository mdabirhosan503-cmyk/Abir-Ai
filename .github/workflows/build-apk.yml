name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. pnpm 10.12.4
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ==========================================
      # 5. Check tools
      # ==========================================
      - name: Check build tools
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo "================================"


      # ==========================================
      # 6. Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"

          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."


      # ==========================================
      # 7. Find source ZIP
      # ==========================================
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.6.1-Full-Control-Voice-Fixed.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then

            echo ""
            echo "ERROR: Source ZIP not found."
            echo ""

            echo "Available ZIP files:"
            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "Source ZIP found:"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # 8. Verify ZIP
      # ==========================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity: OK"


      # ==========================================
      # 9. Extract
      # ==========================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source extracted."


      # ==========================================
      # 10. Detect project
      # ==========================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Normal layout
          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          # src layout
          elif [ -f "extracted/src/package.json" ] &&
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          else

            ANDROID_DIR="$(
              find extracted \
                -type d \
                -name android \
                | head -n 1
            )"

            if [ -n "$ANDROID_DIR" ]; then

              CANDIDATE="$(dirname "$ANDROID_DIR")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi

            fi

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Project directory not found."

            echo ""
            echo "package.json files:"
            find extracted \
              -type f \
              -name package.json \
              -print

            exit 1
          fi


          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi


          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "$PROJECT_DIR"
          echo "=========================================="


      # ==========================================
      # 11. Verify project files
      # ==========================================
      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "package.json OK"
          echo "android OK"
          echo "gradlew OK"


      # ==========================================
      # 12. Check broken workspace dependency
      # ==========================================
      - name: Check workspace dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking workspace dependencies..."

          if grep -Fq '"@workspace/api-client-react"' package.json; then
            echo "ERROR: @workspace/api-client-react exists."
            exit 1
          fi

          echo "No broken @workspace/api-client-react dependency."


      # ==========================================
      # 13. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed successfully."


      # ==========================================
      # 14. Verify node_modules
      # ==========================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules OK"


      # ==========================================
      # 15. Show Android project
      # ==========================================
      - name: Inspect Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Android project:"
          pwd

          echo ""
          echo "Gradle:"
          ls -lh gradlew

          echo ""
          echo "Gradle files:"
          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -print


      # ==========================================
      # 16. Android compatibility
      # ==========================================
      - name: Apply Android compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Applying Kotlin compatibility fixes..."

          find android \
            -type f \
            -name "*.kt" \
            -print0 |
          while IFS= read -r -d '' file; do

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done

          echo "Compatibility fixes complete."


      # ==========================================
      # 17. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 18. Gradle version
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # 19. Clean
      # ==========================================
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 20. Build APK
      # ==========================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING ABIR AI 4.6.1"
          echo "=========================================="
          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD FINISHED."


      # ==========================================
      # 21. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK directory missing."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print


          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi


          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==========================================
      # 22. Prepare final APK
      # ==========================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/Abir-AI-4.6.1-release.apk"

          echo ""
          echo "Final APK:"
          ls -lh release/Abir-AI-4.6.1-release.apk


      # ==========================================
      # 23. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.6.1-release
          path: release/Abir-AI-4.6.1-release.apk
          if-no-files-found: error


      # ==========================================
      # 24. Success
      # ==========================================
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       ABIR AI 4.6.1 SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.6.1-release.apk
          echo ""
          echo "Artifact:"
          echo "Abir-AI-4.6.1-release"
          echo ""
          echo "=========================================="
