name: Build Abir AI 4.5.1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # 3. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false


      # 4. pnpm cache
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-


      # 5. Verify Node / pnpm
      - name: Verify tools
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "pnpm:"
          pnpm --version


      # 6. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # 7. Android SDK environment
      - name: Setup Android environment
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          ls -la "$ANDROID_HOME"


      # 8. Find sdkmanager
      - name: Find sdkmanager
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f \
            -name "sdkmanager" \
            | sort -V \
            | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -type f -name "sdkmanager" -print
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # 9. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +e

          echo "Accepting Android SDK licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "sdkmanager --licenses returned $STATUS."
            echo "Continuing; required packages will verify licenses."
          fi

          echo "License step completed."


      # 10. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK packages..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed SDK packages:"
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --list_installed


      # 11. Find Abir AI 4.5.1 ZIP
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.5.1-Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Abir AI 4.5.1 ZIP not found."

            echo ""
            echo "Available ZIP files:"
            find . -maxdepth 5 -type f -name "*.zip" -print

            exit 1
          fi

          echo "Found ZIP:"
          ls -lh "$ZIP"


      # 12. Extract project
      - name: Extract Abir AI project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "AbirAI-4.5.1-Fixed.zip" \
            -d extracted

          echo ""
          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f \
            \( \
              -name "package.json" \
              -o -name "app.json" \
              -o -name "pnpm-lock.yaml" \
              -o -name "gradlew" \
            \) \
            -print


      # 13. Detect project directory
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT=""

          # Normal root project
          if [ -f "extracted/app.json" ] && \
             [ -f "extracted/package.json" ]; then
            PROJECT="extracted"

          # Project inside one folder
          elif [ -f "extracted/src/app.json" ] && \
               [ -f "extracted/src/package.json" ]; then
            PROJECT="extracted/src"

          else
            PROJECT=$(find extracted \
              -type f \
              -name "app.json" \
              -print \
              | head -n 1 \
              | xargs -r dirname)

            if [ -n "$PROJECT" ] && \
               [ ! -f "$PROJECT/package.json" ]; then
              PROJECT=""
            fi
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project directory not found."

            echo ""
            echo "app.json files:"
            find extracted -type f -name "app.json" -print

            echo ""
            echo "package.json files:"
            find extracted -type f -name "package.json" -print

            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo ""
          echo "Using project:"
          echo "$PROJECT"


      # 14. Verify project
      - name: Verify project files
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi

          if [ ! -f "app.json" ]; then
            echo "ERROR: app.json missing."
            exit 1
          fi

          if [ ! -d "android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew missing."
            exit 1
          fi

          echo ""
          echo "Project verification OK."


      # 15. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Installing pnpm dependencies..."

          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install \
              --frozen-lockfile \
              --allow-build=esbuild
          else
            pnpm install \
              --allow-build=esbuild
          fi

          echo ""
          echo "Dependencies installed successfully."


      # 16. Verify dependency tree
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Checking TanStack Query:"
          pnpm list @tanstack/react-query --depth 0 || true

          echo ""
          echo "Checking Zod:"
          pnpm list zod --depth 0 || true

          echo ""
          echo "Dependency verification complete."


      # 17. Fix native Kotlin compatibility
      - name: Fix native Kotlin compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ -f "$FILE" ]; then
            sed -i 's/ResolveInfoFlags.of(0)/ResolveInfoFlags.of(0L)/g' "$FILE"
            echo "Kotlin compatibility fix applied."
          fi


      # 18. Verify Accessibility Kotlin
      - name: Verify Accessibility Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          if [ -f "$FILE" ]; then
            echo "Accessibility service found:"
            echo "$FILE"

            grep -n "screenSnapshot" "$FILE" || true
            grep -n "pressImeEnter" "$FILE" || true
            grep -n "scrollScreen" "$FILE" || true
          else
            echo "WARNING: Accessibility service source not found."
          fi


      # 19. Prepare Gradle
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # 20. Check build environment
      - name: Check build environment
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD ENVIRONMENT"
          echo "======================================"

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "SDK Manager:"
          "$SDKMANAGER" --version

          echo ""
          echo "======================================"


      # 21. Build Release APK
      - name: Build Abir AI 4.5.1 Release APK
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING ABIR AI 4.5.1"
          echo "======================================"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle build completed."


      # 22. Find generated APK
      - name: Find generated APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print


      # 23. Prepare final APK
      - name: Prepare final APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*release*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            APK=$(find android \
              -type f \
              -name "*.apk" \
              -print \
              -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-4.5.1-release.apk"

          echo ""
          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh \
            "$GITHUB_WORKSPACE/release/Abir-AI-4.5.1-release.apk"


      # 24. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.5.1-release
          path: release/Abir-AI-4.5.1-release.apk
          if-no-files-found: error
          retention-days: 30


      # 25. Success
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       ABIR AI 4.5.1 SUCCESS"
          echo "======================================"
          echo ""
          echo "Version: 4.5.1"
          echo "Version Code: 23"
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.5.1-release.apk
          echo ""
          echo "======================================"
