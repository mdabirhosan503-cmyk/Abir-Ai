name: Build Abir AI 3.5.1 Custom Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 4. pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false


      # ==========================================
      # 5. Find 3.5.1 Source ZIP
      # ==========================================
      - name: Find Abir AI 3.5.1 Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI 3.5.1 SOURCE"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-3.5.1-Custom-Final.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: 3.5.1 SOURCE ZIP NOT FOUND!"
            echo ""
            echo "Expected:"
            echo "Bengali-Voice-Buddy-AbirAI-3.5.1-Custom-Final.zip"
            echo ""
            echo "Repository files:"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "SOURCE FOUND:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."


      # ==========================================
      # 6. Find Abir AI Project
      # ==========================================
      - name: Find Abir AI Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI PROJECT"
          echo "=========================================="

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit)

          # Fallback: search any package.json containing Android folder
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted \
              -type f \
              -name "package.json" \
              -exec sh -c '
                for f do
                  d=$(dirname "$f")
                  if [ -f "$d/android/gradlew" ]; then
                    echo "$f"
                    break
                  fi
                done
              ' sh {} + | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: ABIR AI PROJECT NOT FOUND!"
            echo ""
            find extracted -type f -name package.json -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "ABIR AI PROJECT:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 7. Check package.json
      # ==========================================
      - name: Check Project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "package.json: OK"
          echo "android/: OK"
          echo "android/gradlew: OK"

          chmod +x android/gradlew


      # ==========================================
      # 8. Install Dependencies
      # ==========================================
      - name: Install Dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo "Dependencies installed successfully."


      # ==========================================
      # 9. Fix Launcher Gradle Compatibility
      # ==========================================
      - name: Fix Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -path "*/abir-app-launcher/android/build.gradle" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Launcher Gradle not found. Skipping."
            exit 0
          fi

          echo "Launcher:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("ERROR: Android block not found")

          if "defaultConfig {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              defaultConfig {
                  versionName "3.5.1"
              }""",
                  1
              )
          elif "versionName" not in s:
              s = s.replace(
                  "defaultConfig {",
                  """defaultConfig {
                  versionName "3.5.1" """,
                  1
              )

          p.write_text(s)
          print("Launcher Gradle checked.")
          PY


      # ==========================================
      # 10. Fix Contacts Kotlin Compatibility
      # ==========================================
      - name: Fix Contacts Kotlin Compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAppLauncherModule.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Contacts module not found. Skipping."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0)",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0L.toLong())",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          p.write_text(s)

          print("Contacts compatibility checked.")
          PY


      # ==========================================
      # 11. Fix Accessibility Service
      # ==========================================
      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Accessibility Service not found. Skipping."
            exit 0
          fi

          echo "Accessibility Service:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          replacements = {
              "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
              "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)

          print("Accessibility compatibility checked.")
          PY


      # ==========================================
      # 12. Verify Memory 200
      # ==========================================
      - name: Verify Memory 200
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -path "*/assistant/localMemory.ts" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: localMemory.ts not found!"
            exit 1
          fi

          echo "Memory file:"
          echo "$FILE"

          if grep -q "MAX_MEMORY_ITEMS = 200" "$FILE"; then
            echo "PASS: Memory limit = 200"
          else
            echo "ERROR: Memory limit 200 not found!"
            grep -n "MAX_MEMORY" "$FILE" || true
            exit 1
          fi


      # ==========================================
      # 13. Verify Voice System
      # ==========================================
      - name: Verify Voice System
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING VOICE SYSTEM"
          echo "=========================================="

          for FILE in \
            assistant/voiceInput.ts \
            assistant/textToSpeech.ts \
            assistant/voiceSelection.ts \
            assistant/voicePreferences.ts \
            assistant/androidActions.ts
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "WARNING: $FILE not found."
            fi
          done


      # ==========================================
      # 14. Verify Smart Offline System
      # ==========================================
      - name: Verify Offline System
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING OFFLINE SYSTEM"
          echo "=========================================="

          for FILE in \
            assistant/offlineBrain.ts \
            assistant/commandEngine.ts \
            assistant/intentParser.ts \
            assistant/localMemory.ts
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "WARNING: $FILE not found."
            fi
          done


      # ==========================================
      # 15. Verify Online Gemini
      # ==========================================
      - name: Verify Gemini
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f "assistant/onlineAssistant.ts" ]; then
            echo "Gemini online assistant found."
          else
            echo "ERROR: onlineAssistant.ts not found!"
            exit 1
          fi


      # ==========================================
      # 16. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version


      # ==========================================
      # 17. Clean
      # ==========================================
      - name: Clean Android Build
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          ./gradlew clean --no-daemon


      # ==========================================
      # 18. Build Release APK
      # ==========================================
      - name: Build Abir AI 3.5.1 Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI 3.5.1"
          echo "=========================================="
          echo ""
          echo "Version: 3.5.1"
          echo "Offline: Enabled"
          echo "Online Gemini: Enabled"
          echo "Voice: Enabled"
          echo "Wake Word: Enabled"
          echo "Mobile Control: Enabled"
          echo "Camera: Enabled"
          echo "App Lock: Enabled"
          echo "Memory: 200"
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."


      # ==========================================
      # 19. Find APK
      # ==========================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR RELEASE APK"
          echo "=========================================="

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: RELEASE APK NOT FOUND!"

            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-3.5.1-Custom-Final.apk"

          ls -lh release/Abir-AI-3.5.1-Custom-Final.apk


      # ==========================================
      # 20. Upload APK
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-3.5.1-Custom-Final
          path: ${{ env.PROJECT }}/release/Abir-AI-3.5.1-Custom-Final.apk
          if-no-files-found: error
