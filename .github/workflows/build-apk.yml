name: Build Abir AI 5.4.24

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      EXTRACT_DIR: ${{ github.workspace }}/abir_extracted
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Verify build tools
        run: |
          set -euo pipefail
          node --version
          npm --version
          pnpm --version
          java -version

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Find Abir AI source ZIP
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
            \( -iname 'AbirAI-5.4.24*.zip' -o -iname 'Abir-AI-5.4.24*.zip' \) \
            -print | sort | tail -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Abir AI 5.4.24 source ZIP was not found."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f -iname '*.zip' -print || true
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verify and extract source ZIP
        run: |
          set -euo pipefail
          unzip -tq "$ZIP_FILE"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          find "$EXTRACT_DIR" -maxdepth 6 -type f \
            \( -name package.json -o -name pnpm-lock.yaml \
               -o -name gradlew -o -name settings.gradle \
               -o -name settings.gradle.kts \) \
            -print | sort | head -n 150

      - name: Detect app root and Android Gradle directory
        run: |
          set -euo pipefail
          PROJECT_ROOT=""
          GRADLE_DIR=""

          while IFS= read -r gradlew; do
            android_dir="$(dirname "$gradlew")"

            if [ ! -f "$android_dir/settings.gradle" ] && \
               [ ! -f "$android_dir/settings.gradle.kts" ]; then
              continue
            fi

            candidate="$android_dir"

            while [ "$candidate" != "$(dirname "$candidate")" ]; do
              if [ -f "$candidate/package.json" ]; then
                PROJECT_ROOT="$candidate"
                GRADLE_DIR="$android_dir"
                break 2
              fi
              candidate="$(dirname "$candidate")"
            done
          done < <(find "$EXTRACT_DIR" -type f -name gradlew -print | sort)

          if [ -z "$PROJECT_ROOT" ] || [ -z "$GRADLE_DIR" ]; then
            echo "::error::Could not locate app root and Android Gradle project."
            exit 1
          fi

          PROJECT_ROOT="$(cd "$PROJECT_ROOT" && pwd)"
          GRADLE_DIR="$(cd "$GRADLE_DIR" && pwd)"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "App root: $PROJECT_ROOT"
          echo "Gradle root: $GRADLE_DIR"

      - name: Verify app configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          test -f package.json

          node <<'NODE'
          const p = require('./package.json');
          const expo = p.dependencies?.expo || p.devDependencies?.expo;
          const rn = p.dependencies?.['react-native'] || p.devDependencies?.['react-native'];

          console.log('Package:', p.name || '(unnamed)');
          console.log('Version:', p.version || '(not specified)');
          console.log('Expo:', expo || 'MISSING');
          console.log('React Native:', rn || 'MISSING');

          if (!expo) throw new Error('Expo dependency missing');
          if (!rn) throw new Error('React Native dependency missing');
          NODE

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml not found."
            pnpm install --no-frozen-lockfile
          fi

      - name: Diagnose Expo configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail

          node -e "console.log('Expo:', require.resolve('expo/package.json'))"
          node -e "console.log('React Native:', require.resolve('react-native/package.json'))"

          pnpm exec expo --version

          pnpm exec expo config --type public --json \
            > "$GITHUB_WORKSPACE/expo-config.json"

          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(
            fs.readFileSync(process.env.GITHUB_WORKSPACE + '/expo-config.json', 'utf8')
          );
          console.log('Expo config OK:', config.name, config.slug, config.version);
          NODE

      - name: Prepare Android Gradle project
        run: |
          set -euo pipefail

          test -f "$GRADLE_DIR/gradlew"
          chmod +x "$GRADLE_DIR/gradlew"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$GRADLE_DIR/local.properties"

          touch "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.jvmargs=' "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            >> "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.daemon=' "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.daemon=false' >> "$GRADLE_DIR/gradle.properties"

          grep -q '^org.gradle.parallel=' "$GRADLE_DIR/gradle.properties" || \
            echo 'org.gradle.parallel=false' >> "$GRADLE_DIR/gradle.properties"

      - name: Apply Kotlin compatibility patch
        run: |
          set -euo pipefail

          find "$PROJECT_ROOT" \
            -path '*/node_modules' -prune -o \
            -type f \( -name '*.kt' -o -name '*.kts' -o -name '*.java' \) \
            -print0 |
            xargs -0 -r sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g'

      - name: Check Gradle configuration
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -euo pipefail

          ./gradlew --version 2>&1 | tee "$GITHUB_WORKSPACE/gradle-version.log"

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-config.log"

      - name: Build Release APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          set -euo pipefail

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      - name: Collect and verify APK
        if: success()
        run: |
          set -euo pipefail

          APK="$(find "$GRADLE_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print 2>/dev/null | sort | tail -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was found."
            find "$GRADLE_DIR" -path '*/build/outputs/*' -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          test -s "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"
          ls -lh "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: |
            expo-config.json
            gradle-version.log
            gradle-config.log
            abir-build.log
            abir_extracted/**/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
          
