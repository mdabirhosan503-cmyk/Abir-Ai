name: Build Abir AI 3.7.0 Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      - name: Extract FIXED2 source ZIP
        shell: bash
        run: |
          set -e

          ZIP="Bengali-Voice-Buddy-AbirAI-3.7.0-CodingAgent-Boss-FIXED2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            echo "ZIP files available:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using source: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found"
            find extracted -name package.json -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Found project:"
          echo "$PROJECT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

      # ---------------------------------------------------------
      # FIX 1: Launcher Gradle version
      # ---------------------------------------------------------
      - name: Fix launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          # Ensure android block exists
          if not re.search(r'^\s*android\s*\{', s, re.MULTILINE):
              raise SystemExit("ERROR: android { block not found")

          # If defaultConfig exists, update it.
          # Otherwise insert a new defaultConfig inside android.
          if re.search(r'^\s*defaultConfig\s*\{', s, re.MULTILINE):
              s = re.sub(
                  r'(\bdefaultConfig\s*\{)',
                  r'\1\n        versionCode 16\n        versionName "3.7.0"',
                  s,
                  count=1
              )

              # Remove duplicate versionCode/versionName lines created
              # by previous workflow runs, then keep the first correct pair.
              lines = s.splitlines()
              out = []
              seen_code = False
              seen_name = False

              for line in lines:
                  if re.search(r'^\s*versionCode\s+', line):
                      if seen_code:
                          continue
                      line = re.sub(
                          r'versionCode\s+\d+',
                          'versionCode 16',
                          line
                      )
                      seen_code = True

                  if re.search(r'^\s*versionName\s+', line):
                      if seen_name:
                          continue
                      line = re.sub(
                          r'versionName\s+"[^"]*"',
                          'versionName "3.7.0"',
                          line
                      )
                      seen_name = True

                  out.append(line)

              s = "\n".join(out) + "\n"

          else:
              s = re.sub(
                  r'(^\s*android\s*\{)',
                  r'''\1
              defaultConfig {
                  versionCode 16
                  versionName "3.7.0"
              }''',
                  s,
                  count=1,
                  flags=re.MULTILINE
              )

          p.write_text(s, encoding="utf-8")
          PY

          echo "========== Launcher Gradle =========="
          cat "$FILE"
          echo "====================================="

      # ---------------------------------------------------------
      # FIX 2: Contacts Kotlin
      # ---------------------------------------------------------
      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Contacts Kotlin file not found"
            exit 1
          fi

          sed -i \
            's/ResolveInfoFlags\.of(0[^L])/ResolveInfoFlags.of(0L)/g' \
            "$FILE"

          echo "Contacts Kotlin checked."

      # ---------------------------------------------------------
      # Accessibility compatibility
      # ---------------------------------------------------------
      - name: Fix Accessibility Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          if [ -f "$FILE" ]; then
            sed -i 's/AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED/32/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED/2048/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED/16/g' "$FILE"

            sed -i 's/AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED/32/g' "$FILE"
            sed -i 's/AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED/2048/g' "$FILE"
            sed -i 's/AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED/16/g' "$FILE"
          fi

          echo "Accessibility Kotlin checked."

      # ---------------------------------------------------------
      # IMPORTANT:
      # DO NOT REMOVE Coroutine
      # ---------------------------------------------------------
      - name: Verify Offline Speech Coroutine
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Kotlin launcher file not found"
            exit 1
          fi

          echo "========== Coroutine verification =========="

          grep -F \
            "import expo.modules.kotlin.functions.Coroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: Expo Coroutine import missing"
              exit 1
            }

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null || {
              echo "ERROR: recognizeOffline Coroutine builder missing"
              exit 1
            }

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: return@Coroutine missing"
              exit 1
            }

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null || {
              echo "ERROR: suspendCancellableCoroutine missing"
              exit 1
            }

          echo "Coroutine code is correct."
          echo "============================================"

      # ---------------------------------------------------------
      # App version
      # ---------------------------------------------------------
      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then
            python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r'versionCode\s+\d+',
              'versionCode 16',
              s,
              count=1
          )

          s = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "3.7.0"',
              s,
              count=1
          )

          p.write_text(s, encoding="utf-8")
          PY
          fi

          if [ -f app.json ]; then
            sed -i \
              's/"version": "[^"]*"/"version": "3.7.0"/' \
              app.json
          fi

          echo "App version fixed to 3.7.0."

      # ---------------------------------------------------------
      # Final verification
      # ---------------------------------------------------------
      - name: Final source verification
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          echo "========== Final Kotlin Check =========="

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null

          echo "OK: Coroutine builder present"

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null

          echo "OK: return@Coroutine present"

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null

          echo "OK: suspendCancellableCoroutine present"

          if grep -Eq \
            'ResolveInfoFlags\.of\(0\)' \
            "$FILE"; then
            echo "ERROR: old ResolveInfoFlags.of(0) still exists"
            exit 1
          fi

          if grep -Fq \
            "ResolveInfoFlags.of(0L)" \
            "$FILE"; then
            echo "OK: ResolveInfoFlags uses 0L"
          else
            echo "WARNING: ResolveInfoFlags.of(0L) not found"
          fi

          echo "========================================"

      # ---------------------------------------------------------
      # Gradle
      # ---------------------------------------------------------
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          java -version

          ./gradlew --version

      # ---------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
          NODE_ENV: production
        shell: bash
        run: |
          set -e

          echo "========== Cleaning =========="
          ./gradlew clean --no-daemon

          echo "========== Building Release APK =========="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # Find APK
      # ---------------------------------------------------------
      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found"
            echo "Available APK files:"
            find android -type f -name "*.apk" -print
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/Abir-AI-3.7.0-release.apk

          echo ""
          echo "========== APK =========="
          ls -lh release/Abir-AI-3.7.0-release.apk
          echo "========================="

      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-3.7.0-release
          path: ${{ env.PROJECT }}/release/Abir-AI-3.7.0-release.apk
          if-no-files-found: error
