name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      ZIP_NAME: "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION.zip"
      UNPACK_DIR: "${{ github.workspace }}/abir_extracted"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. NODE 20
      #
      # IMPORTANT:
      # No pnpm cache is used here.
      # This prevents setup-node cache path errors when a lockfile
      # is missing or located inside the extracted project.
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ============================================================
      # 4. PNPM
      # ============================================================

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ============================================================
      # 5. VERIFY NODE / PNPM
      # ============================================================

      - name: Verify Node and pnpm
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "NODE / PNPM"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "pnpm executable:"
          command -v pnpm

          echo ""
          echo "=========================================="


      # ============================================================
      # 6. BUILD ENVIRONMENT
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner:"
          uname -a

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"


      # ============================================================
      # 7. LOCATE ANDROID SDK MANAGER
      # ============================================================

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER=""

          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                -print 2>/dev/null |
              sort -V |
              tail -n 1 || true
            )"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager not found."

            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 6 \
              -type f \
              -name "sdkmanager" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 8. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."


      # ============================================================
      # 9. INSTALL ANDROID SDK
      #
      # IMPORTANT:
      # NEVER install the obsolete "tools" package.
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "Verifying Android SDK..."

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          test -x "$ANDROID_SDK_ROOT/platform-tools/adb"

          echo ""
          echo "Android SDK verification PASSED."


      # ============================================================
      # 10. FIND ABIR AI ZIP
      # ============================================================

      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_ZIP=""

          # Exact expected ZIP first.
          if [[ -f "$GITHUB_WORKSPACE/$ZIP_NAME" ]]; then
            BEST_ZIP="$GITHUB_WORKSPACE/$ZIP_NAME"
          fi

          # Search repository recursively if not in root.
          if [[ -z "$BEST_ZIP" ]]; then
            BEST_ZIP="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$ZIP_NAME" \
                -not -path '*/abir_extracted/*' \
                -print -quit 2>/dev/null || true
            )"
          fi

          # Compatible 5.4.24 ZIP fallback.
          if [[ -z "$BEST_ZIP" ]]; then
            echo "Exact ZIP not found."
            echo "Searching compatible 5.4.24 ZIP..."

            BEST_ZIP="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name 'AbirAI-5.4.24-*.zip' \
                -not -path '*/abir_extracted/*' \
                -print -quit 2>/dev/null || true
            )"
          fi

          if [[ -z "$BEST_ZIP" ]]; then
            echo ""
            echo "ERROR: Abir AI ZIP not found."
            echo ""

            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path '*/abir_extracted/*' \
              -print || true

            echo ""
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 4 \
              -type f \
              -print | head -300 || true

            exit 1
          fi

          echo ""
          echo "Selected Abir AI ZIP:"
          echo "$BEST_ZIP"

          echo "ABIR_ZIP=$BEST_ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY ZIP
      # ============================================================

      - name: Verify Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."

          unzip -tq "$ABIR_ZIP"

          echo ""
          echo "ZIP integrity PASSED."

          ls -lh "$ABIR_ZIP"


      # ============================================================
      # 12. EXTRACT ABIR AI
      # ============================================================

      - name: Extract Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$UNPACK_DIR"
          mkdir -p "$UNPACK_DIR"

          unzip -oq "$ABIR_ZIP" -d "$UNPACK_DIR"

          echo ""
          echo "Extraction completed."

          echo ""
          echo "Top-level extracted files:"
          find "$UNPACK_DIR" \
            -maxdepth 2 \
            -type f \
            -print | head -200 || true


      # ============================================================
      # 13. DETECT ANDROID PROJECT
      # ============================================================

      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_DIR=""
          BEST_SCORE=-1

          while IFS= read -r -d '' GRADLEW; do

            ANDROID_DIR="$(dirname "$GRADLEW")"
            CANDIDATE="$(dirname "$ANDROID_DIR")"

            if [[ ! -f "$CANDIDATE/package.json" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/app/build.gradle" &&
                  ! -f "$ANDROID_DIR/app/build.gradle.kts" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/settings.gradle" &&
                  ! -f "$ANDROID_DIR/settings.gradle.kts" ]]; then
              continue
            fi

            SCORE=0

            if [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" ]]; then
              SCORE=$((SCORE + 3))
            fi

            if [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]]; then
              SCORE=$((SCORE + 3))
            fi

            if [[ -f "$CANDIDATE/modules/abir-app-launcher/android/build.gradle" ]]; then
              SCORE=$((SCORE + 4))
            fi

            if [[ -f "$CANDIDATE/modules/abir-app-launcher/expo-module.config.json" ]]; then
              SCORE=$((SCORE + 2))
            fi

            VERSION="$(
              node -p "require('$CANDIDATE/package.json').version" \
              2>/dev/null || echo ""
            )"

            if [[ "$VERSION" == "$ABIR_VERSION" ]]; then
              SCORE=$((SCORE + 10))
            fi

            echo ""
            echo "------------------------------------------"
            echo "Candidate:"
            echo "$CANDIDATE"
            echo "Version:"
            echo "$VERSION"
            echo "Score:"
            echo "$SCORE"
            echo "------------------------------------------"

            if (( SCORE > BEST_SCORE )); then
              BEST_SCORE=$SCORE
              BEST_DIR="$CANDIDATE"
            fi

          done < <(
            find "$UNPACK_DIR" \
              -type f \
              -path '*/android/gradlew' \
              -print0
          )

          if [[ -z "$BEST_DIR" ]]; then

            echo ""
            echo "ERROR: Android project not found."

            echo ""
            echo "Possible project files:"

            find "$UNPACK_DIR" \
              -maxdepth 10 \
              \( \
                -name package.json \
                -o -name gradlew \
                -o -name settings.gradle \
                -o -name settings.gradle.kts \
              \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTED PROJECT"
          echo "=========================================="
          echo "$BEST_DIR"

          echo "PROJECT_ROOT=$BEST_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 14. VERIFY PROJECT
      # ============================================================

      - name: Verify Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Project root:"
          pwd

          VERSION="$(
            node -p "require('./package.json').version"
          )"

          echo ""
          echo "Abir AI version:"
          echo "$VERSION"

          if [[ "$VERSION" != "$ABIR_VERSION" ]]; then
            echo "ERROR: Expected version $ABIR_VERSION"
            exit 1
          fi

          test -f android/gradlew

          if [[ ! -f android/app/build.gradle &&
                ! -f android/app/build.gradle.kts ]]; then
            echo "ERROR: Android app Gradle file missing."
            exit 1
          fi

          if [[ ! -f android/settings.gradle &&
                ! -f android/settings.gradle.kts ]]; then
            echo "ERROR: Android settings Gradle file missing."
            exit 1
          fi

          APP_GRADLE="android/app/build.gradle"

          if [[ ! -f "$APP_GRADLE" ]]; then
            APP_GRADLE="android/app/build.gradle.kts"
          fi

          echo ""
          echo "Checking Android versionName..."

          if ! grep -Eq \
            "versionName[[:space:]]*[=]?[[:space:]]*['\"]${ABIR_VERSION}['\"]" \
            "$APP_GRADLE"; then

            echo "ERROR: Android versionName mismatch."

            grep -n "versionName" "$APP_GRADLE" || true

            exit 1
          fi

          echo ""
          echo "Project verification PASSED."


      # ============================================================
      # 15. CHECK WORKSPACE DEPENDENCIES
      # ============================================================

      - name: Check workspace dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          if grep -Rqs \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '@workspace/api-client-react' \
            package.json \
            pnpm-lock.yaml \
            2>/dev/null; then

            echo "ERROR:"
            echo "@workspace/api-client-react detected."

            exit 1
          fi

          echo "Workspace dependency check PASSED."


      # ============================================================
      # 16. CHECK PNPM LOCKFILE
      #
      # No setup-node cache depends on this.
      # It is only reported here for diagnostics.
      # ============================================================

      - name: Check pnpm lockfile
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          if [[ -f pnpm-lock.yaml ]]; then
            echo "pnpm-lock.yaml found."
            ls -lh pnpm-lock.yaml
          else
            echo "WARNING: pnpm-lock.yaml not found."
            echo "pnpm install will continue with --no-frozen-lockfile."
          fi


      # ============================================================
      # 17. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed successfully."


      # ============================================================
      # 18. VERIFY EXPO / REACT NATIVE / CAMERA
      # ============================================================

      - name: Verify Expo React Native and Camera
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "Package versions:"

          node <<'NODE'
          const p = require('./package.json');

          for (const name of [
            'expo',
            'react-native',
            'expo-camera'
          ]) {
            const version =
              p.dependencies?.[name] ||
              p.devDependencies?.[name] ||
              'NOT DECLARED';

            console.log(`${name}: ${version}`);
          }
          NODE

          echo ""
          echo "Checking Expo CLI..."

          if pnpm exec expo --version; then
            echo "Expo CLI is available."
          else
            echo "WARNING: Expo CLI check unavailable."
            echo "Continuing with native Android build."
          fi


      # ============================================================
      # 19. PREPARE ANDROID PROJECT
      # ============================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > android/local.properties

          chmod +x android/gradlew

          echo "Android SDK configured."

          echo ""
          echo "local.properties:"
          cat android/local.properties

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "ERROR: Gradle wrapper JAR missing."
            exit 1
          fi

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          echo ""
          echo "Gradle wrapper properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 20. KOTLIN COMPATIBILITY FIX
      # ============================================================

      - name: Apply Kotlin compatibility fix
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          FOUND=0

          while IFS= read -r -d '' FILE; do

            echo "Patching:"
            echo "$FILE"

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$FILE"

            FOUND=1

          done < <(
            grep -RIlZ \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              'ResolveInfoFlags\.of(0)' \
              modules \
              android \
              2>/dev/null || true
          )

          if [[ "$FOUND" -eq 1 ]]; then
            echo "Kotlin compatibility patch applied."
          else
            echo "No Kotlin compatibility patch required."
          fi


      # ============================================================
      # 21. GRADLE CONFIGURATION
      # ============================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

          echo "Gradle configured."


      # ============================================================
      # 22. GRADLE CACHE
      # ============================================================

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 23. CHECK GRADLE
    
