name: Build Abir AI 3.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Find Source ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'Bengali-Voice-Buddy-AbirAI-3.7.0-CodingAgent-Boss.zip' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found."
            echo "Expected:"
            echo "Bengali-Voice-Buddy-AbirAI-3.7.0-CodingAgent-Boss.zip"
            echo ""
            echo "Available ZIP files:"
            find . -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Abir Project
        shell: bash
        run: |
          set -e

          PROJECT_JSON="$(find extracted \
            -type f \
            -path '*/artifacts/abir-ai/package.json' \
            -print -quit)"

          if [ -z "$PROJECT_JSON" ]; then
            PROJECT_JSON="$(find extracted \
              -type f \
              -name 'package.json' \
              -print0 |
              while IFS= read -r -d '' file; do
                dir="$(dirname "$file")"

                if [ -f "$dir/android/gradlew" ]; then
                  echo "$file"
                  break
                fi
              done)"
          fi

          if [ -z "$PROJECT_JSON" ]; then
            echo "ERROR: Abir AI project not found."
            find extracted -type f -name "package.json" -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_JSON")"

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Abir project:"
          echo "$PROJECT_DIR"

      - name: Verify Project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "package.json: OK"
          echo "android/: OK"
          echo "gradlew: OK"

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

      - name: Fix Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="$(find . \
            -type f \
            -path '*/abir-app-launcher/android/build.gradle' \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "Launcher Gradle not found."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text()

if "android {" not in text:
    raise SystemExit("Android block not found")

if "defaultConfig {" not in text:
    text = text.replace(
        "android {",
        """android {
    defaultConfig {
        versionName "3.7.0"
    }""",
        1
    )
elif "versionName" not in text:
    text = text.replace(
        "defaultConfig {",
        """defaultConfig {
        versionName "3.7.0" """,
        1
    )

path.write_text(text)

print("Launcher Gradle fixed.")
PY

      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="$(find . \
            -type f \
            -name 'AbirAppLauncherModule.kt' \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "Contacts module not found."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text()

text = text.replace(
    "PackageManager.ResolveInfoFlags.of(0)",
    "PackageManager.ResolveInfoFlags.of(0L)"
)

text = text.replace(
    "PackageManager.ResolveInfoFlags.of(0L.toLong())",
    "PackageManager.ResolveInfoFlags.of(0L)"
)

path.write_text(text)

print("Contacts Kotlin fixed.")
PY

      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="$(find . \
            -type f \
            -name 'AbirAccessibilityService.kt' \
            -print -quit)"

          if [ -z "$FILE" ]; then
            echo "Accessibility service not found."
            exit 0
          fi

          python3 - "$FILE" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text()

replacements = {
    "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
    "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
    "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
    "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
    "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
    "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
}

for old, new in replacements.items():
    text = text.replace(old, new)

path.write_text(text)

print("Accessibility service fixed.")
PY

      - name: Fix Android Version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
from pathlib import Path
import json
import re

VERSION = "3.7.0"
VERSION_CODE = 16

app_json = Path("app.json")

if app_json.exists():
    data = json.loads(app_json.read_text())

    expo = data.setdefault("expo", {})
    expo["version"] = VERSION

    android = expo.setdefault("android", {})
    android["versionCode"] = VERSION_CODE

    app_json.write_text(
        json.dumps(data, indent=2, ensure_ascii=False) + "\n"
    )

    print("app.json updated.")

gradle = Path("android/app/build.gradle")

if gradle.exists():
    text = gradle.read_text()

    text = re.sub(
        r"versionCode\s+\d+",
        f"versionCode {VERSION_CODE}",
        text,
        count=1
    )

    text = re.sub(
        r'versionName\s+["\'][^"\']+["\']',
        f'versionName "{VERSION}"',
        text,
        count=1
    )

    gradle.write_text(text)

    print("android/app/build.gradle updated.")
PY

      - name: Verify Abir Features
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Checking Abir AI features..."

          REQUIRED_FILES="
          assistant/offlineBrain.ts
          assistant/onlineAssistant.ts
          assistant/voiceInput.ts
          assistant/textToSpeech.ts
          assistant/voiceSelection.ts
          assistant/voicePreferences.ts
          assistant/androidActions.ts
          assistant/intentParser.ts
          assistant/localMemory.ts
          assistant/commandEngine.ts
          "

          for FILE in $REQUIRED_FILES; do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "WARNING: $FILE not found."
            fi
          done

      - name: Verify Memory
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="assistant/localMemory.ts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: localMemory.ts missing."
            exit 1
          fi

          if grep -q "MAX_MEMORY_ITEMS = 200" "$FILE"; then
            echo "Memory 200: OK"
          else
            echo "Memory 200 constant not found."
            grep -n "MAX_MEMORY" "$FILE" || true
          fi

      - name: Verify Gemini
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "assistant/onlineAssistant.ts" ]; then
            echo "ERROR: Gemini assistant missing."
            exit 1
          fi

          echo "Gemini assistant: OK"

      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      - name: Clean Android Build
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean --no-daemon

      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI 3.7.0"
          echo "=========================================="

          echo "Version: 3.7.0"
          echo "Version Code: 16"
          echo "Offline: Enabled"
          echo "Online Gemini: Enabled"
          echo "Voice: Enabled"
          echo "Wake Word: Enabled"
          echo "Mobile Control: Enabled"
          echo "Camera: Enabled"
          echo "App Lock: Enabled"
          echo "Coding Agent: Enabled"
          echo "Boss Mode: Enabled"
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."

      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK="$(find android \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-3.7.0-CodingAgent-Boss.apk"

          ls -lh \
            "release/Abir-AI-3.7.0-CodingAgent-Boss.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-3.7.0-CodingAgent-Boss
          path: ${{ env.PROJECT }}/release/Abir-AI-3.7.0-CodingAgent-Boss.apk
          if-no-files-found: error
