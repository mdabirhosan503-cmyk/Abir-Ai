name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. BASIC SYSTEM INFO
      # ============================================================
      - name: Show runner information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ABIR AI BUILD RUNNER"
          echo "=============================================="

          echo "OS:"
          uname -a

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository:"
          echo "$GITHUB_WORKSPACE"

          echo ""
          echo "Repository files:"
          find "$GITHUB_WORKSPACE" \
            -maxdepth 4 \
            -type f \
            -print \
            | head -300 || true


      # ============================================================
      # 3. NODE.JS
      #
      # IMPORTANT:
      # No npm cache.
      # Project does not necessarily contain package-lock.json.
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"


      # ============================================================
      # 4. JAVA 17
      #
      # IMPORTANT:
      # setup-java v5
      # NO cache: gradle
      #
      # Gradle project may be inside the Abir AI ZIP.
      # Therefore Java must NOT try to scan the repository
      # for Gradle files at this stage.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 5. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 6. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ANDROID SDK SETUP"
          echo "=============================================="

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path was not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."


      # ============================================================
      # 7. LOCATE ABIR AI PROJECT
      #
      # Supports:
      #
      # A) repository/android/gradlew
      # B) repository/gradlew
      # C) AbirAI-*.zip
      # D) any *.zip as fallback
      # ============================================================
      - name: Locate Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"

          mkdir -p "$EXTRACT"

          echo "=============================================="
          echo "LOCATING ABIR AI PROJECT"
          echo "=============================================="

          WRAPPER=""

          # ----------------------------------------------------------
          # Direct Android project
          # ----------------------------------------------------------

          if [ -f "$WORK/android/gradlew" ]; then

            echo "Direct Android project found:"
            echo "$WORK/android"

            WRAPPER="$WORK/android/gradlew"

          elif [ -f "$WORK/gradlew" ]; then

            echo "Root Gradle wrapper found:"
            echo "$WORK/gradlew"

            WRAPPER="$WORK/gradlew"

          else

            # --------------------------------------------------------
            # Find Abir AI ZIP
            # --------------------------------------------------------

            echo "No direct Gradle wrapper found."
            echo "Searching for project ZIP..."

            ZIP_FILE="$(
              find "$WORK" \
                -type f \
                -name "AbirAI-*.zip" \
                ! -path "*/.git/*" \
                -print \
                | sort \
                | tail -n 1
            )"

            # --------------------------------------------------------
            # Fallback to any ZIP
            # --------------------------------------------------------

            if [ -z "${ZIP_FILE:-}" ]; then

              ZIP_FILE="$(
                find "$WORK" \
                  -type f \
                  -name "*.zip" \
                  ! -path "*/.git/*" \
                  -print \
                  | sort \
                  | tail -n 1
              )

            fi

            if [ -z "${ZIP_FILE:-}" ]; then

              echo "::error::No Abir AI project ZIP was found."

              echo ""
              echo "Repository contents:"

              find "$WORK" \
                -maxdepth 8 \
                -type f \
                -print \
                | head -500 || true

              exit 1

            fi

            echo ""
            echo "Selected ZIP:"
            echo "$ZIP_FILE"

            echo ""
            echo "ZIP information:"
            unzip -l "$ZIP_FILE" | head -100 || true

            echo ""
            echo "Extracting project..."

            unzip -oq "$ZIP_FILE" -d "$EXTRACT"

            echo ""
            echo "Searching extracted project for Gradle wrapper..."

            WRAPPER="$(
              find "$EXTRACT" \
                -type f \
                -name "gradlew" \
                ! -path "*/node_modules/*" \
                -print \
                | head -n 1
            )

          fi


          # ----------------------------------------------------------
          # Validate wrapper
          # ----------------------------------------------------------

          if [ -z "${WRAPPER:-}" ] || [ ! -f "$WRAPPER" ]; then

            echo "::error::Gradle wrapper (gradlew) was not found."

            echo ""
            echo "Searching for Gradle-related files..."

            find "$WORK" "$EXTRACT" \
              -type f \
              \( \
                -name "gradlew" \
                -o -name "gradle-wrapper.properties" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "package.json" \
              \) \
              -print \
              | head -500 || true

            exit 1

          fi


          # ----------------------------------------------------------
          # Determine Android directory
          # ----------------------------------------------------------

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"

          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"


          # ----------------------------------------------------------
          # Find package.json above Android directory
          # ----------------------------------------------------------

          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          while [ "$CURRENT" != "/" ]; do

            if [ -f "$CURRENT/package.json" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi

            CURRENT="$(dirname "$CURRENT")"

          done


          # ----------------------------------------------------------
          # If package.json was not found above Android directory,
          # search the extracted project.
          # ----------------------------------------------------------

          if [ -z "$PROJECT_ROOT" ]; then

            PROJECT_ROOT="$(
              find "$EXTRACT" \
                -type f \
                -name "package.json" \
                ! -path "*/node_modules/*" \
                -print \
                | head -n 1 \
                | xargs -r dirname
            )"

          fi


          if [ -z "${PROJECT_ROOT:-}" ]; then

            echo "::error::package.json was not found."

            echo ""
            echo "Android directory contents:"

            find "$ANDROID_DIR" \
              -maxdepth 5 \
              -type f \
              -print \
              | head -300 || true

            exit 1

          fi


          # ----------------------------------------------------------
          # Validate Gradle wrapper properties
          # ----------------------------------------------------------

          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "::error::gradle-wrapper.properties was not found."

            echo ""
            echo "Expected:"
            echo "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

            echo ""
            echo "Available Gradle files:"

            find "$ANDROID_DIR" \
              -type f \
              \( \
                -name "gradlew" \
                -o -name "gradle-wrapper.properties" \
                -o -name "settings.gradle*" \
                -o -name "build.gradle*" \
              \) \
              -print || true

            exit 1

          fi


          # ----------------------------------------------------------
          # Export environment
          # ----------------------------------------------------------

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "PROJECT DETECTION SUCCESS"
          echo "=============================================="

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Gradle wrapper:"
          echo "$WRAPPER"


      # ============================================================
      # 8. SHOW PROJECT
      # ============================================================
      - name: Show detected project
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "DETECTED ABIR AI PROJECT"
          echo "=============================================="

          echo ""
          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "ANDROID_DIR:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Important files:"

          find "$PROJECT_ROOT" \
            -maxdepth 5 \
            -type f \
            \( \
              -name "package.json" \
              -o -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print \
            | sort \
            | head -300 || true


      # ============================================================
      # 9. INSTALL NPM DEPENDENCIES
      # ============================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "=============================================="
          echo "NPM INSTALL"
          echo "=============================================="

          if [ -f package-lock.json ]; then

            echo "package-lock.json found."
            npm ci --legacy-peer-deps

          elif [ -f npm-shrinkwrap.json ]; then

            echo "npm-shrinkwrap.json found."
            npm ci --legacy-peer-deps

          else

            echo "No lock file found."
            echo "Using npm install..."

            npm install --legacy-peer-deps

          fi

          echo ""
          echo "NPM dependencies installed successfully."


      # ============================================================
      # 10. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          echo "=============================================="
          echo "PREPARING GRADLE"
          echo "=============================================="

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ]; then

            echo "sdk.dir=$SDK_PATH" > local.properties

          fi

          echo ""
          echo "Gradle wrapper:"
          ls -lh gradlew

          echo ""
          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Testing Gradle..."

          ./gradlew --version


      # ============================================================
      # 11. CHECK LAUNCHER KOTLIN
      # ============================================================
      - name: Check Abir launcher Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER_FILE="$ANDROID_DIR/modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          echo "=============================================="
          echo "CHECKING ABIR APP LAUNCHER"
          echo "=============================================="

          if [ -f "$LAUNCHER_FILE" ]; then

            echo "Launcher found:"
            echo "$LAUNCHER_FILE"

            echo ""
            echo "Checking log functions..."

            grep -nE '\bln\s*\(|\blog\s*\(' \
              "$LAUNCHER_FILE" || true

            echo ""
            echo "Checking Math.log..."

            grep -nE 'Math\.log|kotlin\.math' \
              "$LAUNCHER_FILE" || true

          else

            echo "Launcher Kotlin file not found."
            echo "Continuing..."

          fi


      # ============================================================
      # 12. FIX OLD CONTACTS ALIAS
      # ============================================================
      - name: Fix launcher Contacts references
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER_FILE="$ANDROID_DIR/modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          echo "=============================================="
          echo "CONTACTS COMPATIBILITY CHECK"
          echo "=============================================="

          if [ ! -f "$LAUNCHER_FILE" ]; then

            echo "Launcher source not found."
            echo "Skipping Contacts compatibility fix."

            exit 0

          fi


          if grep -q \
            "val phone = ContactsContract.CommonDataKinds.Phone" \
            "$LAUNCHER_FILE"; then

            echo "Old Contacts alias detected."
            echo "Applying compatibility fix..."

            sed -i \
              '/val phone = ContactsContract.CommonDataKinds.Phone/d' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.CONTACT_ID/ContactsContract.CommonDataKinds.Phone.CONTACT_ID/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.DISPLAY_NAME/ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.NUMBER/ContactsContract.CommonDataKinds.Phone.NUMBER/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.TYPE/ContactsContract.CommonDataKinds.Phone.TYPE/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.LABEL/ContactsContract.CommonDataKinds.Phone.LABEL/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.CONTENT_URI/ContactsContract.CommonDataKinds.Phone.CONTENT_URI/g' \
              "$LAUNCHER_FILE"

            sed -i \
              's/phone\.getTypeLabel/ContactsContract.CommonDataKinds.Phone.getTypeLabel/g' \
              "$LAUNCHER_FILE"

            echo "Contacts compatibility fix completed."

          else

            echo "No old Contacts alias found."

          fi


      # ============================================================
      # 13. BUILD RELEASE APK
      # ============================================================
      - name: Build Abir AI Release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "=============================================="
          echo "BUILDING ABIR AI RELEASE APK"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

          echo ""
          echo "=============================================="
          echo "BUILD SUCCESSFUL"
          echo "=============================================="


      # ============================================================
      # 14. FIND APK
      # ============================================================
      - name: Collect release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/abir-apk"

          mkdir -p "$OUTPUT"

          echo "=============================================="
          echo "COLLECTING APK"
          echo "=============================================="

          mapfile -t APK_FILES < <(
            find "$ANDROID_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              ! -name "*-unsigned.apk" \
              -print \
              | sort
          )


          if [ "${#APK_FILES[@]}" -eq 0 ]; then

            echo "::error::No release APK was generated."

            echo ""
            echo "Searching all APK files..."

            find "$ANDROID_DIR" \
            
