name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        shell: bash
        run: |
          set -e

          corepack enable
          corepack prepare pnpm@12.14.0 --activate

          echo "pnpm version:"
          pnpm --version

      - name: Install dependencies
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy
        run: |
          set -e

          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Check Android project
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "Android project found"

      - name: Fix launcher Gradle version
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          BUILD_FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: Launcher build.gradle not found"
            exit 1
          fi

          echo "Launcher build.gradle found"

          if grep -q "versionName" "$BUILD_FILE"; then
            echo "versionName already exists"
          else
            perl -0pi -e 's/(namespace\s+"expo\.modules\.abirapp"\s*\n)/$1\n  defaultConfig {\n    versionName "1.0.0"\n  }\n/' "$BUILD_FILE"

            echo "versionName added"
          fi

          echo "Final launcher build.gradle:"
          cat "$BUILD_FILE"

      - name: Fix launcher Kotlin Contacts code
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          KOTLIN_FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$KOTLIN_FILE" ]; then
            echo "ERROR: Kotlin launcher file not found"
            exit 1
          fi

          echo "Fixing Contacts Kotlin code..."

          sed -i '/val phone = ContactsContract.CommonDataKinds.Phone/d' "$KOTLIN_FILE"

          sed -i 's/\bphone\.CONTACT_ID\b/ContactsContract.CommonDataKinds.Phone.CONTACT_ID/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.DISPLAY_NAME\b/ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.NUMBER\b/ContactsContract.CommonDataKinds.Phone.NUMBER/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.TYPE\b/ContactsContract.CommonDataKinds.Phone.TYPE/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.LABEL\b/ContactsContract.CommonDataKinds.Phone.LABEL/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.CONTENT_URI\b/ContactsContract.CommonDataKinds.Phone.CONTENT_URI/g' "$KOTLIN_FILE"
          sed -i 's/\bphone\.getTypeLabel\b/ContactsContract.CommonDataKinds.Phone.getTypeLabel/g' "$KOTLIN_FILE"

          echo "Contacts Kotlin code fixed."

          echo "Checking remaining phone references:"
          grep -n "phone\." "$KOTLIN_FILE" || true

          echo "Relevant Kotlin code:"
          sed -n '60,115p' "$KOTLIN_FILE"

      - name: Make Gradle executable
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          chmod +x gradlew

      - name: Build APK
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        env:
          NODE_ENV: production
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK_DIR="extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found"
            exit 1
          fi

          echo "APK files:"
          find "$APK_DIR" -type f -name "*.apk" -print

          APK_COUNT=$(find "$APK_DIR" -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated"
            exit 1
          fi

          echo "APK generated successfully!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-debug-apk
          path: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
