
name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "AbirAI-*.zip"
      - ".github/workflows/build-apk.yml"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="AbirAI-5.4.14-BANGLA-OFFLINE-SPEECH-FIX.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              -name 'AbirAI-*.zip' | head -n 1)"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Abir AI ZIP file not found in repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -f extracted/package.json ] || \
             [ ! -f extracted/android/gradlew ]; then
            echo "::error::ZIP must contain package.json and android/gradlew at its root."
            find extracted -maxdepth 3 -type f \
              \( -name package.json -o -name gradlew \)
            exit 1
          fi

          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted" \
            >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        working-directory: extracted
        run: pnpm install --no-frozen-lockfile

      - name: Check TypeScript
        working-directory: extracted
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build release APK
        working-directory: extracted/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleRelease

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          find extracted/android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*.apk' \
            -exec cp {} release/ \;

          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "::error::No release APK was generated."
            exit 1
          fi

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.14-Release-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
          
