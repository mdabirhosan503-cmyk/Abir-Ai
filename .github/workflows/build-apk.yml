name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          unzip -q Bengali-Voice-Buddy.zip -d extracted

          echo "Project extracted successfully"

      - name: Set project paths
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted/Bengali-Voice-Buddy/artifacts/abir-ai"
          ANDROID_DIR="$PROJECT_DIR/android"
          WORKSPACE_DIR="extracted/Bengali-Voice-Buddy"
          LAUNCHER_DIR="$PROJECT_DIR/modules/abir-app-launcher/android"

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          if [ ! -d "$LAUNCHER_DIR" ]; then
            echo "ERROR: abir-app-launcher Android module not found"
            find "$PROJECT_DIR" -maxdepth 5 -type d | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "WORKSPACE_DIR=$WORKSPACE_DIR" >> "$GITHUB_ENV"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR" >> "$GITHUB_ENV"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR"
          echo "LAUNCHER_DIR=$LAUNCHER_DIR"

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$WORKSPACE_DIR"

          corepack enable

          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Fix Abir App Launcher version
        shell: bash
        run: |
          set -e

          BUILD_FILE="$LAUNCHER_DIR/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: launcher build.gradle not found"
            exit 1
          fi

          echo "Launcher build file:"
          cat "$BUILD_FILE"

          if grep -q "versionName" "$BUILD_FILE"; then
            echo "versionName already exists"
          else
            echo "Adding defaultConfig with versionName..."

            sed -i '/android[[:space:]]*{/a\
  defaultConfig {\
    versionName "1.0.0"\
  }' "$BUILD_FILE"
          fi

          echo "Final launcher build.gradle:"
          cat "$BUILD_FILE"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
