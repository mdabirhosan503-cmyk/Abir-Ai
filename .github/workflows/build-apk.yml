
name: Build Abir AI 5.4.24 Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SOURCE_ZIP: "AbirAI-5.4.24-BLACK-RED-MAIN-UI-ALL-FEATURES-PRESERVED.zip"
      EXPECTED_SHA256: "e6cbb58af02e19373ae86cebcd762f9e5157f4893038dc93a245dab8e6e71474"
      PROJECT_DIR: "abir_work"
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: "27.1.12297006"

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Node.js 20
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Install Android SDK packages
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses || true

      # 7. Find source ZIP
      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Source ZIP not found: $SOURCE_ZIP"
            echo "Files in repository:"
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f | head -100
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/abir_build"
          cp "$ZIP_PATH" "$GITHUB_WORKSPACE/abir_build/source.zip"

      # 8. Verify SHA256
      - name: Verify source ZIP SHA256
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_SHA256="$(sha256sum abir_build/source.zip | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::ZIP SHA256 verification failed"
            exit 1
          fi

          echo "SHA256 verification successful."

      # 9. Extract ZIP
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p abir_extracted

          unzip -q abir_build/source.zip -d abir_extracted

          echo "Extracted project files:"
          find abir_extracted -maxdepth 3 -type f | head -150

      # 10. Locate Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r GRADLE_FILE; do
            ROOT="$(dirname "$GRADLE_FILE")/.."
            ROOT="$(realpath "$ROOT")"

            if [ -f "$ROOT/package.json" ] && \
               [ -f "$ROOT/android/gradlew" ]; then
              FOUND="$ROOT"
              break
            fi
          done < <(find abir_extracted -type f -path "*/android/gradlew")

          if [ -z "$FOUND" ]; then
            echo "::error::Android Expo project not found in ZIP."
            echo "Expected package.json and android/gradlew."
            find abir_extracted -maxdepth 5 -type f | head -250
            exit 1
          fi

          echo "PROJECT_PATH=$FOUND" >> "$GITHUB_ENV"
          echo "Found project: $FOUND"

      # 11. Check project files
      - name: Check project configuration
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f android/gradlew
          test -f android/build.gradle || \
            test -f android/build.gradle.kts

          echo "Project configuration found."

          node --version
          pnpm --version
          java -version

      # 12. Install dependencies
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          else
            echo "::error::pnpm-lock.yaml not found."
            exit 1
          fi

      # 13. Expo configuration
      - name: Check Expo configuration
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo config --type public

      # 14. Check Android SDK environment
      - name: Check Android SDK environment
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          sdkmanager --list_installed

      # 15. Prepare Gradle
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # 16. Gradle dependency check
      - name: Gradle dependency check
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:tasks --all

      # 17. Build Release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 18. Find generated APK
      - name: Locate Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          mkdir -p release-apk

          find "$APK_DIR" -type f -name "*.apk" -print

          APK_PATH="$(find "$APK_DIR" -type f \
            -name "*release*.apk" | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            APK_PATH="$(find "$APK_DIR" -type f \
              -name "*.apk" | head -n 1)"
          fi

          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK generated."
            exit 1
          fi

          cp "$APK_PATH" release-apk/AbirAI-5.4.24-release.apk

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          ls -lh release-apk/

      # 19. Upload APK
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release-apk/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 20. Upload build diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Logs
          path: |
            ${{ env.PROJECT_PATH }}/android/**/*.log
            ${{ env.PROJECT_PATH }}/android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
