name: Build Abir AI 4.1.0 Ultimate

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # JAVA
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================================================
      # NODE
      # =========================================================
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # =========================================================
      # PNPM
      # =========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      # =========================================================
      # FIND AND EXTRACT SOURCE ZIP
      # =========================================================
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.1.0-FIXED-v2.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: Source ZIP not found."
            echo ""
            echo "ZIP files found in repository:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo ""
          echo "Source extraction successful."
          echo "ZIP: $ZIP"

      # =========================================================
      # FIND ANDROID PROJECT
      # =========================================================
      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=""

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname || true)

          if [ -z "$PROJECT" ]; then
            while IFS= read -r PACKAGE; do
              DIR="$(dirname "$PACKAGE")"

              if [ -d "$DIR/android" ]; then
                PROJECT="$DIR"
                break
              fi
            done < <(find extracted -type f -name "package.json")
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI Android project not found."
            echo ""
            find extracted -maxdepth 5 -type d -name android -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo ""
          echo "Abir AI project:"
          echo "$PROJECT"

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo "Dependencies installed."

      # =========================================================
      # FIX LAUNCHER GRADLE
      # =========================================================
      - name: Fix launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Launcher Gradle file not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # Remove existing versionCode/versionName lines.
          text = re.sub(
              r'^\s*versionCode\s+\d+\s*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*versionName\s+"[^"]*"\s*$\n?',
              '',
              text,
              flags=re.MULTILINE
          )

          # Insert into existing defaultConfig.
          if re.search(
              r'^\s*defaultConfig\s*\{',
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r'(^\s*defaultConfig\s*\{)',
                  r'\1\n        versionCode 21\n        versionName "4.1.0"',
                  text,
                  count=1,
                  flags=re.MULTILINE
              )

          # Otherwise create defaultConfig inside android block.
          else:
              text = re.sub(
                  r'(^\s*android\s*\{)',
                  r'''\1
              defaultConfig {
                  versionCode 21
                  versionName "4.1.0"
              }''',
                  text,
                  count=1,
                  flags=re.MULTILINE
              )

          path.write_text(text, encoding="utf-8")
          print("Launcher Gradle fixed.")
          PY

      # =========================================================
      # FIX CONTACTS
      # =========================================================
      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: AbirAppLauncherModule.kt not found."
            exit 1
          fi

          sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
            "$FILE"

          echo "Contacts Kotlin compatibility fixed."

      # =========================================================
      # ACCESSIBILITY COMPATIBILITY
      # =========================================================
      - name: Fix Accessibility Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: AbirAccessibilityService.kt not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # -------------------------------------------------------
          # Replace unsupported IME accessibility action.
          # -------------------------------------------------------
          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER",
              "AccessibilityNodeInfo.ACTION_CLICK"
          )

          # -------------------------------------------------------
          # Replace horizontal scroll AccessibilityAction objects
          # with compile-safe integer action constants.
          # -------------------------------------------------------
          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_LEFT",
              "AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD"
          )

          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_RIGHT",
              "AccessibilityNodeInfo.ACTION_SCROLL_FORWARD"
          )

          # -------------------------------------------------------
          # If the original IME function is still present and
          # contains the problematic action, replace the complete
          # function with a safe fallback.
          # -------------------------------------------------------
          if "ACTION_IME_ENTER" in text:
              pattern = (
                  r'private fun pressImeEnterInternal\(\): Boolean \{'
                  r'.*?'
                  r'\n  \}\n\n'
                  r'  private fun scrollScreenInternal'
              )

              replacement = '''private fun pressImeEnterInternal(): Boolean {
              val root = rootInActiveWindow ?: return false

              val searchHints = listOf(
                  "search",
                  "সার্চ",
                  "খুঁজ",
                  "go",
                  "enter",
                  "done",
                  "অনুসন্ধান"
              )

              val button = nodes(root).firstOrNull {
                  it.isVisibleToUser &&
                    it.isClickable &&
                    searchHints.any { h ->
                      textOf(it).contains(h, ignoreCase = true)
                    }
              }

              if (button?.performAction(
                      AccessibilityNodeInfo.ACTION_CLICK
                  ) == true) {
                  return true
              }

              val focused = nodes(root).firstOrNull {
                  it.isVisibleToUser &&
                    it.isFocused &&
                    it.className?.toString()
                      ?.contains("EditText", true) == true
              }

              return focused?.performAction(
                  AccessibilityNodeInfo.ACTION_FOCUS
              ) == true
          }

          private fun scrollScreenInternal'''

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              if count != 1:
                  raise SystemExit(
                      "ERROR: Could not replace pressImeEnterInternal()."
                  )

          # Final cleanup.
          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER",
              "AccessibilityNodeInfo.ACTION_CLICK"
          )

          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_LEFT",
              "AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD"
          )

          text = text.replace(
              "AccessibilityNodeInfo.AccessibilityAction.ACTION_SCROLL_RIGHT",
              "AccessibilityNodeInfo.ACTION_SCROLL_FORWARD"
          )

          path.write_text(text, encoding="utf-8")

          print("Accessibility compatibility fix completed.")
          PY

      # =========================================================
      # VERIFY ACCESSIBILITY
      # =========================================================
      - name: Verify Accessibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          test -f "$FILE"

          if grep -Fq "ACTION_IME_ENTER" "$FILE"; then
            echo "ERROR: ACTION_IME_ENTER still exists."
            exit 1
          fi

          if grep -Fq "ACTION_SCROLL_LEFT" "$FILE"; then
            echo "ERROR: ACTION_SCROLL_LEFT still exists."
            exit 1
          fi

          if grep -Fq "ACTION_SCROLL_RIGHT" "$FILE"; then
            echo "ERROR: ACTION_SCROLL_RIGHT still exists."
            exit 1
          fi

          echo "Accessibility verification PASSED."

      # =========================================================
      # VERIFY COROUTINES
      # =========================================================
      - name: Verify Kotlin Coroutines
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          test -f "$FILE"

          grep -F \
            "import expo.modules.kotlin.functions.Coroutine" \
            "$FILE" >/dev/null

          grep -F \
            'AsyncFunction("recognizeOffline") Coroutine' \
            "$FILE" >/dev/null

          grep -F \
            'AsyncFunction("searchAndOpenInApp") Coroutine' \
            "$FILE" >/dev/null

          grep -F \
            "return@Coroutine" \
            "$FILE" >/dev/null

          grep -F \
            "suspendCancellableCoroutine" \
            "$FILE" >/dev/null

          echo "Coroutine verification PASSED."

      # =========================================================
      # FIX APP VERSION
      # =========================================================
      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then

            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode 21',
              text,
              count=1
          )

          text = re.sub(
              r'versionName\s+"[^"]*"',
              'versionName "4.1.0"',
              text,
              count=1
          )

          path.write_text(text, encoding="utf-8")
          PY

          fi

          if [ -f app.json ]; then
            sed -i \
              's/"version": "[^"]*"/"version": "4.1.0"/' \
              app.json
          fi

          echo "App version set to 4.1.0."

      # =========================================================
      # VERIFY IMPORTANT FEATURES
      # =========================================================
      - name: Verify Abir AI features
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          test -f assistant/offlineBrain.ts
          test -f assistant/intentParser.ts
          test -f assistant/onlineAssistant.ts

          echo "Core assistant files found."

          if grep -Rqs \
            "universalSearch\|typeText\|tapText\|scroll" \
            assistant modules; then
            echo "Universal screen control: detected"
          else
            echo "WARNING: Universal screen control not detected"
          fi

          if grep -Rqs \
            "volume\|flashlight\|screenshot\|quickSettings" \
            assistant modules; then
            echo "Device controls: detected"
          else
            echo "WARNING: Device controls not detected"
          fi

          if find modules \
            -name "WakeWordService.kt" \
            -print -quit | grep -q .; then
            echo "Wake word service: detected"
          else
            echo "WARNING: Wake word service not detected"
          fi

          echo "Feature verification completed."

      # =========================================================
      # PREPARE GRADLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          ./gradlew --version

      # =========================================================
      # BUILD RELEASE APK
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
          NODE_ENV: production
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CLEAN"
          echo "========================================"

          ./gradlew clean --no-daemon

          echo ""
          echo "========================================"
          echo "BUILD RELEASE APK"
          echo "========================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "========================================"
          echo "BUILD SUCCESS"
          echo "========================================"

      # =========================================================
      # FIND APK
      # =========================================================
      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."

            echo ""
            echo "Available APK files:"
            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            release/Abir-AI-4.1.0-release.apk

          echo ""
          echo "APK created:"
          ls -lh release/Abir-AI-4.1.0-release.apk

      # =========================================================
      # UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.1.0-release
          path: ${{ env.PROJECT }}/release/Abir-AI-4.1.0-release.apk
          if-no-files-found: error
