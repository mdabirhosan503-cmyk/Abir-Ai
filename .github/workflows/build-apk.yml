name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false


      # ==========================================
      # 5. Android SDK
      # ==========================================
      # IMPORTANT:
      # Do NOT chmod sdkmanager.
      # GitHub runner already provides sdkmanager.
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          # NEVER chmod sdkmanager.
          "$SDKMANAGER" --version

          # Accept licenses.
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          # Required Android packages.
          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==========================================
      # 6. Find 4.5.1 ZIP
      # ==========================================
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="AbirAI-4.5.1-Fixed.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found."

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 7. Extract source
      # ==========================================
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction complete."

          echo ""
          echo "Extracted project:"
          find extracted -maxdepth 2 -type f | sort | head -150


      # ==========================================
      # 8. Detect project directory
      # ==========================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Normal root-level project
          if [ -f "extracted/package.json" ] && \
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          # ZIP containing src/
          elif [ -f "extracted/src/package.json" ] && \
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          # Fallback: search
          else
            FOUND_PACKAGE=$(find extracted \
              -maxdepth 4 \
              -name package.json \
              -type f \
              | head -n 1)

            if [ -n "$FOUND_PACKAGE" ]; then
              PROJECT_DIR="$(dirname "$FOUND_PACKAGE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find Android project."

            echo ""
            echo "package.json files:"
            find extracted -name package.json -print

            echo ""
            echo "android directories:"
            find extracted -type d -name android -print

            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android directory not found in:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"


      # ==========================================
      # 9. Verify package.json
      # ==========================================
      - name: Verify JavaScript project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json

          echo "package.json found."

          node --version
          pnpm --version

          echo ""
          echo "Checking catalog references..."

          if grep -R '"catalog:' package.json 2>/dev/null; then
            echo ""
            echo "WARNING: catalog dependency still exists."
            echo "Trying normal dependency installation."
          else
            echo "No catalog dependency found."
          fi


      # ==========================================
      # 10. Install dependencies
      # ==========================================
      # IMPORTANT:
      # Do NOT use --frozen-lockfile here.
      # Do NOT create a fake pnpm catalog.
      # 4.5.1 should already contain fixed dependencies.
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing Abir AI dependencies..."

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo "Dependencies installed successfully."


      # ==========================================
      # 11. Verify important dependencies
      # ==========================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules exists."

          echo ""
          echo "Checking React Query..."

          node -e "
          try {
            const p=require('./node_modules/@tanstack/react-query/package.json');
            console.log('@tanstack/react-query:', p.version);
          } catch(e) {
            console.log('React Query package not directly installed.');
          }
          "

          echo ""
          echo "Checking Zod..."

          node -e "
          try {
            const p=require('./node_modules/zod/package.json');
            console.log('zod:', p.version);
          } catch(e) {
            console.log('Zod package not directly installed.');
          }
          "


      # ==========================================
      # 12. Android source compatibility
      # ==========================================
      - name: Fix Android source compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Applying safe Kotlin compatibility fixes..."

          if [ -d android ]; then

            find android \
              -name "*.kt" \
              -type f \
              -print0 |
            while IFS= read -r -d '' file; do

              sed -i \
                's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
                "$file" || true

            done

          fi

          echo "Compatibility check complete."


      # ==========================================
      # 13. Check Gradle
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          # This chmod is for OUR project file,
          # NOT Android sdkmanager.
          chmod +x ./gradlew

          echo "Gradle version:"
          ./gradlew --version


      # ==========================================
      # 14. Clean build
      # ==========================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 15. Build Release APK
      # ==========================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Building Abir AI 4.5.1"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Build finished."


      # ==========================================
      # 16. Locate APK
      # ==========================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find "${PROJECT_DIR}/android/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            "${PROJECT_DIR}/android/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==========================================
      # 17. Prepare artifact
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/Abir-AI-4.5.1-release.apk"

          echo "Final APK:"
          ls -lh "release/Abir-AI-4.5.1-release.apk"


      # ==========================================
      # 18. Upload APK
      # ==========================================
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.5.1-release
          path: release/Abir-AI-4.5.1-release.apk
          if-no-files-found: error


      # ==========================================
      # 19. Final summary
      # ==========================================
      - name: Build summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       ABIR AI 4.5.1 BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.5.1-release.apk
          echo ""
          echo "Artifact:"
          echo "Abir-AI-4.5.1-release"
          echo ""
          echo "=========================================="
