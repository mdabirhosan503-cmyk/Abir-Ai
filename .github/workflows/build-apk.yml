name: Build Abir AI 5.4.29 Vision File Intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abir-ai-android-build
  cancel-in-progress: true

env:
  ABIR_RELEASE_TAG: v5.4.28-source
  ABIR_SOURCE_ZIP: AbirAI-5.4.29-VISION-FILE-INTELLIGENCE-FIXED.zip

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Download correct source ZIP
      - name: Download Abir AI Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          echo "Downloading Abir AI source..."
          echo "Release: $ABIR_RELEASE_TAG"
          echo "File: $ABIR_SOURCE_ZIP"

          gh release download "$ABIR_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ABIR_SOURCE_ZIP" \
            --dir "$RUNNER_TEMP/abir-source"

          ZIP="$RUNNER_TEMP/abir-source/$ABIR_SOURCE_ZIP"

          if [ ! -s "$ZIP" ]; then
            echo "::error::Source ZIP not found or empty."
            exit 1
          fi

          echo "Source ZIP downloaded successfully."
          ls -lh "$ZIP"

      # 3. Extract and locate project
      - name: Extract and Locate Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/abir-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "$RUNNER_TEMP/abir-source/$ABIR_SOURCE_ZIP" \
            -d "$EXTRACT_DIR"

          PROJECT_ROOT=""

          while IFS= read -r -d '' FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/android/gradlew" ] &&
               [ -f "$CANDIDATE/android/gradle/wrapper/gradle-wrapper.properties" ] &&
               [ -f "$CANDIDATE/android/app/build.gradle" ]; then

              if [ -z "$PROJECT_ROOT" ] ||
                 [ "${#CANDIDATE}" -lt "${#PROJECT_ROOT}" ]; then
                PROJECT_ROOT="$CANDIDATE"
              fi
            fi
          done < <(
            find "$EXTRACT_DIR" -type f -name package.json -print0
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Abir AI Android project not found."

            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project detected:"
          echo "$PROJECT_ROOT"

          cd "$PROJECT_ROOT"
          ls -la

      # 4. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 5. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 6. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 7. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      # 8. Verify files
      - name: Verify Abir AI Project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          REQUIRED_FILES=(
            package.json
            android/gradlew
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/build.gradle
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

            echo "FOUND: $FILE"
          done

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          echo "Java:"
          java -version

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm lockfile found."
          else
            echo "::warning::pnpm-lock.yaml is missing."
          fi

      # 9. Install dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          pnpm install --no-frozen-lockfile

      # 10. Expo configuration
      - name: Check Expo Configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ -f app.json ] ||
             [ -f app.config.js ] ||
             [ -f app.config.ts ]; then

            pnpm exec expo config --type public
          else
            echo "Expo configuration not found."
          fi

      # 11. TypeScript diagnostics
      - name: TypeScript Diagnostics
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_ROOT"

          echo "Checking TypeScript..."

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
            TS_STATUS=$?

          elif [ -x node_modules/.bin/tsc ]; then
            pnpm exec tsc --noEmit
            TS_STATUS=$?

          else
            echo "TypeScript checker not available."
            TS_STATUS=0
          fi

          if [ "$TS_STATUS" -ne 0 ]; then
            echo "::warning::TypeScript errors detected. See the log above."
            echo "Continuing to Android build for further diagnostics."
          else
            echo "TypeScript check passed."
          fi

          exit 0

      # 12. Prepare Sherpa ONNX
      - name: Prepare Sherpa ONNX
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ -f scripts/prepare-sherpa.sh ]; then
            chmod +x scripts/prepare-sherpa.sh
            bash scripts/prepare-sherpa.sh
          else
            echo "Sherpa preparation script not found."
            echo "Checking existing native libraries."
          fi

      # 13. Verify voice files
      - name: Check Voice Engine Files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Checking Sherpa libraries..."

          for LIB in libsherpa-onnx-jni.so libonnxruntime.so; do
            if find android -type f -name "$LIB" -print -quit | grep -q .; then
              echo "FOUND: $LIB"
            else
              echo "::warning::Missing library: $LIB"
            fi
          done

          echo "Checking offline voice models..."

          for MODEL in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            if find . -type f -name "$MODEL" \
              -not -path './node_modules/*' \
              -print -quit | grep -q .; then
              echo "FOUND: $MODEL"
            else
              echo "::warning::Missing model: $MODEL"
            fi
          done

      # 14. Build APK
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT/android"

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 15. Locate APK
      - name: Find and Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          APK_DIR="android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Release APK directory not found."
            exit 1
          fi

          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK_PATH=$PROJECT_ROOT/$APK" >> "$GITHUB_ENV"

      # 16. Upload APK
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.29-Vision-File-Intelligence-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
