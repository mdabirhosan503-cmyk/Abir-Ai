
name: Build Abir AI 5.4.28

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Abir AI Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          gh release download v5.4.28-source \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AbirAI-5.4.28-BN-EN-BANGLISH-VOICE-UPDATED.zip" \
            --dir "$RUNNER_TEMP/abir-source"

          test -f "$RUNNER_TEMP/abir-source/AbirAI-5.4.28-BN-EN-BANGLISH-VOICE-UPDATED.zip"

          echo "Source ZIP downloaded successfully."

      - name: Extract and Locate Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/abir-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "$RUNNER_TEMP/abir-source/AbirAI-5.4.28-BN-EN-BANGLISH-VOICE-UPDATED.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_ROOT=""

          while IFS= read -r -d '' FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/android/gradlew" ] &&
               [ -f "$CANDIDATE/android/gradle/wrapper/gradle-wrapper.properties" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name package.json -print0)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project not found."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_ROOT"

          cd "$PROJECT_ROOT"
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
                           
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -f package.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Project files verified."

          node --version
          pnpm --version
          java -version

          echo "Checking package manager files..."

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm lockfile found."
          else
            echo "No pnpm lockfile. Will install without frozen lockfile."
          fi

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Check Expo Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f app.json ] || [ -f app.config.js ] || [ -f app.config.ts ]; then
            pnpm exec expo config --type public
          else
            echo "Expo configuration file not found. Skipping."
          fi

      - name: TypeScript Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
          else
            echo "No typecheck script. Skipping."
          fi

      - name: Prepare Sherpa ONNX
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f scripts/prepare-sherpa.sh ]; then
            chmod +x scripts/prepare-sherpa.sh
            bash scripts/prepare-sherpa.sh
          else
            echo "WARNING: Sherpa preparation script not found."
            echo "Continuing with the libraries already included in the source."
          fi

      - name: Check Sherpa Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          for lib in libsherpa-onnx-jni.so libonnxruntime.so; do
            if find android -type f -name "$lib" -print -quit | grep -q .; then
              echo "FOUND: $lib"
            else
              echo "WARNING: $lib not found in Android source."
            fi
          done

          for model in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            if find . -type f -name "$model" -print -quit | grep -q .; then
              echo "FOUND: $model"
            else
              echo "WARNING: $model not found in source."
            fi
          done

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find and Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APK_DIR="android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory not found."
            exit 1
          fi

          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK_PATH=$PROJECT_ROOT/$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Release-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
          
