name: Build Abir AI Power Offline Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Find and Extract NEW Abir AI Source
      # ==========================================
      - name: Extract Abir AI 3.1.0 Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI 3.1.0 SOURCE"
          echo "=========================================="

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-3.1.0-PowerOffline-Fixed.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: NEW ABIR AI SOURCE ZIP NOT FOUND!"
            echo ""
            echo "Expected EXACT filename:"
            echo "Bengali-Voice-Buddy-AbirAI-3.1.0-PowerOffline-Fixed.zip"
            echo ""
            echo "Files currently in repository:"
            ls -lah
            exit 1
          fi

          echo ""
          echo "SOURCE ZIP FOUND:"
          echo "$ZIP_FILE"
          echo ""

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed successfully."


      # ==========================================
      # 4. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 5. Setup pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false


      # ==========================================
      # 6. Find Abir AI Project
      # ==========================================
      - name: Find Abir AI Project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI PROJECT"
          echo "=========================================="

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo ""
            echo "ERROR: ABIR AI PROJECT NOT FOUND!"
            echo ""
            echo "Available package.json files:"
            find extracted -type f -name package.json
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "ABIR AI PROJECT:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 7. Install Dependencies
      # ==========================================
      - name: Install Dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo "Dependencies installed successfully."


      # ==========================================
      # 8. Check Android Project
      # ==========================================
      - name: Check Android Project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew NOT FOUND!"
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project found."


      # ==========================================
      # 9. Fix Android Module versionName
      # ==========================================
      - name: Fix Android Module Versions
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING ANDROID MODULES"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          files = (
              list(root.rglob("build.gradle"))
              + list(root.rglob("build.gradle.kts"))
          )

          for p in files:

              try:
                  s = p.read_text()
              except Exception:
                  continue

              if "android {" not in s:
                  continue

              # Groovy
              if p.name == "build.gradle":

                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n'
                              '        versionName "3.1.0"',
                              1
                          )

                  else:

                      s = s.replace(
                          "android {",
                          'android {\n'
                          '    defaultConfig {\n'
                          '        versionName "3.1.0"\n'
                          '    }',
                          1
                      )

              # Kotlin DSL
              elif p.name == "build.gradle.kts":

                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n'
                              '        versionName = "3.1.0"',
                              1
                          )

                  else:

                      s = s.replace(
                          "android {",
                          'android {\n'
                          '    defaultConfig {\n'
                          '        versionName = "3.1.0"\n'
                          '    }',
                          1
                      )

              p.write_text(s)

          print("Android module version check completed.")
          PY


      # ==========================================
      # 10. Fix Abir App Launcher Gradle
      # ==========================================
      - name: Fix Abir App Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find modules \
            -type f \
            -path "*/abir-app-launcher/android/build.gradle" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Launcher Gradle not found."
            exit 0
          fi

          echo "Launcher Gradle:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "android {" not in s:
              raise SystemExit("ERROR: android block not found")

          if "defaultConfig {" not in s:

              s = s.replace(
                  "android {",
                  'android {\n'
                  '    defaultConfig {\n'
                  '        versionName "3.1.0"\n'
                  '    }',
                  1
              )

          elif "versionName" not in s:

              s = s.replace(
                  "defaultConfig {",
                  'defaultConfig {\n'
                  '        versionName "3.1.0"',
                  1
              )

          p.write_text(s)

          print("Launcher Gradle fixed.")
          PY


      # ==========================================
      # 11. Fix Accessibility Service
      # ==========================================
      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING ACCESSIBILITY SERVICE"
          echo "=========================================="

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Accessibility Service not found."
            exit 0
          fi

          echo "Accessibility Service:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "import android.view.accessibility.AccessibilityEvent" not in s:

              marker = "import android.view.accessibility.AccessibilityNodeInfo"

              if marker in s:
                  s = s.replace(
                      marker,
                      "import android.view.accessibility.AccessibilityEvent\n"
                      + marker
                  )

          replacements = {
              "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
              "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)

          print("Accessibility Service check completed.")
          PY


      # ==========================================
      # 12. Fix Contacts Kotlin Compatibility
      # ==========================================
      - name: Fix Contacts Kotlin Compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAppLauncherModule.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Contacts module not found."
            exit 0
          fi

          echo "Contacts module:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0)",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0L.toLong())",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          p.write_text(s)

          print("Contacts compatibility check completed.")
          PY


      # ==========================================
      # 13. Verify Memory 200
      # ==========================================
      - name: Verify Memory 200
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING MEMORY LIMIT"
          echo "=========================================="

          FILE=$(find . \
            -type f \
            -path "*/assistant/localMemory.ts" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "WARNING: localMemory.ts not found."
            exit 0
          fi

          echo "Memory file:"
          echo "$FILE"

          if grep -q "MAX_MEMORY_ITEMS = 200" "$FILE"; then
            echo "PASS: Memory limit is 200."
          else
            echo "ERROR: Memory 200 limit was not found!"
            grep -n "MAX_MEMORY" "$FILE" || true
            exit 1
          fi


      # ==========================================
      # 14. Verify Offline Control Source
      # ==========================================
      - name: Verify Offline Control
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING POWER OFFLINE CONTROL"
          echo "=========================================="

          for FILE in \
            assistant/commandEngine.ts \
            assistant/offlineBrain.ts \
            assistant/voiceInput.ts \
            assistant/androidActions.ts \
            assistant/localMemory.ts
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "WARNING: $FILE not found."
            fi
          done

          echo ""
          echo "Offline source verification completed."


      # ==========================================
      # 15. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version


      # ==========================================
      # 16. Clean Build
      # ==========================================
      - name: Clean Android Build
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING BUILD"
          echo "=========================================="

          ./gradlew clean --no-daemon

          echo "Clean completed."


      # ==========================================
      # 17. Build Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI POWER OFFLINE"
          echo "=========================================="
          echo ""
          echo "Source: 3.1.0 Power Offline Fixed"
          echo "Memory: 200"
          echo "Language: Bengali + English"
          echo "Online AI: Gemini"
          echo "Offline Brain: Enabled"
          echo "Offline Control: Enabled"
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "=========================================="
          echo "BUILD COMPLETED"
          echo "=========================================="


      # ==========================================
      # 18. Find APK
      # ==========================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: RELEASE APK NOT FOUND!"
            echo ""

            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-2.9.0-Final.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh release/Abir-AI-2.9.0-Final.apk


      # ==========================================
      # 19. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-2.9.0-Final
          path: ${{ env.PROJECT }}/release/Abir-AI-2.9.0-Final.apk
          if-no-files-found: error
