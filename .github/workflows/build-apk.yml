name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AbirAI-*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: abir-ai-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.15 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND + EXTRACT ABIR AI ZIP
      # ============================================================
      - name: Find and extract Abir AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -name 'AbirAI-*.zip' \
            -print | sort | tail -n 1)"

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Abir AI ZIP file not found."
            echo "ZIP files found:"
            find . -maxdepth 3 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          # Normal project layout
          if [ -f "extracted/package.json" ] && \
             [ -f "extracted/android/gradlew" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          else
            # Search nested layout
            GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name gradlew \
              ! -path '*/node_modules/*' \
              -print | head -n 1)"

            if [ -n "${GRADLEW:-}" ]; then
              CANDIDATE="$(dirname "$(dirname "$GRADLEW")")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi
            fi
          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "::error::Could not locate Abir AI project."
            echo ""
            echo "Project files:"
            find extracted -maxdepth 6 -type f \
              \( -name package.json -o -name gradlew \) \
              -print || true
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::android/gradlew not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "ABIR AI PROJECT FOUND"
          echo "=============================================="
          echo "PROJECT_DIR=$PROJECT_DIR"

      # ============================================================
      # 3. NODE.JS
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      # ============================================================
      # 4. PNPM
      # ============================================================
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      # ============================================================
      # 5. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. ANDROID SDK
      #
      # IMPORTANT:
      # Do NOT use android-actions/setup-android here.
      # That previously caused the obsolete "tools" package error.
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo "SDK Manager:"
          echo "$SDKMANAGER"

      # ============================================================
      # 7. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # 8. INSTALL REQUIRED SDK
      # ============================================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed | head -100 || true

      # ============================================================
      # 9. INSTALL JS DEPENDENCIES
      # ============================================================
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

      # ============================================================
      # 10. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ]; then
            printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties
          fi

          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 11. VERIFY CALL ASSISTANT
      # ============================================================
      - name: Verify Call Assistant files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          CALL_SERVICE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/CallAssistantService.kt"
          CALL_PREFS="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/CallAssistantPrefs.kt"

          echo "Checking Call Assistant..."

          if [ ! -f "$CALL_SERVICE" ]; then
            echo "::error::CallAssistantService.kt not found."
            exit 1
          fi

          if [ ! -f "$CALL_PREFS" ]; then
            echo "::error::CallAssistantPrefs.kt not found."
            exit 1
          fi

          echo "CallAssistantService.kt: OK"
          echo "CallAssistantPrefs.kt: OK"

      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      # ============================================================
      # 13. COLLECT APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          APK="$(find "$PROJECT_DIR/android" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            -print | sort | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "::error::No release APK was generated."

            echo ""
            echo "Searching all APK files:"
            find "$PROJECT_DIR/android" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          cp "$APK" release/Abir-AI-5.4.15-release.apk

          echo ""
          echo "Final APK:"
          ls -lh release/

      # ============================================================
      # 14. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="release/Abir-AI-5.4.15-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK does not exist."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -le 100000 ]; then
            echo "::error::APK is suspiciously small."
            exit 1
          fi

          echo "APK verification passed."

      # ============================================================
      # 15. UPLOAD APK
      # ============================================================
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.15-Release-APK
          path: release/Abir-AI-5.4.15-release.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 16. SUCCESS
      # ============================================================
      - name: Build success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       ABIR AI 5.4.15 BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "APK: Abir-AI-5.4.15-release.apk"
          echo "Artifact: Abir-AI-5.4.15-Release-APK"
          echo ""
