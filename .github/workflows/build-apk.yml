name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Node.js 20
      # =========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =========================================================
      # 4. pnpm
      # =========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # =========================================================
      # 5. Check tools
      # =========================================================
      - name: Check build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ABIR AI BUILD ENVIRONMENT"
          echo "=========================================="

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "=========================================="


      # =========================================================
      # 6. Android SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo ""
          echo "SDK Manager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing Android SDK..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."


      # =========================================================
      # 7. Find Abir AI ZIP
      # =========================================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI ZIP"
          echo "=========================================="

          EXACT_ZIP="AbirAI-5.4.4-FUTURISTIC-DASHBOARD-VOICE-OWNER-SECURITY-OFFLINE-ONLINE.zip"

          if [ -f "$EXACT_ZIP" ]; then
            ZIP_FILE="$EXACT_ZIP"
          else
            ZIP_FILE="$(find . \
              -type f \
              -name "AbirAI-*.zip" \
              -not -path "./.git/*" \
              -print \
              | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Abir AI ZIP not found."
            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print || true
            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 8. Verify ZIP
      # =========================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP integrity..."

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity: OK"


      # =========================================================
      # 9. Extract
      # =========================================================
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source extracted."

          echo ""
          echo "Extracted structure:"
          find extracted \
            -maxdepth 3 \
            -type f \
            -print \
            | head -200


      # =========================================================
      # 10. Detect project
      # =========================================================
      - name: Detect Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ] && \
             [ -f "extracted/android/gradlew" ]; then

            PROJECT_DIR="extracted"

          elif [ -f "extracted/src/package.json" ] && \
               [ -f "extracted/src/android/gradlew" ]; then

            PROJECT_DIR="extracted/src"

          else

            while IFS= read -r android_dir; do

              CANDIDATE="$(dirname "$android_dir")"

              if [ -f "$CANDIDATE/package.json" ] && \
                 [ -f "$CANDIDATE/android/gradlew" ]; then

                PROJECT_DIR="$CANDIDATE"
                break

              fi

            done < <(
              find extracted \
                -type d \
                -name android \
                -print
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "package.json files:"
            find extracted \
              -type f \
              -name package.json \
              -print || true

            echo ""
            echo "gradlew files:"
            find extracted \
              -type f \
              -name gradlew \
              -print || true

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: android/gradlew missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # =========================================================
      # 11. Read package.json version
      # =========================================================
      - name: Read project version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          VERSION="$(
            node -p "require('./package.json').version || ''"
          )"

          if [ -z "$VERSION" ]; then
            echo "ERROR: package.json version not found."
            exit 1
          fi

          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "Package version:"
          echo "$VERSION"


      # =========================================================
      # 12. Read Android version - SAFE METHOD
      # =========================================================
      - name: Read Android version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          GRADLE_FILE="android/app/build.gradle"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: android/app/build.gradle not found."
            exit 1
          fi

          echo "Reading Android version..."

          VERSION_CODE="$(grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' "$GRADLE_FILE" | head -n 1 | awk '{print $2}')"

          VERSION_NAME="$(grep -E '^[[:space:]]*versionName[[:space:]]+"' "$GRADLE_FILE" | head -n 1 | cut -d '"' -f 2)"

          if [ -z "$VERSION_CODE" ]; then
            echo "ERROR: versionCode not found."
            exit 1
          fi

          if [ -z "$VERSION_NAME" ]; then
            echo "ERROR: versionName not found."
            exit 1
          fi

          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          echo ""
          echo "Android versionCode:"
          echo "$VERSION_CODE"

          echo ""
          echo "Android versionName:"
          echo "$VERSION_NAME"


      # =========================================================
      # 13. Verify Abir AI 5.4.4
      # =========================================================
      - name: Verify Abir AI 5.4.4
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERSION VERIFICATION"
          echo "=========================================="

          echo ""
          echo "package.json:"
          echo "$PACKAGE_VERSION"

          echo ""
          echo "Android versionName:"
          echo "$ANDROID_VERSION_NAME"

          echo ""
          echo "Android versionCode:"
          echo "$ANDROID_VERSION_CODE"

          if [ "$PACKAGE_VERSION" != "5.4.4" ]; then
            echo ""
            echo "ERROR: package.json is not version 5.4.4."
            exit 1
          fi

          if [ "$ANDROID_VERSION_NAME" != "5.4.4" ]; then
            echo ""
            echo "ERROR: Android versionName is not 5.4.4."
            exit 1
          fi

          if [ "$ANDROID_VERSION_CODE" != "43" ]; then
            echo ""
            echo "ERROR: Android versionCode is not 43."
            exit 1
          fi

          echo ""
          echo "Version verification: OK"

          echo "ABIR_VERSION=5.4.4" >> "$GITHUB_ENV"


      # =========================================================
      # 14. Verify required project files
      # =========================================================
      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle

          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"
          echo "Gradle wrapper: OK"
          echo "app/build.gradle: OK"


      # =========================================================
      # 15. Check broken dependency
      # =========================================================
      - name: Check workspace dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if grep -Fq '"@workspace/api-client-react"' package.json; then
            echo "ERROR: Broken workspace dependency found."
            exit 1
          fi

          echo "Workspace dependency check: OK"


      # =========================================================
      # 16. Install dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed."


      # =========================================================
      # 17. Verify node_modules
      # =========================================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules: OK"


      # =========================================================
      # 18. Verify important packages
      # =========================================================
      - name: Verify Abir AI packages
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules/expo
          test -d node_modules/react-native

          echo "Expo: OK"
          echo "React Native: OK"

          if [ -d "node_modules/expo-local-authentication" ]; then
            echo "expo-local-authentication: OK"
          fi

          if [ -d "node_modules/expo-secure-store" ]; then
            echo "expo-secure-store: OK"
          fi

          if [ -d "node_modules/expo-speech" ]; then
            echo "expo-speech: OK"
          fi


      # =========================================================
      # 19. Kotlin compatibility
      # =========================================================
      - name: Apply Android compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Kotlin source files..."

          while IFS= read -r -d '' file; do

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done < <(
            find android \
              -type f \
              -name "*.kt" \
              -print0
          )

          echo "Kotlin compatibility check complete."


      # =========================================================
      # 20. Prepare Gradle
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # =========================================================
      # 21. Gradle version
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # =========================================================
      # 22. Gradle initialization
      # =========================================================
      - name: Initialize Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew \
            help \
            --no-daemon \
            --stacktrace

          echo "Gradle initialization complete."


      # =========================================================
      # 23. Clean
      # =========================================================
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo "Android clean complete."


      # =========================================================
      # 24. Build Release APK
      # =========================================================
      - name: Build Abir AI 5.4.4 Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING ABIR AI 5.4.4"
          echo "=========================================="

          echo ""
          echo "Version: $ABIR_VERSION"
          echo "Version Code: $ANDROID_VERSION_CODE"

          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD FINISHED."


      # =========================================================
      # 25. Find APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching for APK..."

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: APK output directory missing."

            find "${PROJECT_DIR}/android/app/build" \
              -maxdepth 8 \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # =========================================================
      # 26. Prepare final APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          FINAL_APK="release/Abir-AI-5.4.4-release.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$FINAL_APK"


      # =========================================================
      # 27. Verify APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Final APK missing."
            exit 1
          fi

          APK_SIZE="$(stat -c%s "$FINAL_APK")"

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK verification: OK"


      # =========================================================
      # 28. SHA256
      # =========================================================
      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -e

          APK_SHA256="$(sha256sum "$FINAL_APK" | awk '{print $1}')"

          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          echo ""
          echo "APK SHA256:"
          echo "$APK_SHA256"


      # =========================================================
      # 29. Build information
      # =========================================================
      - name: Create build information
        shell: bash
        run: |
          set -e

          {
            echo "Abir AI Build"
            echo "===========
