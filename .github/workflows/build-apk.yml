
name: Build Abir AI 5.4.28

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Abir AI Project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Abir AI project..."

          PROJECT_ROOT=""

          check_project() {
            local dir="$1"

            if [ -f "$dir/package.json" ] &&
               [ -f "$dir/pnpm-lock.yaml" ] &&
               [ -f "$dir/android/gradlew" ] &&
               [ -f "$dir/android/gradle/wrapper/gradle-wrapper.properties" ]; then
              PROJECT_ROOT="$dir"
              return 0
            fi

            return 1
          }

          if check_project "$GITHUB_WORKSPACE"; then
            echo "Project found in repository root."
          else
            EXTRACT_DIR="$RUNNER_TEMP/abir-extracted"
            mkdir -p "$EXTRACT_DIR"

            ZIP_FOUND=false

            while IFS= read -r -d '' ZIP_FILE; do
              ZIP_FOUND=true
              echo "Extracting: $ZIP_FILE"

              DEST="$EXTRACT_DIR/$(basename "$ZIP_FILE" .zip)"
              mkdir -p "$DEST"
              unzip -q "$ZIP_FILE" -d "$DEST" || true

              while IFS= read -r -d '' PACKAGE_FILE; do
                CANDIDATE="$(dirname "$PACKAGE_FILE")"

                if check_project "$CANDIDATE"; then
                  break
                fi
              done < <(find "$DEST" -type f -name package.json -print0)

              if [ -n "$PROJECT_ROOT" ]; then
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname "*.zip" -print0)

            if [ -z "$PROJECT_ROOT" ]; then
              echo "ERROR: Abir AI project not found."
              echo "Expected files:"
              echo "package.json"
              echo "pnpm-lock.yaml"
              echo "android/gradlew"
              echo "android/gradle/wrapper/gradle-wrapper.properties"
              echo ""
              echo "Files found in repository:"
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -200
              exit 1
            fi
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project location: $PROJECT_ROOT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "Checking project files..."

          for f in package.json pnpm-lock.yaml android/gradlew android/gradle/wrapper/gradle-wrapper.properties; do
            if [ -f "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          echo "Java:"
          java -version

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          pnpm install --frozen-lockfile

      - name: Check Expo Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if pnpm exec expo --version; then
            pnpm exec expo config --type public
          else
            echo "Expo CLI check skipped."
          fi

      - name: Run TypeScript Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
          else
            echo "No typecheck script found. Skipping."
          fi

      - name: Prepare Sherpa ONNX
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f scripts/prepare-sherpa.sh ]; then
            chmod +x scripts/prepare-sherpa.sh
            bash scripts/prepare-sherpa.sh
          else
            echo "ERROR: scripts/prepare-sherpa.sh not found."
            exit 1
          fi

      - name: Verify Sherpa Model and Native Libraries
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "Checking Sherpa model files..."

          for f in encoder.onnx decoder.onnx joiner.onnx tokens.txt bpe.model; do
            if find . -type f -name "$f" -print -quit | grep -q .; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

          echo "Checking native libraries..."

          for lib in libsherpa-onnx-jni.so libonnxruntime.so; do
            if find android -type f -name "$lib" -print -quit | grep -q .; then
              echo "FOUND: $lib"
            else
              echo "MISSING: $lib"
              exit 1
            fi
          done

          echo "Checking Kotlin recognizer..."

          if find android -type f -name OnlineRecognizer.kt -print -quit | grep -q .; then
            echo "OnlineRecognizer.kt found."
          else
            echo "WARNING: OnlineRecognizer.kt not found."
          fi

      - name: Grant Gradle Permission
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"
          chmod +x gradlew

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APK_DIR="android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found."
            exit 1
          fi

          APK="$(find "$APK_DIR" -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not generated."
            exit 1
          fi

          echo "APK generated: $APK"

          echo "Checking APK contents..."

          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"

          grep -q "libsherpa-onnx-jni.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "libonnxruntime.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "encoder.onnx" "$RUNNER_TEMP/apk-list.txt"
          grep -q "tokens.txt" "$RUNNER_TEMP/apk-list.txt"

          echo "Sherpa libraries and model files verified."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Release-APK
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
          
