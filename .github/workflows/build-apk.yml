name: Build Abir AI 2.9.0 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-2.9.0-Final.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Bengali-Voice-Buddy-AbirAI-2.9.0-Final.zip not found!"
            echo "Put the ZIP file in the repository root."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found!"
            find extracted -maxdepth 5 -type f -name package.json
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        run: |
          chmod +x gradlew

      - name: Fix Android version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle"

          if [ -f "$FILE" ]; then
            python3 - <<'PY'
from pathlib import Path

p = Path("android/app/build.gradle")
s = p.read_text()

if "versionName" not in s:
    s = s.replace(
        "defaultConfig {",
        'defaultConfig {\n        versionName "2.9.0"',
        1
    )

p.write_text(s)
PY
          fi

      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Accessibility service file not found."
            exit 0
          fi

          echo "Fixing:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
from pathlib import Path
import sys

p = Path(sys.argv[1])
s = p.read_text()

# Make sure AccessibilityEvent import exists
if "import android.view.accessibility.AccessibilityEvent" not in s:
    marker = "import android.view.accessibility.AccessibilityNodeInfo"
    if marker in s:
        s = s.replace(
            marker,
            "import android.view.accessibility.AccessibilityEvent\n" + marker
        )

# Replace problematic event constants
s = s.replace(
    "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED",
    "32"
)

s = s.replace(
    "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED",
    "2048"
)

s = s.replace(
    "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED",
    "16"
)

# Also handle AccessibilityServiceInfo references
s = s.replace(
    "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED",
    "32"
)

s = s.replace(
    "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED",
    "2048"
)

s = s.replace(
    "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED",
    "16"
)

p.write_text(s)

print("Accessibility fix completed.")
PY

      - name: Verify Android project
        working-directory: ${{ env.PROJECT }}/android
        run: |
          echo "Gradle:"
          ./gradlew --version

      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found!"
            find android -type f -name "*.apk"
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p release
          cp "$APK" release/Abir-AI-2.9.0-Final.apk

          ls -lh release/Abir-AI-2.9.0-Final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-2.9.0-Final
          path: ${{ env.PROJECT }}/release/Abir-AI-2.9.0-Final.apk
          if-no-files-found: error
