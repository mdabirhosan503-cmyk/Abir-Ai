name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI 5.4.21 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ZIP_NAME: AbirAI-5.4.21-RESEARCH-RESULTS-SCREEN.zip
      PROJECT_DIR: extracted
      ABIR_VERSION: 5.4.21

    steps:
      # 1. CHECKOUT
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JAVA 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. NODE 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. PNPM
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      # 5. FIND AND EXTRACT ZIP
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -eux

          ZIP_PATH="$(find . -type f \
            -name "${ZIP_NAME}" -print -quit || true)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ${ZIP_NAME} not found."
            find . -type f -iname "*.zip" -print | sort
            exit 1
          fi

          echo "Using ZIP: $ZIP_PATH"

          rm -rf "${PROJECT_DIR}"
          mkdir -p "${PROJECT_DIR}"
          unzip -q "$ZIP_PATH" -d "${PROJECT_DIR}"

      # 6. DETECT PROJECT ROOT
      - name: Detect project root
        shell: bash
        run: |
          set -eux

          PROJECT_ROOT=""

          while IFS= read -r -d '' PACKAGE_FILE; do
            CANDIDATE="$(dirname "$PACKAGE_FILE")"

            if [ -f "$CANDIDATE/android/gradlew" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi
          done < <(
            find "${PROJECT_DIR}" \
              -type f -name "package.json" -print0
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project root not found."
            find "${PROJECT_DIR}" -maxdepth 6 -type f | sort | head -500
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_ROOT"

      # 7. VERIFY PROJECT
      - name: Verify project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          test -f package.json
          test -f android/gradlew
          test -f android/settings.gradle

          echo "Project structure verified."

      # 8. INSTALL DEPENDENCIES
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux
          pnpm install --no-frozen-lockfile

      # 9. VERIFY PACKAGES
      - name: Verify Expo and React Native
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          node --version
          pnpm --version
          pnpm exec expo --version

          node -p "require('expo/package.json').version"
          node -p "require('react-native/package.json').version"

      # 10. OPTIONAL AUTOLINKING CHECK
      - name: Locate Expo Autolinking
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -u

          FOUND="$(node -p \
            "require.resolve('expo-modules-autolinking/package.json')" \
            2>/dev/null || true)"

          if [ -n "$FOUND" ]; then
            echo "Expo Autolinking: $FOUND"
          else
            echo "Autolinking package not directly resolvable."
            echo "Expo Gradle will handle its own resolution."
          fi

      # 11. VERIFY CUSTOM MODULE
      - name: Verify Abir App Launcher
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          if [ -d modules/abir-app-launcher ]; then
            test -f modules/abir-app-launcher/package.json
            test -f modules/abir-app-launcher/expo-module.config.json
            cat modules/abir-app-launcher/expo-module.config.json
          else
            echo "WARNING: Custom launcher module not found."
          fi

      # 12. ANDROID SDK
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."

      # 13. FIX ResolveInfoFlags
      - name: Fix Android ResolveInfoFlags
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          grep -RIl "ResolveInfoFlags.of(0)" \
            modules android 2>/dev/null |
          while read -r FILE; do
            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$FILE"
          done || true

      # 14. VALIDATE PNG
      - name: Validate PNG assets
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          BAD=0

          while IFS= read -r -d '' FILE; do
            MAGIC="$(xxd -p -l 8 "$FILE" 2>/dev/null || true)"

            if [ "$MAGIC" != "89504e470d0a1a0a" ]; then
              echo "Invalid PNG: $FILE"
              echo "Signature: $MAGIC"
              BAD=1
            fi
          done < <(find . -type f -iname "*.png" -print0)

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "PNG validation passed."

      # 15. GRADLE MEMORY
      - name: Configure Gradle
        shell: bash
        run: |
          set -eux

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

      # 16. PREPARE GRADLE
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux
          chmod +x gradlew
          ./gradlew --version

      # 17. CLEAN
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux
          ./gradlew clean --no-daemon --stacktrace

      # 18. BUILD RELEASE APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      # 19. COLLECT APK
      - name: Collect APK
        if: success()
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          APK="$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find android/app/build/outputs -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-${ABIR_VERSION}-release.apk"

          ls -lh "$GITHUB_WORKSPACE/release/"

      # 20. UPLOAD APK
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.21-Release-APK
          path: release/Abir-AI-5.4.21-release.apk
          if-no-files-found: error

      # 21. UPLOAD BUILD LOG ON FAILURE
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.21-Build-Diagnostics
          path: |
            abir-build.log
            extracted/**/android/build/reports/**
            extracted/**/android/app/build/outputs/logs/**
          if-no-files-found: warn
