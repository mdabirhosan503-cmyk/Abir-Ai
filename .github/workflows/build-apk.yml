name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      UNPACK_DIR: "${{ github.workspace }}/abir_extracted"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. PNPM
      #
      # IMPORTANT:
      # pnpm MUST be installed before setup-node uses cache: pnpm
      # ============================================================

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ============================================================
      # 4. NODE 20
      #
      # pnpm is already available here, so cache: pnpm is safe.
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            **/pnpm-lock.yaml


      # ============================================================
      # 5. VERIFY NODE + PNPM
      # ============================================================

      - name: Verify Node and pnpm
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "NODE / PNPM CHECK"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "pnpm path:"
          command -v pnpm

          echo ""
          echo "=========================================="


      # ============================================================
      # 6. SYSTEM INFORMATION
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner:"
          uname -a

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"


      # ============================================================
      # 7. LOCATE ANDROID SDK MANAGER
      # ============================================================

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER=""

          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                -print 2>/dev/null |
              sort -V |
              tail -n 1 || true
            )"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."

            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 6 \
              -type f \
              -name "sdkmanager" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 8. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."


      # ============================================================
      # 9. INSTALL ANDROID SDK
      #
      # NEVER install the obsolete "tools" package.
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo ""
          echo "Android SDK verification PASSED."


      # ============================================================
      # 10. FIND ABIR AI ZIP
      # ============================================================

      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_ZIP=""

          for PATTERN in \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION-FIXED-COMPLETE.zip" \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION-FIXED.zip" \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION.zip" \
            "AbirAI-5.4.24-*.zip"
          do

            FOUND="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$PATTERN" \
                -not -path '*/abir_extracted/*' \
                -print -quit 2>/dev/null || true
            )"

            if [[ -n "$FOUND" ]]; then
              BEST_ZIP="$FOUND"
              break
            fi

          done

          if [[ -z "$BEST_ZIP" ]]; then
            echo "ERROR: Abir AI 5.4.24 ZIP was not found."

            echo ""
            echo "Available ZIP files:"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path '*/abir_extracted/*' \
              -print || true

            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$BEST_ZIP"

          echo "ABIR_ZIP=$BEST_ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VERIFY ZIP
      # ============================================================

      - name: Verify Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."

          unzip -tq "$ABIR_ZIP"

          echo "ZIP integrity PASSED."

          ls -lh "$ABIR_ZIP"


      # ============================================================
      # 12. EXTRACT ABIR AI
      # ============================================================

      - name: Extract Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$UNPACK_DIR"
          mkdir -p "$UNPACK_DIR"

          unzip -oq "$ABIR_ZIP" -d "$UNPACK_DIR"

          echo "Extraction completed."


      # ============================================================
      # 13. DETECT ANDROID PROJECT
      # ============================================================

      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_DIR=""
          BEST_SCORE=-1

          while IFS= read -r -d '' GRADLEW; do

            ANDROID_DIR="$(dirname "$GRADLEW")"
            CANDIDATE="$(dirname "$ANDROID_DIR")"

            if [[ ! -f "$CANDIDATE/package.json" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/app/build.gradle" &&
                  ! -f "$ANDROID_DIR/app/build.gradle.kts" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/settings.gradle" &&
                  ! -f "$ANDROID_DIR/settings.gradle.kts" ]]; then
              continue
            fi

            SCORE=0

            [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" ]] &&
              SCORE=$((SCORE + 3))

            [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]] &&
              SCORE=$((SCORE + 3))

            [[ -f "$CANDIDATE/modules/abir-app-launcher/android/build.gradle" ]] &&
              SCORE=$((SCORE + 4))

            [[ -f "$CANDIDATE/modules/abir-app-launcher/expo-module.config.json" ]] &&
              SCORE=$((SCORE + 2))

            VERSION="$(
              node -p "require('$CANDIDATE/package.json').version" \
              2>/dev/null || echo ""
            )"

            if [[ "$VERSION" == "$ABIR_VERSION" ]]; then
              SCORE=$((SCORE + 10))
            fi

            echo ""
            echo "Candidate: $CANDIDATE"
            echo "Version: $VERSION"
            echo "Score: $SCORE"

            if (( SCORE > BEST_SCORE )); then
              BEST_SCORE=$SCORE
              BEST_DIR="$CANDIDATE"
            fi

          done < <(
            find "$UNPACK_DIR" \
              -type f \
              -path '*/android/gradlew' \
              -print0
          )

          if [[ -z "$BEST_DIR" ]]; then
            echo "ERROR: Android project not found."

            find "$UNPACK_DIR" \
              -maxdepth 8 \
              \( \
                -name package.json \
                -o -name gradlew \
                -o -name settings.gradle \
                -o -name settings.gradle.kts \
              \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "Selected project:"
          echo "$BEST_DIR"

          echo "PROJECT_ROOT=$BEST_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 14. VERIFY PROJECT
      # ============================================================

      - name: Verify Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          VERSION="$(node -p "require('./package.json').version")"

          echo "Abir AI version: $VERSION"

          if [[ "$VERSION" != "$ABIR_VERSION" ]]; then
            echo "ERROR: Expected version $ABIR_VERSION"
            exit 1
          fi

          test -f android/gradlew

          if [[ ! -f android/app/build.gradle &&
                ! -f android/app/build.gradle.kts ]]; then
            echo "ERROR: Android app Gradle file missing."
            exit 1
          fi

          if [[ ! -f android/settings.gradle &&
                ! -f android/settings.gradle.kts ]]; then
            echo "ERROR: Android settings Gradle file missing."
            exit 1
          fi

          APP_GRADLE="android/app/build.gradle"

          if [[ ! -f "$APP_GRADLE" ]]; then
            APP_GRADLE="android/app/build.gradle.kts"
          fi

          if ! grep -Eq \
            "versionName[[:space:]]*[=]?[[:space:]]*['\"]${ABIR_VERSION}['\"]" \
            "$APP_GRADLE"; then

            echo "ERROR: Android versionName mismatch."

            grep -n "versionName" "$APP_GRADLE" || true

            exit 1
          fi

          echo "Project verification PASSED."


      # ============================================================
      # 15. CHECK BROKEN WORKSPACE DEPENDENCY
      # ============================================================

      - name: Check workspace dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          if grep -Rqs \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '@workspace/api-client-react' \
            package.json \
            pnpm-lock.yaml \
            2>/dev/null; then

            echo "ERROR:"
            echo "@workspace/api-client-react detected."

            exit 1
          fi

          echo "Workspace dependency check PASSED."


      # ============================================================
      # 16. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Installing dependencies..."

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed successfully."


      # ============================================================
      # 17. VERIFY EXPO / REACT NATIVE
      # ============================================================

      - name: Verify Expo React Native and Camera
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "Package versions:"

          node <<'NODE'
          const p = require('./package.json');

          for (const name of [
            'expo',
            'react-native',
            'expo-camera'
          ]) {
            const version =
              p.dependencies?.[name] ||
              p.devDependencies?.[name] ||
              'NOT DECLARED';

            console.log(`${name}: ${version}`);
          }
          NODE

          echo ""
          echo "Expo CLI:"

          if pnpm exec expo --version; then
            echo "Expo CLI available."
          else
            echo "WARNING: Expo CLI check unavailable."
            echo "Continuing with native Android build."
          fi


      # ============================================================
      # 18. PREPARE ANDROID
      # ============================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > android/local.properties

          chmod +x android/gradlew

          echo "Android SDK configured."

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "ERROR: Gradle wrapper JAR missing."
            exit 1
          fi

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          echo ""
          echo "Gradle wrapper properties:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 19. KOTLIN COMPATIBILITY FIX
      # ============================================================

      - name: Apply Kotlin compatibility fix
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          FOUND=0

          while IFS= read -r -d '' FILE; do

            echo "Patching:"
            echo "$FILE"

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$FILE"

            FOUND=1

          done < <(
            grep -RIlZ \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              'ResolveInfoFlags\.of(0)' \
              modules \
              android \
              2>/dev/null || true
          )

          if [[ "$FOUND" -eq 1 ]]; then
            echo "Compatibility patch applied."
          else
            echo "No compatibility patch required."
          fi


      # ============================================================
      # 20. GRADLE CONFIGURATION
      # ============================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

          echo "Gradle configured."


      # ============================================================
      # 21. GRADLE CACHE
      # ============================================================

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 22. CHECK GRADLE
      # ============================================================

      - name: Check Gradle configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew --version


      # ============================================================
      # 23. TEST GRADLE CONFIGURATION
      # ============================================================

      - name: Test Gradle configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew help \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 24. BUILD RELEASE APK
      # ============================================================

      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          echo "=========================================="
          echo "BUILDING ABIR AI 5.4.24"
          echo "=========================================="

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # 25. FIND APK
      # ============================================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          OUTPUT_DIR="$PROJECT_ROOT/android/app/build/outputs/apk"

          if [[ ! -d "$OUTPUT_DIR" ]]; then
            echo "ERROR: APK output directory missing."
            exit 1
          fi

          echo "APK files found:"

          find "$OUTPUT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

          APK_PATH="$(
            find "$OUTPUT_DIR" \
              -type f \
              -name "*.apk" \
              -path "*/release/*" \
              -print \
              -quit \
              2>/dev/null || true
          )"

          if [[ -z "$APK_PATH" ]]; then
            APK_PATH="$(
              find "$OUTPUT_DIR" \
                -type f \
                -name "*.apk" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [[ -z "$APK_PATH" ]]; then
            echo "ERROR: No APK generated."

            find "$OUTPUT_DIR" \
