name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  JAVA_VERSION: "17"
  PNPM_VERSION: "10.12.4"

  ABIR_VERSION: "5.4.4"
  ABIR_VERSION_CODE: "43"

  SOURCE_ZIP: "AbirAI-5.4.4-FIXED-FUTURISTIC-DASHBOARD-VOICE-OWNER-SECURITY-OFFLINE-ONLINE.zip"

jobs:
  build:
    name: Build Abir AI 5.4.4
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle


      # =========================================================
      # 3. NODE 20
      # =========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm


      # =========================================================
      # 4. PNPM
      # =========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false


      # =========================================================
      # 5. ENVIRONMENT CHECK
      # =========================================================
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ABIR AI BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo ""
          echo "=========================================="


      # =========================================================
      # 6. ANDROID SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK ready."


      # =========================================================
      # 7. FIND FIXED ABIR ZIP
      # =========================================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "SEARCHING FOR FIXED ABIR AI ZIP"
          echo "=========================================="

          EXACT_ZIP="${SOURCE_ZIP}"

          if [ -f "$EXACT_ZIP" ]; then
            ZIP_FILE="$EXACT_ZIP"
          else
            echo "ERROR: Required fixed ZIP was not found:"
            echo "$EXACT_ZIP"

            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print || true

            exit 1
          fi

          echo ""
          echo "Selected source:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 8. VERIFY ZIP
      # =========================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking ZIP integrity..."

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity: OK"


      # =========================================================
      # 9. EXTRACT
      # =========================================================
      - name: Extract Abir AI
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source extracted."

          echo ""
          echo "Project candidates:"

          find extracted \
            -type f \
            \( -name "package.json" -o -name "gradlew" \) \
            -print \
            | head -200


      # =========================================================
      # 10. DETECT PROJECT DIRECTORY
      # =========================================================
      - name: Detect Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ] &&
             [ -f "extracted/android/gradlew" ]; then

            PROJECT_DIR="extracted"

          elif [ -f "extracted/src/package.json" ] &&
               [ -f "extracted/src/android/gradlew" ]; then

            PROJECT_DIR="extracted/src"

          else

            while IFS= read -r android_dir; do

              CANDIDATE="$(dirname "$android_dir")"

              if [ -f "$CANDIDATE/package.json" ] &&
                 [ -f "$CANDIDATE/android/gradlew" ]; then

                PROJECT_DIR="$CANDIDATE"
                break

              fi

            done < <(
              find extracted \
                -type d \
                -name android \
                -print
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Abir AI Android project not found."

            echo ""
            echo "package.json:"
            find extracted \
              -type f \
              -name package.json \
              -print || true

            echo ""
            echo "gradlew:"
            find extracted \
              -type f \
              -name gradlew \
              -print || true

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "ABIR AI PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # =========================================================
      # 11. VERIFY PROJECT STRUCTURE
      # =========================================================
      - name: Verify project structure
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -d android
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"
          echo "build.gradle: OK"
          echo "Gradle wrapper: OK"


      # =========================================================
      # 12. VERIFY PACKAGE VERSION
      # =========================================================
      - name: Verify package version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version || ''")"

          echo "Package version: $VERSION"

          if [ "$VERSION" != "$ABIR_VERSION" ]; then
            echo "ERROR: Expected version $ABIR_VERSION"
            exit 1
          fi

          echo "Package version: OK"


      # =========================================================
      # 13. VERIFY ANDROID VERSION
      # =========================================================
      - name: Verify Android version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_FILE="android/app/build.gradle"

          VERSION_CODE="$(
            grep -E \
              '^[[:space:]]*versionCode[[:space:]]+[0-9]+' \
              "$GRADLE_FILE" \
              | head -n 1 \
              | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -E \
              '^[[:space:]]*versionName[[:space:]]+"' \
              "$GRADLE_FILE" \
              | head -n 1 \
              | cut -d '"' -f 2
          )"

          echo "Android versionName: $VERSION_NAME"
          echo "Android versionCode: $VERSION_CODE"

          if [ "$VERSION_NAME" != "$ABIR_VERSION" ]; then
            echo "ERROR: Wrong versionName."
            exit 1
          fi

          if [ "$VERSION_CODE" != "$ABIR_VERSION_CODE" ]; then
            echo "ERROR: Wrong versionCode."
            exit 1
          fi

          echo "Android version: OK"


      # =========================================================
      # 14. CHECK BROKEN WORKSPACE DEPENDENCY
      # =========================================================
      - name: Check workspace dependency
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq '"@workspace/api-client-react"' package.json; then
            echo "ERROR: Broken workspace dependency detected."
            exit 1
          fi

          echo "Workspace dependency check: OK"


      # =========================================================
      # 15. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing dependencies..."

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed."


      # =========================================================
      # 16. VERIFY NODE MODULES
      # =========================================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -d node_modules
          test -d node_modules/expo
          test -d node_modules/react-native

          echo "node_modules: OK"
          echo "Expo: OK"
          echo "React Native: OK"

          if [ -d "node_modules/expo-local-authentication" ]; then
            echo "expo-local-authentication: OK"
          fi

          if [ -d "node_modules/expo-secure-store" ]; then
            echo "expo-secure-store: OK"
          fi

          if [ -d "node_modules/expo-speech" ]; then
            echo "expo-speech: OK"
          fi


      # =========================================================
      # 17. KOTLIN COMPATIBILITY
      # =========================================================
      - name: Apply Kotlin compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Kotlin compatibility..."

          while IFS= read -r -d '' file; do

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done < <(
            find android \
              -type f \
              -name "*.kt" \
              -print0
          )

          echo "Kotlin compatibility check complete."


      # =========================================================
      # 18. VERIFY FIXED LOCATION CODE
      # =========================================================
      - name: Verify Abir location coroutine fix
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          LOCATION_FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$LOCATION_FILE" ]; then
            echo "WARNING: Custom location module file not found."
            echo "Continuing because project structure may differ."
            exit 0
          fi

          echo "Checking:"
          echo "$LOCATION_FILE"

          if grep -n "getCurrentLocationJson" "$LOCATION_FILE"; then
            echo ""
            echo "Location function found."
          else
            echo ""
            echo "WARNING: getCurrentLocationJson not found."
          fi

          echo ""
          echo "Location module check complete."


      # =========================================================
      # 19. PREPARE GRADLE
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # =========================================================
      # 20. GRADLE VERSION
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version


      # =========================================================
      # 21. GRADLE INITIALIZATION
      # =========================================================
      - name: Initialize Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            help \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 22. CLEAN
      # =========================================================
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace


      # =========================================================
      # 23. BUILD RELEASE APK
      # =========================================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo "BUILDING ABIR AI 5.4.4"
          echo "=========================================="

          echo ""
          echo "Version:"
          echo "$ABIR_VERSION"

          echo ""
          echo "Version Code:"
          echo "$ABIR_VERSION_CODE"

          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="


      # =========================================================
      # 24. FIND APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory missing."

            find "${PROJECT_DIR}/android/app/build" \
              -maxdepth 10 \
              -type f \
              -print || true

            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # =========================================================
      # 25. PREPARE FINAL APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          FINAL_APK="release/Abir-AI-5.4.4-release.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK:"
          ls -lh "$FINAL_APK"


      # =========================================================
      # 26. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f "$FINAL_APK"

          APK_SIZE="$(stat -c%s "$FINAL_APK")"

          echo "APK size: $APK_SIZE bytes"

          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK is unexpectedly small."
            exit 1
          fi

          echo "APK verification: OK"


      # =========================================================
      # 27. SHA256
      # =========================================================
      - name: Calculate APK SHA256
        shell: bash
        run: |
          set -euo pipefail

          APK_SHA256="$(
            sha256sum "$FINAL_APK" \
            | awk '{print $1}'
          )"

          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"

          echo ""
          echo "APK SHA256:"
          echo "$APK_SHA256"


      # =========================================================
      # 28. BUILD INFORMATION
      # =========================================================
      - name: Create build information
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          {
            echo "Abir AI Build"
            echo "=============="
            echo "Version: $ABIR_VERSION"
            echo "Version Code: $ABIR_VERSION_CODE"
            echo "Source ZIP: $SOURCE_ZIP"
            echo "APK SHA256: $APK_SHA256"
            echo "Java: $JAVA_VERSION"
            echo "Node: $NODE_VERSION"
            echo "pnpm: $PNPM_VERSION"
            echo "Build: Release APK"
          } > release/BUILD_INFO.txt

          cat release/BUILD_INFO.txt


      # =========================================================
      # 29. UPLOAD APK
      # =========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.4-release
          path: |
            release/Abir-AI-5.4.4-release.apk
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30


      # =========================================================
      # 30. FINAL SUCCESS
      # ==========
