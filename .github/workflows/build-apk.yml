name: Build Abir AI 5.4.24

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ABIR_VERSION: "5.4.24"

  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

  CI: "1"
  EXPO_NO_TELEMETRY: "1"

  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:

  # ==================================================
  # 1. BUILD
  # ==================================================
  build:

    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:

      # ==================================================
      # 2. CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # 3. JAVA 17
      # ==================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ==================================================
      # 4. SETUP PNPM
      # ==================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      # ==================================================
      # 5. SETUP NODE
      # ==================================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      # ==================================================
      # 6. PRINT TOOL VERSIONS
      # ==================================================
      - name: Print environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Abir AI $ABIR_VERSION Build Environment"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version || true

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Disk:"
          df -h

      # ==================================================
      # 7. ANDROID SDK
      # ==================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -path '*/bin/sdkmanager' \
              -print 2>/dev/null |
              head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      # ==================================================
      # 8. CREATE WORK DIRECTORIES
      # ==================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/abir_build"
          rm -rf "$GITHUB_WORKSPACE/abir_extracted"
          rm -rf "$GITHUB_WORKSPACE/build-diagnostics"
          rm -rf "$GITHUB_WORKSPACE/release"

          mkdir -p "$GITHUB_WORKSPACE/abir_build"
          mkdir -p "$GITHUB_WORKSPACE/abir_extracted"
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

      # ==================================================
      # 9. FIND SOURCE ZIP
      # ==================================================
      - name: Find Abir AI 5.4.24 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Abir AI 5.4.24 ZIP..."

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'AbirAI-5.4.24*.zip' \
              -not -path '*/.git/*' \
              -print0 |
            xargs -0 -r ls -1t |
            head -n 1 || true
          )"

          if [ -z "$ZIP" ]; then
            echo "::error::No AbirAI-5.4.24*.zip file was found."

            echo ""
            echo "ZIP files available in repository:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*.zip' \
              -not -path '*/.git/*' \
              -print || true

            exit 1
          fi

          echo "Selected source ZIP:"
          echo "$ZIP"

          cp "$ZIP" "$GITHUB_WORKSPACE/abir_build/source.zip"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      # ==================================================
      # 10. VERIFY ZIP
      # ==================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/abir_build/source.zip"

          echo "Testing ZIP integrity..."

          unzip -tq "$ZIP"

          echo ""
          echo "ZIP SHA-256:"
          sha256sum "$ZIP"

          echo ""
          echo "ZIP contents:"
          unzip -l "$ZIP" | head -n 100

      # ==================================================
      # 11. EXTRACT SOURCE
      # ==================================================
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$GITHUB_WORKSPACE/abir_build/source.zip" \
            -d "$GITHUB_WORKSPACE/abir_extracted"

          echo "Extraction completed."

          echo ""
          echo "Top-level extracted items:"
          find "$GITHUB_WORKSPACE/abir_extracted" \
            -maxdepth 2 \
            -mindepth 1 \
            -print | head -n 200

      # ==================================================
      # 12. DETECT PROJECT ROOT
      # ==================================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACTED="$GITHUB_WORKSPACE/abir_extracted"

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # ------------------------------------------
          # Direct project
          # ------------------------------------------
          if [ -f "$EXTRACTED/package.json" ] &&
             [ -f "$EXTRACTED/app.json" ] &&
             [ -d "$EXTRACTED/android" ] &&
             [ -f "$EXTRACTED/android/gradlew" ]; then

            PROJECT_DIR="$EXTRACTED"

          else

            # ----------------------------------------
            # Nested project
            # ----------------------------------------
            PROJECT_DIR="$(
              find "$EXTRACTED" \
                -type f \
                -name package.json \
                -print0 |
              while IFS= read -r -d '' PKG; do
                ROOT="$(dirname "$PKG")"

                if [ -f "$ROOT/app.json" ] &&
                   [ -d "$ROOT/android" ] &&
                   [ -f "$ROOT/android/gradlew" ]; then
                  echo "$ROOT"
                  break
                fi
              done
            )"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found in ZIP."

            echo ""
            echo "Possible package.json files:"
            find "$EXTRACTED" \
              -type f \
              -name package.json \
              -print || true

            echo ""
            echo "Possible Gradle wrappers:"
            find "$EXTRACTED" \
              -type f \
              -name gradlew \
              -print || true

            exit 1
          fi

          echo ""
          echo "Detected project root:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==================================================
      # 13. VERIFY PROJECT
      # ==================================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "Project verification"
          echo "=========================================="

          test -f package.json
          test -f app.json
          test -d android
          test -f android/gradlew

          echo ""
          echo "package.json:"
          node -e '
            const p=require("./package.json");
            console.log(JSON.stringify({
              name:p.name,
              version:p.version,
              private:p.private
            }, null, 2));
          '

          echo ""
          echo "Expo / React Native dependencies:"

          node <<'NODE'
          const p = require("./package.json");
          const d = {
            expo: p.dependencies?.expo || p.devDependencies?.expo,
            react: p.dependencies?.react || p.devDependencies?.react,
            reactNative:
              p.dependencies?.["react-native"] ||
              p.devDependencies?.["react-native"],
            expoCamera:
              p.dependencies?.["expo-camera"] ||
              p.devDependencies?.["expo-camera"],
            expoCli:
              p.dependencies?.["@expo/cli"] ||
              p.devDependencies?.["@expo/cli"]
          };

          console.log(JSON.stringify(d, null, 2));
          NODE

          echo ""
          echo "Android Gradle wrapper:"
          ls -lh android/gradlew

          echo ""
          echo "Important source files:"

          for FILE in \
            assistant/voiceManager.ts \
            assistant/androidActions.ts \
            assistant/onlineAssistant.ts \
            app/index.tsx \
            components/ExactReferenceDashboard.tsx \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/WakeWordService.kt \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
            fi
          done

      # ==================================================
      # 14. CHECK VERSION
      # ==================================================
      - name: Verify Abir AI version
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          VERSION="$(node -p 'require("./package.json").version || ""')"

          echo "package.json version: $VERSION"

          if [ "$VERSION" != "$ABIR_VERSION" ]; then
            echo "::warning::package.json version is $VERSION, expected $ABIR_VERSION"
          fi

          if [ -f app.json ]; then
            node <<'NODE'
            const app = require("./app.json");

            const expo = app.expo || app;

            console.log("Expo name:", expo.name || "N/A");
            console.log("Expo version:", expo.version || "N/A");
            console.log("Android package:",
              expo.android?.package || "N/A");
            NODE
          fi

      # ==================================================
      # 15. INSTALL DEPENDENCIES
      # ==================================================
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Installing dependencies..."

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml not found."
            pnpm install
          fi

          echo ""
          echo "Dependency installation completed."

      # ==================================================
      # 16. VERIFY EXPO / REACT NATIVE
      # ==================================================
      - name: Verify Expo and React Native
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Expo CLI:"
          pnpm exec expo --version

          echo ""
          echo "Expo public config:"

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

          echo "Expo config generated."

          echo ""
          echo "React Native:"
          node -e '
            const p=require("./package.json");
            console.log(
              p.dependencies?.["react-native"] ||
              p.devDependencies?.["react-native"] ||
              "NOT FOUND"
            );
          '

          echo ""
          echo "Expo CLI package:"
          node -e '
            try {
              console.log(require.resolve("@expo/cli/package.json"));
            } catch(e) {
              console.error("@expo/cli/package.json NOT FOUND");
              process.exit(1);
            }
          '

      # ==================================================
      # 17. PREPARE ANDROID GRADLE
      # ==================================================
      - name: Prepare Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo ""
          echo "local.properties:"
          cat local.properties

          GRADLE_PROPERTIES="gradle.properties"

          touch "$GRADLE_PROPERTIES"

          # Ensure file ends with newline.
          if [ -s "$GRADLE_PROPERTIES" ]; then
            LAST_BYTE="$(tail -c 1 "$GRADLE_PROPERTIES" | od -An -t x1 | tr -d ' ')"

            if [ "$LAST_BYTE" != "0a" ]; then
              printf '\n' >> "$GRADLE_PROPERTIES"
            fi
          fi

          # Disable Gradle daemon in CI.
          if ! grep -qxF 'org.gradle.daemon=false' "$GRADLE_PROPERTIES"; then
            printf '\norg.gradle.daemon=false\n' >> "$GRADLE_PROPERTIES"
          fi

          # Avoid Gradle JVM memory problems.
          if ! grep -q '^org.gradle.jvmargs=' "$GRADLE_PROPERTIES"; then
            printf 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m\n' \
              >> "$GRADLE_PROPERTIES"
          fi

          echo ""
          echo "Checking malformed Expo watchedDirectories concatenation..."

          if grep -nE \
            'expo\.inlineModules\.watchedDirectories=.*org\.gradle\.' \
            "$GRADLE_PROPERTIES"; then

            echo "::error::Malformed gradle.properties detected."
            exit 1
          fi

          echo ""
          echo "Final gradle.properties:"
          cat "$GRADLE_PROPERTIES"

      # ==================================================
      # 18. GRADLE PRECHECK
      # ==================================================
      - name: Run Gradle preflight checks
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=========================================="
          echo "Gradle version"
          echo "=========================================="

          ./gradlew --version \
            --no-daemon \
            --stacktrace \
            --console=plain

          echo ""
          echo "=========================================="
          echo "Gradle help"
          echo "=========================================="

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      # ==================================================
      # 19. BUILD RELEASE APK
      # ==================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "=========================================="
          echo "Building Abir AI $ABIR_VERSION"
          echo "=========================================="

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

      # ==================================================
      # 20. FIND AND VERIFY APK
      # ==================================================
      - name: Collect and verify Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_DIR="$PROJECT_DIR/android"

          APK_DIR="$GRADLE_DIR/app/build/outputs/apk/release"

          echo "Searching for generated APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory does not exist:"
            echo "$APK_DIR"

            echo ""
            echo "Available APK output directories:"

            find "$GRADLE_DIR/app/build/outputs" \
              -maxdepth 5 \
              -type d \
              -print 2>/dev/null || true

            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print 2>/dev/null |
            sort |
            tail -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            echo ""
            echo "Available Android build outputs:"

            find "$GRADLE_DIR/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "Generated APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"

          OUTPUT_APK="$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          cp "$APK" "$OUTPUT_APK"

          if [ ! -s "$OUTPUT_APK" ]; then
            echo "::error::Copied APK is empty."
            exit 1
          fi

          echo ""
          echo "Testing APK integrity..."

          unzip -tq "$OUTPUT_APK"

          echo ""
          echo "APK verification successful."

          echo ""
          echo "APK information:"
          ls -lh "$OUTPUT_APK"

          echo ""
          echo "APK SHA-256:"
          sha256sum "$OUTPUT_APK" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

          echo ""
          echo "APK path:"
          echo "$OUTPUT_APK"

      # ==================================================
      # 21. UPLOAD APK
      # ==================================================
      - name: Upload Abir AI 5.4.24 Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      # ==================================================
      # 22. UPLOAD BUILD DIAGNOSTICS
      # ==================================================
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
