name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI 5.4.9 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Node.js 22
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm


      # =========================================================
      # 3. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # =========================================================
      # 4. Android SDK
      # =========================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # =========================================================
      # 5. Install Android SDK packages
      # =========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK_ROOT"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name "sdkmanager" \
                -print \
                -quit \
                2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK installation completed."


      # =========================================================
      # 6. Locate Abir AI project
      # =========================================================
      - name: Locate Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"

          mkdir -p "$EXTRACT"

          WRAPPER=""

          echo "=============================================="
          echo "Searching for Abir AI Android project"
          echo "=============================================="


          # -----------------------------------------------------
          # Direct Android project
          # -----------------------------------------------------

          if [ -f "$WORK/android/gradlew" ]; then

            echo "Found Android project:"
            echo "$WORK/android"

            WRAPPER="$WORK/android/gradlew"


          elif [ -f "$WORK/gradlew" ]; then

            echo "Found Gradle wrapper:"
            echo "$WORK/gradlew"

            WRAPPER="$WORK/gradlew"


          else

            # ---------------------------------------------------
            # Prefer exact 5.4.9 project ZIP
            # ---------------------------------------------------

            ZIP_FILE="$(
              find "$WORK" \
                -type f \
                -name "AbirAI-5.4.9*.zip" \
                ! -path "*/.git/*" \
                -print \
                | sort \
                | tail -n 1
            )


            # ---------------------------------------------------
            # If exact 5.4.9 ZIP is unavailable,
            # find newest AbirAI ZIP
            # ---------------------------------------------------

            if [ -z "${ZIP_FILE:-}" ]; then

              ZIP_FILE="$(
                find "$WORK" \
                  -type f \
                  -name "AbirAI-*.zip" \
                  ! -path "*/.git/*" \
                  -print \
                  | sort \
                  | tail -n 1
              )

            fi


            # ---------------------------------------------------
            # Final fallback: any ZIP
            # ---------------------------------------------------

            if [ -z "${ZIP_FILE:-}" ]; then

              ZIP_FILE="$(
                find "$WORK" \
                  -type f \
                  -name "*.zip" \
                  ! -path "*/.git/*" \
                  -print \
                  | sort \
                  | tail -n 1
              )

            fi


            if [ -z "${ZIP_FILE:-}" ]; then

              echo "::error::No Abir AI project ZIP found."

              echo ""
              echo "Repository files:"
              find "$WORK" \
                -maxdepth 5 \
                -type f \
                -print \
                | head -200 || true

              exit 1

            fi


            echo ""
            echo "Selected project ZIP:"
            echo "$ZIP_FILE"


            echo ""
            echo "Extracting project..."

            unzip -oq "$ZIP_FILE" -d "$EXTRACT"


            echo ""
            echo "Searching for Gradle wrapper..."

            WRAPPER="$(
              find "$EXTRACT" \
                -type f \
                -name "gradlew" \
                ! -path "*/node_modules/*" \
                -print \
                | head -n 1
            )"

          fi


          # =====================================================
          # Validate Gradle wrapper
          # =====================================================

          if [ -z "${WRAPPER:-}" ] || [ ! -f "$WRAPPER" ]; then

            echo "::error::gradlew was not found."

            echo ""
            echo "Possible project files:"

            find "$WORK" \
              -maxdepth 7 \
              -type f \
              -print \
              | head -300 || true

            exit 1

          fi


          # =====================================================
          # Android directory
          # =====================================================

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"

          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"


          # =====================================================
          # Find project root
          # =====================================================

          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          while [ "$CURRENT" != "/" ]; do

            if [ -f "$CURRENT/package.json" ]; then

              PROJECT_ROOT="$CURRENT"
              break

            fi

            CURRENT="$(dirname "$CURRENT")"

          done


          if [ -z "$PROJECT_ROOT" ]; then

            echo "::error::package.json not found above Android project."

            exit 1

          fi


          echo ""
          echo "Project root:"
          echo "$PROJECT_ROOT"


          # =====================================================
          # Validate Gradle wrapper properties
          # =====================================================

          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then

            echo "::error::Gradle wrapper properties missing."

            exit 1

          fi


          # =====================================================
          # Export environment variables
          # =====================================================

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project detection completed successfully."


      # =========================================================
      # 7. Show project information
      # =========================================================
      - name: Show project information
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "ABIR AI PROJECT"
          echo "=============================================="

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Project files:"

          find "$PROJECT_ROOT" \
            -maxdepth 3 \
            -type f \
            \( \
              -name "package.json" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) \
            -print \
            | sort \
            | head -100 || true


      # =========================================================
      # 8. Install npm dependencies
      # =========================================================
      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Installing npm dependencies..."

          if [ -f package-lock.json ]; then

            npm ci --legacy-peer-deps

          elif [ -f npm-shrinkwrap.json ]; then

            npm ci --legacy-peer-deps

          else

            npm install --legacy-peer-deps

          fi

          echo ""
          echo "npm dependencies installed."


      # =========================================================
      # 9. Verify environment
      # =========================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "NODE"
          echo "=============================================="

          node --version
          npm --version


          echo ""
          echo "=============================================="
          echo "JAVA"
          echo "=============================================="

          java -version


          echo ""
          echo "=============================================="
          echo "ANDROID SDK"
          echo "=============================================="

          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-unknown}}"


          echo ""
          echo "=============================================="
          echo "PROJECT"
          echo "=============================================="

          cd "$PROJECT_ROOT"

          test -f package.json
          test -d node_modules

          echo "package.json OK"
          echo "node_modules OK"


          echo ""
          echo "=============================================="
          echo "GRADLE"
          echo "=============================================="

          cd "$ANDROID_DIR"

          chmod +x gradlew


          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ]; then

            printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties

          fi


          ./gradlew --version


      # =========================================================
      # 10. Verify launcher Kotlin source
      # =========================================================
      - name: Verify Abir launcher Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          LAUNCHER_FILE="$ANDROID_DIR/modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ -f "$LAUNCHER_FILE" ]; then

            echo "Launcher Kotlin file found:"
            echo "$LAUNCHER_FILE"

            echo ""
            echo "Checking for old problematic ln/log calls..."

            grep -nE '\bln\s*\(|\blog\s*\(' "$LAUNCHER_FILE" || true

            echo ""
            echo "Checking Kotlin syntax references..."

            grep -nE 'Math\.log|kotlin\.math' "$LAUNCHER_FILE" || true

          else

            echo "Launcher Kotlin file not found at expected path."
            echo "Continuing because project structure may differ."

          fi


      # =========================================================
      # 11. Build Release APK
      # =========================================================
      - name: Build Abir AI 5.4.9 Release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "=============================================="
          echo "BUILDING ABIR AI 5.4.9"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

          echo ""
          echo "=============================================="
          echo "BUILD COMPLETED"
          echo "=============================================="


      # =========================================================
      # 12. Find generated APK
      # =========================================================
      - name: Collect release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/abir-apk"

          mkdir -p "$OUTPUT"

          echo "Searching for generated release APK..."

          mapfile -t APK_FILES < <(
            find "$ANDROID_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*.apk" \
              ! -name "*-unsigned.apk" \
              -print \
              | sort
          )


          if [ "${#APK_FILES[@]}" -eq 0 ]; then

            echo "::error::Release APK was not generated."

            echo ""
            echo "Searching all APK files..."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print \
              | sort || true

            exit 1

          fi


          echo ""
          echo "Found APK files:"

          printf '%s\n' "${APK_FILES[@]}"


          # -----------------------------------------------------
          # Select first release APK
          # -----------------------------------------------------

          APK="${APK_FILES[0]}"

          echo ""
          echo "Selected APK:"
          echo "$APK"


          cp "$APK" "$OUTPUT/Abir-AI-5.4.9-release.apk"


          echo ""
          echo "Final APK:"
          ls -lh "$OUTPUT/Abir-AI-5.4.9-release.apk"


      # =========================================================
      # 13. Verify APK
      # =========================================================
      - name: Verify final APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK="$RUNNER_TEMP/abir-apk/Abir-AI-5.4.9-release.apk"

          if [ ! -f "$APK" ]; then

            echo "::error::Final APK does not exist."

            exit 1

          fi


          SIZE_BYTES="$(stat -c%s "$APK")"


          if [ "$SIZE_BYTES" -le 100000 ]; then

            echo "::error::APK appears too small: ${SIZE_BYTES} bytes."

            exit 1

          fi


          echo "=============================================="
          echo "APK VERIFICATION"
          echo "=============================================="

          echo "File:"
          echo "$APK"

          echo ""
          echo "Size:"
          ls -lh "$APK"

          echo ""
          echo "Bytes:"
          echo "$SIZE_BYTES"

          echo ""
          echo "APK verification passed."


      # =========================================================
      # 14. Upload APK artifact
      # =========================================================
      - name: Upload Abir AI 5.4.9 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.9-release-APK
          path: ${{ runner.temp }}/abir-apk/Abir-AI-5.4.9-release.apk
          if-no-files-found: error
          retention-days: 7


      # =========================================================
      # 15. Build summary
      # =========================================================
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "ABIR AI 5.4.9 BUILD SUCCESSFUL"
          echo "=============================================="
          echo ""
          echo "APK:"
          echo "Abir-AI-5.4.9-release.apk"
          echo ""
          echo "Artifact:"
          echo "Abir-AI-5.4.9-release-APK"
          echo ""
          echo "Build completed successfully."
