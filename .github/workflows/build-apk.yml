name: Build Abir AI 3.7.0 Coding Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      ABIR_VERSION: "3.7.0"
      ABIR_VERSION_CODE: "16"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false

      # ==========================================
      # Find 3.7.0 Source
      # ==========================================
      - name: Find Abir AI 3.7.0 Source
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-3.7.0-CodingAgent-Boss.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: 3.7.0 source ZIP not found!"
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "SOURCE: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

      # ==========================================
      # Find Android Project
      # ==========================================
      - name: Find Abir AI Project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted \
              -type f \
              -name package.json \
              -exec sh -c '
                for f do
                  d=$(dirname "$f")
                  if [ -f "$d/android/gradlew" ]; then
                    echo "$f"
                    break
                  fi
                done
              ' sh {} + | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")
          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT: $PROJECT_DIR"

      # ==========================================
      # Check Project
      # ==========================================
      - name: Check Project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          chmod +x android/gradlew

          echo "Project OK"

      # ==========================================
      # Install Dependencies
      # ==========================================
      - name: Install Dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

      # ==========================================
      # FIX VERSION EVERYWHERE
      # ==========================================
      - name: Fix Abir AI Version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = "3.7.0"
          VERSION_CODE = 16

          # --------------------------------------
          # app.json
          # --------------------------------------
          app_json = Path("app.json")

          if app_json.exists():
              data = json.loads(app_json.read_text())

              expo = data.setdefault("expo", {})
              expo["version"] = VERSION

              android = expo.setdefault("android", {})
              android["versionCode"] = VERSION_CODE

              app_json.write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + "\n"
              )

              print("app.json fixed")

          # --------------------------------------
          # android/app/build.gradle
          # --------------------------------------
          gradle = Path("android/app/build.gradle")

          if gradle.exists():
              s = gradle.read_text()

              s = re.sub(
                  r'versionCode\s+\d+',
                  f'versionCode {VERSION_CODE}',
                  s,
                  count=1
              )

              s = re.sub(
                  r'versionName\s+["\'][^"\']+["\']',
                  f'versionName "{VERSION}"',
                  s,
                  count=1
              )

              gradle.write_text(s)

              print("android/app/build.gradle fixed")

          # --------------------------------------
          # Launcher Gradle
          # --------------------------------------
          launcher = list(
              Path(".").glob(
                  "modules/abir-app-launcher/android/build.gradle"
              )
          )

          if launcher:
              p = launcher[0]
              s = p.read_text()

              if "defaultConfig" not in s:
                  s = s.replace(
                      "android {",
                      """android {
    defaultConfig {
        versionName "3.7.0"
    }""",
                      1
                  )
              elif "versionName" not in s:
                  s = s.replace(
                      "defaultConfig {",
                      'defaultConfig {\n        versionName "3.7.0"',
                      1
                  )

              p.write_text(s)

              print("Launcher Gradle fixed")
          PY

      # ==========================================
      # FIX Contacts Kotlin
      # ==========================================
      - name: Fix Contacts Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAppLauncherModule.kt" \
            -print -quit)

          if [ -n "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0)",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0L.toLong())",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          p.write_text(s)
          PY
          fi

      # ==========================================
      # FIX Accessibility
      # ==========================================
      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -n "$FILE" ]; then
            python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          replacements = {
              "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
              "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY
          fi

      # ==========================================
      # Verify Important Systems
      # ==========================================
      - name: Verify Abir Systems
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Checking Abir AI systems..."

          test -f assistant/offlineBrain.ts
          test -f assistant/onlineAssistant.ts
          test -f assistant/voiceInput.ts
          test -f assistant/textToSpeech.ts
          test -f assistant/voiceSelection.ts
          test -f assistant/voicePreferences.ts
          test -f assistant/androidActions.ts
          test -f assistant/intentParser.ts
          test -f assistant/localMemory.ts
          test -f assistant/commandEngine.ts

          echo "All important systems found."

      # ==========================================
      # Verify Version
      # ==========================================
      - name: Verify Version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "===== VERSION CHECK ====="

          grep -n '"version": "3.7.0"' app.json

          grep -n 'versionCode 16' android/app/build.gradle

          grep -n 'versionName "3.7.0"' android/app/build.gradle

          echo "Version verification passed."

      # ==========================================
      # Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew --version

      # ==========================================
      # Clean
      # ==========================================
      - name: Clean Android Build
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean --no-daemon

      # ==========================================
      # BUILD RELEASE APK
      # ==========================================
      - name: Build Abir AI 3.7.0 Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI 3.7.0"
          echo "=========================================="

          echo "Version: 3.7.0"
          echo "Version Code: 16"
          echo "Offline: Enabled"
          echo "Online Gemini: Enabled"
          echo "Voice: Enabled"
          echo "Wake Word: Enabled"
          echo "Mobile Control: Enabled"
          echo "Camera: Enabled"
          echo "App Lock: Enabled"
          echo "Coding Agent: Enabled"
          echo "Boss Mode: Enabled"
          echo ""

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "BUILD COMPLETED SUCCESSFULLY."

      # ==========================================
      # Find APK
      # ==========================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: RELEASE APK NOT FOUND!"

            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-3.7.0-CodingAgent-Boss.apk"

          ls -lh release/Abir-AI-3.7.0-CodingAgent-Boss.apk

      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-3.7.0-CodingAgent-Boss
          path: ${{ env.PROJECT }}/release/Abir-AI-3.7.0-CodingAgent-Boss.apk
          if-no-files-found: error
