name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. Locate and extract the project
      - name: Locate project files
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"
          mkdir -p "$EXTRACT"

          WRAPPER=""

          # Check common project locations first
          if [ -f "$WORK/android/gradlew" ]; then
            WRAPPER="$WORK/android/gradlew"
          elif [ -f "$WORK/gradlew" ]; then
            WRAPPER="$WORK/gradlew"
          else
            # Extract a ZIP if no Gradle wrapper exists
            ZIP_FILE="$(find "$WORK" -maxdepth 4 \
              -type f -name '*.zip' \
              ! -path '*/.git/*' \
              -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Extracting project ZIP: $ZIP_FILE"
              unzip -oq "$ZIP_FILE" -d "$EXTRACT"

              WRAPPER="$(find "$EXTRACT" \
                -type f -name gradlew \
                ! -path '*/node_modules/*' \
                -print -quit || true)"
            fi
          fi

          if [ -z "$WRAPPER" ] || [ ! -f "$WRAPPER" ]; then
            echo "::error::Could not find Gradle wrapper."
            exit 1
          fi

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"
          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          # Search upward for package.json
          while [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/package.json" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi
            CURRENT="$(dirname "$CURRENT")"
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Could not find package.json above gradlew."
            echo "Check that the ZIP contains the complete React Native/Expo project."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          echo "Android directory: $ANDROID_DIR"
          echo "Project package.json:"
          ls -l "$PROJECT_ROOT/package.json"

      # 6. Install JavaScript dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 7. Check project configuration
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"
          echo "Project root files:"
          ls -la

          cd "$ANDROID_DIR"
          chmod +x gradlew

          echo "Android Gradle configuration:"
          find . -maxdepth 3 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) -print

      # 8. Build release APK
      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd "$ANDROID_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 9. Collect APK
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-apk"

          find "$ANDROID_DIR" -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$RUNNER_TEMP/abir-apk/" \;

          if ! find "$RUNNER_TEMP/abir-apk" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          ls -lh "$RUNNER_TEMP/abir-apk"

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: ${{ runner.temp }}/abir-apk/*.apk
          if-no-files-found: error
          retention-days: 7
