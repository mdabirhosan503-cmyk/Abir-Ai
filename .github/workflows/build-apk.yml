name: Build Abir AI 5.4.24

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ABIR_VERSION: "5.4.24"

  SOURCE_ZIP: "AbirAI-5.4.24-BLACK-RED-MAIN-UI-ALL-FEATURES-PRESERVED.zip"
  EXPECTED_SHA256: "e6cbb58af02e19373ae86cebcd762f9e5157f4893038dc93a245dab8e6e71474"

  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Abir AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. PNPM
      # ==========================================

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      # ==========================================
      # 4. NODE 20
      # ==========================================

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ==========================================
      # 5. ENVIRONMENT CHECK
      # ==========================================

      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ABIR AI BUILD =========="
          echo "Version: $ABIR_VERSION"

          node --version
          pnpm --version
          java -version

          echo "Android SDK: $ANDROID_HOME"
          df -h

      # ==========================================
      # 6. ANDROID SDK
      # ==========================================

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print -quit 2>/dev/null || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

          echo "Android SDK installation completed."

      # ==========================================
      # 7. PREPARE DIRECTORIES
      # ==========================================

      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          rm -rf \
            "$GITHUB_WORKSPACE/abir_build" \
            "$GITHUB_WORKSPACE/abir_extracted" \
            "$GITHUB_WORKSPACE/build-diagnostics" \
            "$GITHUB_WORKSPACE/release"

          mkdir -p \
            "$GITHUB_WORKSPACE/abir_build" \
            "$GITHUB_WORKSPACE/abir_extracted" \
            "$GITHUB_WORKSPACE/build-diagnostics" \
            "$GITHUB_WORKSPACE/release"

      # ==========================================
      # 8. FIND EXACT BLACK-RED SOURCE ZIP
      # ==========================================

      - name: Find Abir AI Black Red UI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Required source ZIP not found."
            echo "Expected: $SOURCE_ZIP"

            echo "ZIP files in repository:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path "*/.git/*" \
              -print || true

            exit 1
          fi

          cp "$ZIP" "$GITHUB_WORKSPACE/abir_build/source.zip"

          echo "Selected source ZIP:"
          echo "$SOURCE_ZIP"

      # ==========================================
      # 9. VERIFY ZIP AND SHA-256
      # ==========================================

      - name: Verify source ZIP integrity and SHA-256
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/abir_build/source.zip"

          unzip -tq "$ZIP"

          ACTUAL_SHA256="$(sha256sum "$ZIP" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          echo "$ACTUAL_SHA256" \
            > "$GITHUB_WORKSPACE/build-diagnostics/source-sha256.txt"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Source ZIP SHA-256 mismatch."
            exit 1
          fi

          echo "ZIP integrity and SHA-256 verified."
          ls -lh "$ZIP"

      # ==========================================
      # 10. EXTRACT SOURCE
      # ==========================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$GITHUB_WORKSPACE/abir_build/source.zip" \
            -d "$GITHUB_WORKSPACE/abir_extracted"

          echo "Source extraction completed."

          find "$GITHUB_WORKSPACE/abir_extracted" \
            -maxdepth 2 \
            -mindepth 1 \
            -print | head -n 200

      # ==========================================
      # 11. DETECT ANDROID PROJECT ROOT
      # ==========================================

      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACTED="$GITHUB_WORKSPACE/abir_extracted"
          PROJECT_DIR=""

          if [ -f "$EXTRACTED/package.json" ] &&
             [ -f "$EXTRACTED/app.json" ] &&
             [ -f "$EXTRACTED/android/gradlew" ]; then

            PROJECT_DIR="$EXTRACTED"

          else

            while IFS= read -r -d '' PKG; do
              ROOT="$(dirname "$PKG")"

              if [ -f "$ROOT/app.json" ] &&
                 [ -f "$ROOT/android/gradlew" ] &&
                 [ -f "$ROOT/android/gradle/wrapper/gradle-wrapper.properties" ]; then

                PROJECT_DIR="$ROOT"
                break
              fi

            done < <(
              find "$EXTRACTED" \
                -type f \
                -name package.json \
                -print0
            )

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project root not found."

            find "$EXTRACTED" \
              -type f \
              \( -name package.json -o -name gradlew \) \
              -print || true

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"

      # ==========================================
      # 12. GRADLE CACHE
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      # ==========================================
      # 13. VERIFY PROJECT STRUCTURE
      # ==========================================

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f package.json
          test -f app.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Project structure verified."

          node <<'NODE'
          const p = require("./package.json");

          console.log(JSON.stringify({
            name: p.name || null,
            version: p.version || null,
            expo: p.dependencies?.expo || p.devDependencies?.expo || null,
            react: p.dependencies?.react || p.devDependencies?.react || null,
            reactNative:
              p.dependencies?.["react-native"] ||
              p.devDependencies?.["react-native"] ||
              null,
            expoCamera:
              p.dependencies?.["expo-camera"] ||
              p.devDependencies?.["expo-camera"] ||
              null
          }, null, 2));
          NODE

          echo "Checking important Abir AI files..."

          for FILE in \
            assistant/voiceManager.ts \
            assistant/androidActions.ts \
            assistant/onlineAssistant.ts \
            app/index.tsx \
            components/ExactReferenceDashboard.tsx \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/WakeWordService.kt \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirNotificationListenerService.kt
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "NOTICE: $FILE not found"
            fi
          done

      # ==========================================
      # 14. PREPARE ANDROID GRADLE
      # ==========================================

      - name: Prepare Android Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Android SDK configured."
          cat gradle/wrapper/gradle-wrapper.properties

      # ==========================================
      # 15. INSTALL JAVASCRIPT DEPENDENCIES
      # ==========================================

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml not found."
            pnpm install
          fi

          echo "JavaScript dependencies installed."

      # ==========================================
      # 16. VERIFY EXPO
      # ==========================================

      - name: Verify Expo configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          pnpm exec expo --version

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

          echo "Expo configuration generated."

      # ==========================================
      # 17. VERIFY DEPENDENCIES
      # ==========================================

      - name: Verify Expo Android dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          node <<'NODE'
          const checks = [
            "expo/package.json",
            "react-native/package.json"
          ];

          let failed = false;

          for (const item of checks) {
            try {
              console.log("FOUND:", require.resolve(item));
            } catch (error) {
              console.error("MISSING:", item);
              failed = true;
            }
          }

          if (failed) process.exit(1);
          NODE

          echo "Dependencies verified."

      # ==========================================
      # 18. PREPARE GRADLE PROPERTIES
      # ==========================================

      - name: Prepare Gradle properties
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          touch gradle.properties

          if [ -s gradle.properties ]; then
            LAST_BYTE="$(
              tail -c 1 gradle.properties |
              od -An -t x1 |
              tr -d ' '
            )"

            if [ "$LAST_BYTE" != "0a" ]; then
              printf "\n" >> gradle.properties
            fi
          fi

          if ! grep -qxF "org.gradle.daemon=false" gradle.properties; then
            printf "\norg.gradle.daemon=false\n" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.jvmargs=" gradle.properties; then
            printf "%s\n" \
              "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
              >> gradle.properties
          fi

          if grep -nE \
            "expo\.inlineModules\.watchedDirectories=.*org\.gradle\." \
            gradle.properties; then
            echo "::error::Malformed gradle.properties."
            cat gradle.properties
            exit 1
          fi

          cat gradle.properties

      # ==========================================
      # 19. GRADLE PREFLIGHT
      # ==========================================

      - name: Run Gradle preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew \
            --version \
            --no-daemon \
            --stacktrace \
            --console=plain

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      # ==========================================
      # 20. BUILD RELEASE APK
      # ==========================================

      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "Building Abir AI $ABIR_VERSION"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

          echo "Release build command completed."

      # ==========================================
      # 21. FIND AND VERIFY RELEASE APK
      # ==========================================

      - name: Collect and verify Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_ROOT="$PROJECT_DIR/android/app/build/outputs/apk"

          if [ ! -d "$APK_ROOT" ]; then
            echo "::error::APK output directory not found."

            find "$PROJECT_DIR/android/app/build" \
              -maxdepth 6 \
              -print 2>/dev/null || true

            exit 1
          fi

          mapfile -d '' APK_FILES < <(
            find "$APK_ROOT" \
              -type f \
              -name "*.apk" \
              -print0 |
            sort -z
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "::error::No APK was generated."
            find "$APK_ROOT" -type f -print || true
            exit 1
          fi

          APK="${APK_FILES[0]}"

          OUTPUT_APK="$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          cp "$APK" "$OUTPUT_APK"

          test -s "$OUTPUT_APK"
          unzip -tq "$OUTPUT_APK"

          echo "Generated APK:"
          ls -lh "$OUTPUT_APK"

          sha256sum "$OUTPUT_APK" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

          echo "Release APK verified."

      # ==========================================
      # 22. UPLOAD RELEASE APK
      # ==========================================

      - name: Upload Abir AI Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 23. UPLOAD BUILD DIAGNOSTICS
      # ==========================================

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # ==========================================
      # 24. FINAL BUILD SUMMARY
      # ==========================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "========== ABIR AI BUILD SUMMARY =========="

          echo "Version: $ABIR_VERSION"

          echo ""
          echo "Release directory:"

          if [ -d "$GITHUB_WORKSPACE/release" ]; then
            ls -lah "$GITHUB_WORKSPACE/release"
          else
            echo "No release directory."
          fi

          echo ""
          echo "Diagnostics directory:"

          if [ -d "$GITHUB_WORKSPACE/build-diagnostics" ]; then
            ls -lah "$GITHUB_WORKSPACE/build-diagnostics"
          else
            echo "No diagnostics directory."
          fi

          echo ""
          echo "=========================================="
