name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ZIP_NAME: AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip
      PROJECT_DIR: extracted
      JAVA_VERSION: "17"
      NODE_VERSION: "20"
      PNPM_VERSION: "10.12.4"

      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. JAVA 17
      # IMPORTANT:
      # No Gradle cache here because the Gradle project is inside ZIP.
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # =========================================================
      # 3. NODE 20
      # No pnpm cache because pnpm-lock may also be inside ZIP.
      # =========================================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # =========================================================
      # 4. PNPM
      # =========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      # =========================================================
      # 5. CHECK TOOLS
      # =========================================================
      - name: Check build tools
        shell: bash
        run: |
          set -eux

          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          java -version
          node --version
          npm --version
          pnpm --version

          echo ""
          echo "Android SDK:"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

      # =========================================================
      # 6. FIND ZIP
      # =========================================================
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -eux

          echo "Looking for:"
          echo "${ZIP_NAME}"

          FOUND="$(find . -type f -name "${ZIP_NAME}" -print -quit || true)"

          if [ -z "$FOUND" ]; then
            echo ""
            echo "ERROR: ZIP NOT FOUND"
            echo ""

            echo "Available ZIP files:"
            find . -type f \
              \( -iname '*.zip' -o -iname '*.ZIP' \) \
              -print | sort || true

            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          echo "$FOUND"

          rm -rf "${PROJECT_DIR}"
          mkdir -p "${PROJECT_DIR}"

          unzip -q "$FOUND" -d "${PROJECT_DIR}"

          echo ""
          echo "ZIP extracted successfully."

      # =========================================================
      # 7. FIND ACTUAL PROJECT ROOT
      # =========================================================
      - name: Detect project root
        shell: bash
        run: |
          set -eux

          echo "Searching for Gradle wrapper..."

          GRADLEW="$(find "${PROJECT_DIR}" \
            -type f \
            -name gradlew \
            -print -quit || true)"

          if [ -z "$GRADLEW" ]; then
            echo ""
            echo "ERROR: gradlew not found."
            echo ""
            echo "Extracted structure:"
            find "${PROJECT_DIR}" -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          ROOT="$(dirname "$GRADLEW")"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          echo "$ROOT"

      # =========================================================
      # 8. VERIFY PROJECT
      # =========================================================
      - name: Verify Abir AI project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          echo "Checking required files..."

          test -f package.json
          test -f android/settings.gradle
          test -f android/gradlew

          if [ -f app.json ]; then
            echo "app.json found."
          fi

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Android files:"
          ls -la android

      # =========================================================
      # 9. PREPARE GRADLE WRAPPER
      # =========================================================
      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      # =========================================================
      # 10. PREPARE ANDROID SDK
      # =========================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          echo "Android SDK:"
          echo "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK ready."

      # =========================================================
      # 11. INSTALL JS DEPENDENCIES
      # =========================================================
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          corepack enable || true

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm-lock.yaml found."
            pnpm install --no-frozen-lockfile
          else
            echo "No pnpm-lock.yaml found."
            pnpm install --no-frozen-lockfile
          fi

          echo ""
          echo "JavaScript dependencies installed."

      # =========================================================
      # 12. VERIFY EXPO / REACT NATIVE
      # =========================================================
      - name: Verify Expo and React Native
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Expo:"
          pnpm exec expo --version

          echo ""
          echo "React Native:"
          node -p "require('react-native/package.json').version"

          echo ""
          echo "Expo package:"
          node -p "require('expo/package.json').version"

          echo ""
          echo "Expo autolinking package:"
          node -p "require('expo-modules-autolinking/package.json').version"

          echo ""
          echo "React Native Gradle plugin:"
          node -p "require.resolve('@react-native/gradle-plugin/package.json')"

      # =========================================================
      # 13. TEST EXPO AUTOLINKING
      # =========================================================
      - name: Diagnose Expo Node and Autolinking
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo " NODE / EXPO DIAGNOSTICS"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Expo:"
          pnpm exec expo --version

          echo ""
          echo "Expo Autolinking package:"
          pnpm exec expo-modules-autolinking --version

          echo ""
          echo "=========================================="
          echo " AUTOLINKING SEARCH"
          echo "=========================================="

          pnpm exec expo-modules-autolinking search

          echo ""
          echo "=========================================="
          echo " AUTOLINKING RESOLVE"
          echo "=========================================="

          pnpm exec expo-modules-autolinking resolve \
            --platform android

          echo ""
          echo "=========================================="
          echo " AUTOLINKING VERIFY"
          echo "=========================================="

          pnpm exec expo-modules-autolinking verify --verbose

          echo ""
          echo "Node diagnostics completed."

      # =========================================================
      # 14. VERIFY ABIR CUSTOM MODULE
      # =========================================================
      - name: Verify Abir App Launcher
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          if [ -d "modules/abir-app-launcher" ]; then

            echo "Abir App Launcher found."

            test -f \
              modules/abir-app-launcher/package.json

            test -f \
              modules/abir-app-launcher/expo-module.config.json

            echo ""
            echo "expo-module.config.json:"
            cat modules/abir-app-launcher/expo-module.config.json

            echo ""
            echo "Android module:"
            find modules/abir-app-launcher/android \
              -maxdepth 5 \
              -type f \
              -print | sort

          else

            echo "WARNING:"
            echo "modules/abir-app-launcher not found."

          fi

      # =========================================================
      # 15. FIX ResolveInfoFlags
      # =========================================================
      - name: Fix Android ResolveInfoFlags compatibility
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          grep -RIl \
            "ResolveInfoFlags.of(0)" \
            modules android \
            2>/dev/null \
            | while read -r FILE; do

                echo "Fixing:"
                echo "$FILE"

                sed -i \
                  's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
                  "$FILE"

            done || true

      # =========================================================
      # 16. VALIDATE PNG
      # =========================================================
      - name: Validate PNG assets
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          BAD=0

          while IFS= read -r -d '' FILE; do

            MAGIC="$(xxd -p -l 8 "$FILE" 2>/dev/null || true)"

            if [ "$MAGIC" != "89504e470d0a1a0a" ]; then

              echo ""
              echo "INVALID PNG:"
              echo "$FILE"
              echo "Signature: $MAGIC"

              BAD=1

            fi

          done < <(
            find . \
              -type f \
              -iname '*.png' \
              -print0
          )

          if [ "$BAD" -ne 0 ]; then
            echo ""
            echo "ERROR: Invalid PNG asset detected."
            exit 1
          fi

          echo "All PNG assets are valid."

      # =========================================================
      # 17. CHECK MANIFESTS
      # =========================================================
      - name: Check Android manifests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          echo "Android manifests:"

          find . \
            -type f \
            -name AndroidManifest.xml \
            -print

          echo ""
          echo "Checking service placement..."

          grep -R \
            "<service" \
            modules \
            android \
            2>/dev/null \
            || true

      # =========================================================
      # 18. GRADLE MEMORY
      # =========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -eux

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

          echo "Gradle properties:"
          cat ~/.gradle/gradle.properties

      # =========================================================
      # 19. CLEAN
      # =========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux

          chmod +x gradlew

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================================
      # 20. BUILD RELEASE
      # =========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          echo "=========================================="
          echo " BUILDING ABIR AI RELEASE APK"
          echo "=========================================="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      # =========================================================
      # 21. COLLECT APK
      # =========================================================
      - name: Collect APK
        if: success()
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          APK="$(find android/app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            find android/app/build/outputs \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

          echo ""
          echo "=========================================="
          echo " APK CREATED"
          echo "=========================================="

          ls -lh \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

      # =========================================================
      # 22. UPLOAD APK
      # =========================================================
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Release-APK
          path: release/Abir-AI-5.4.16-release.apk
          if-no-files-found: error

      # =========================================================
      # 23. UPLOAD DIAGNOSTICS IF FAILED
      # =========================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Build-Diagnostics
          path: |
            abir-build.log
            extracted/**/android/build/reports/**
            extracted/**/android/app/build/outputs/logs/**
          if-no-files-found: warn
