name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js
      # IMPORTANT:
      # এখানে cache: npm ব্যবহার করা হয়নি,
      # কারণ package-lock.json ZIP-এর ভিতরে থাকতে পারে।
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools

      # 5. Find Android project / ZIP
      - name: Locate project files
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"

          mkdir -p "$EXTRACT"

          WRAPPER=""

          # Direct Android project
          if [ -f "$WORK/android/gradlew" ]; then
            WRAPPER="$WORK/android/gradlew"

          elif [ -f "$WORK/gradlew" ]; then
            WRAPPER="$WORK/gradlew"

          else
            # Find project ZIP
            ZIP_FILE="$(find "$WORK" \
              -maxdepth 5 \
              -type f \
              -name '*.zip' \
              ! -path '*/.git/*' \
              -print -quit || true)"

            if [ -n "$ZIP_FILE" ]; then
              echo "Found project ZIP:"
              echo "$ZIP_FILE"

              echo "Extracting project ZIP..."
              unzip -oq "$ZIP_FILE" -d "$EXTRACT"

              WRAPPER="$(find "$EXTRACT" \
                -type f \
                -name gradlew \
                ! -path '*/node_modules/*' \
                -print -quit || true)"
            fi
          fi

          # Check Gradle wrapper
          if [ -z "$WRAPPER" ] || [ ! -f "$WRAPPER" ]; then
            echo "::error::Gradle wrapper not found."
            echo "Make sure the project contains android/gradlew."
            exit 1
          fi

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"

          # Find package.json above Android directory
          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          while [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/package.json" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi

            CURRENT="$(dirname "$CURRENT")"
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          # Check Gradle wrapper properties
          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================="
          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"
          echo "=============================="

      # 6. Install npm dependencies
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Installing dependencies..."

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      # 7. Verify environment
      - name: Verify project and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          echo "Checking project..."

          test -f package.json
          test -d node_modules

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "NPM:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not set}}"

          cd "$ANDROID_DIR"

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ] && [ ! -f local.properties ]; then
            printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties
          fi

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
            \) \
            -print

      # 8. Build APK
      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          chmod +x gradlew

          echo "Starting Gradle build..."

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      # 9. Collect APK
      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/abir-apk"

          mkdir -p "$OUTPUT"

          find "$ANDROID_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$OUTPUT/" \;

          if ! find "$OUTPUT" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | grep -q .; then

            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "=============================="
          echo "Generated APK:"
          echo "=============================="

          ls -lh "$OUTPUT"

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: ${{ runner.temp }}/abir-apk/*.apk
          if-no-files-found: error
          retention-days: 7
