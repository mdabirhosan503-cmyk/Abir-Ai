name: Build Abir AI 3.7.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      - name: Extract source
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted -type f -path "*/artifacts/abir-ai/package.json" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found"
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e
          pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Fix launcher versionName
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          echo "Checking launcher:"
          echo "$FILE"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Launcher Gradle file not found"
            find modules -type f -name "build.gradle" -print
            exit 1
          fi

          if grep -q "defaultConfig" "$FILE"; then

            if grep -q "versionName" "$FILE"; then
              sed -i 's/versionName "[^"]*"/versionName "3.7.0"/' "$FILE"
            else
              sed -i '/defaultConfig[[:space:]]*{/a\        versionName "3.7.0"' "$FILE"
            fi

            if grep -q "versionCode" "$FILE"; then
              sed -i 's/versionCode [0-9]*/versionCode 16/' "$FILE"
            else
              sed -i '/defaultConfig[[:space:]]*{/a\        versionCode 16' "$FILE"
            fi

          else

            sed -i '/android[[:space:]]*{/a\    defaultConfig {\n        versionCode 16\n        versionName "3.7.0"\n    }' "$FILE"

          fi

          echo "Final launcher Gradle:"
          cat "$FILE"

      - name: Fix launcher Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ -f "$FILE" ]; then
            sed -i 's/ResolveInfoFlags.of(0)/ResolveInfoFlags.of(0L)/g' "$FILE"
            echo "Contacts Kotlin fixed"
          fi

      - name: Fix accessibility Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAccessibilityService.kt"

          if [ -f "$FILE" ]; then

            sed -i 's/AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED/32/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED/2048/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED/16/g' "$FILE"

            sed -i 's/AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED/32/g' "$FILE"
            sed -i 's/AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED/2048/g' "$FILE"
            sed -i 's/AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED/16/g' "$FILE"

            echo "Accessibility Kotlin fixed"
          fi

      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then

            if grep -q "versionCode" android/app/build.gradle; then
              sed -i '0,/versionCode [0-9]*/s//versionCode 16/' android/app/build.gradle
            fi

            if grep -q "versionName" android/app/build.gradle; then
              sed -i '0,/versionName "[^"]*"/s//versionName "3.7.0"/' android/app/build.gradle
            fi

          fi

          if [ -f app.json ]; then
            sed -i 's/"version": "[^"]*"/"version": "3.7.0"/' app.json
          fi

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e
          chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        shell: bash
        run: |
          set -e

          ./gradlew clean --no-daemon

          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android -type f -path "*/build/outputs/apk/release/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find android -type f -name "*.apk"
            exit 1
          fi

          mkdir -p release

          cp "$APK" release/Abir-AI-3.7.0-release.apk

          ls -lh release/Abir-AI-3.7.0-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-3.7.0-release
          path: ${{ env.PROJECT }}/release/Abir-AI-3.7.0-release.apk
          if-no-files-found: error
