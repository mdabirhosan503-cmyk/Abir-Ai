name: Build Abir AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"

      - name: Extract source
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          echo "Using $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find project
        shell: bash
        run: |
          set -e
          FILE=$(find extracted -type f -path "*/artifacts/abir-ai/package.json" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Project not found"
            exit 1
          fi
          PROJECT=$(dirname "$FILE")
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e
          pnpm install --no-frozen-lockfile --allow-build=esbuild

      - name: Fix Kotlin
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . -type f -name "AbirAppLauncherModule.kt" | head -n 1)

          if [ -n "$FILE" ]; then
            sed -i 's/ResolveInfoFlags.of(0)/ResolveInfoFlags.of(0L)/g' "$FILE"
          fi

          FILE=$(find . -type f -name "AbirAccessibilityService.kt" | head -n 1)

          if [ -n "$FILE" ]; then
            sed -i 's/AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED/16/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED/32/g' "$FILE"
            sed -i 's/AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED/2048/g' "$FILE"
          fi

      - name: Fix launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find android -type f -path "*/abir-app-launcher/build.gradle" | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Launcher Gradle file not found"
            exit 1
          fi

          echo "Launcher: $FILE"

          if ! grep -q "versionName" "$FILE"; then
            sed -i '/defaultConfig[[:space:]]*{/a\        versionName "3.7.0"' "$FILE"
          fi

          if ! grep -q "versionCode" "$FILE"; then
            sed -i '/defaultConfig[[:space:]]*{/a\        versionCode 16' "$FILE"
          fi

      - name: Fix app version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/build.gradle ]; then
            sed -i 's/versionCode [0-9]*/versionCode 16/' android/app/build.gradle
            sed -i 's/versionName "[^"]*"/versionName "3.7.0"/' android/app/build.gradle
          fi

          if [ -f app.json ]; then
            sed -i 's/"version": "[^"]*"/"version": "3.7.0"/' app.json
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Abir-AI-release.apk

          ls -lh release/Abir-AI-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-apk
          path: ${{ env.PROJECT }}/release/Abir-AI-release.apk
          if-no-files-found: error
