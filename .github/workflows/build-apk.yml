name: Build Abir AI 4.5.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      # IMPORTANT: Do NOT use cache: pnpm here.
      # pnpm must exist before setup-node can use pnpm cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 3. Install pnpm first
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
          run_install: false

      # 4. Cache pnpm store
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # 5. Verify tools
      - name: Verify Node and pnpm
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "pnpm:"
          pnpm --version

      # 6. Find uploaded Abir AI ZIP
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -la

          ZIP="AbirAI-4.5.0-All-Features-Audit-Final.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found!"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP"

      # 7. Extract project
      - name: Extract Abir AI project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            "AbirAI-4.5.0-All-Features-Audit-Final.zip" \
            -d extracted

          echo "Extracted structure:"
          find extracted -maxdepth 3 -type f \
            \( -name "package.json" -o -name "app.json" -o -name "gradlew" \) \
            -print

      # 8. Detect project directory
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          if [ -f "extracted/src/app.json" ]; then
            PROJECT="extracted/src"
          elif [ -f "extracted/app.json" ]; then
            PROJECT="extracted"
          else
            echo "ERROR: Cannot find app.json"

            echo "Extracted directories:"
            find extracted -maxdepth 3 -type d -print

            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT"

          echo "Project files:"
          ls -la "$PROJECT"

      # 9. Install Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 10. Install Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 11. Accept Android licenses
      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      # 12. Install project dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          if [ -f "pnpm-lock.yaml" ]; then
            pnpm install --frozen-lockfile
          elif [ -f "package.json" ]; then
            pnpm install
          else
            echo "No package.json found."
          fi

      # 13. Verify Android project
      - name: Verify Android project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: android directory not found!"
            find . -maxdepth 3 -type d -print
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found!"
            ls -la android || true
            exit 1
          fi

          echo "Android project found."

      # 14. Make Gradle executable
      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          chmod +x gradlew

      # 15. Ensure launcher module has versionName
      - name: Fix launcher module version
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ -f "$FILE" ]; then
            echo "Checking $FILE"

            if ! grep -q 'versionName' "$FILE"; then
              echo 'versionName "1.0.0"' >> "$FILE"
              echo "Added versionName."
            else
              echo "versionName already exists."
            fi
          else
            echo "Launcher build.gradle not found; continuing."
          fi

      # 16. Show Android Gradle version
      - name: Check Gradle
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          ./gradlew --version

      # 17. Build Release APK
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        shell: bash
        run: |
          set -e

          echo "Building Abir AI 4.5.0..."

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 18. Find APK
      - name: Find generated APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # 19. Rename APK
      - name: Prepare APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*release*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              -print -quit)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-4.5.0-release.apk"

          echo "Final APK:"
          ls -lh \
            "$GITHUB_WORKSPACE/release/Abir-AI-4.5.0-release.apk"

      # 20. Upload APK
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.5.0-release
          path: release/Abir-AI-4.5.0-release.apk
          if-no-files-found: error
          retention-days: 30

      # 21. Build summary
      - name: Build summary
        shell: bash
        run: |
          echo "======================================"
          echo "       ABIR AI 4.5.0 BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.5.0-release.apk
          echo ""
          echo "Version: 4.5.0"
          echo "Version Code: 23"
          echo "======================================"
