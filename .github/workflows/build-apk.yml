name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm


      # ==========================================
      # 4. pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ==========================================
      # 5. Check tools
      # ==========================================
      - name: Check build tools
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo "================================"


      # ==========================================
      # 6. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing Android SDK..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Android SDK ready."


      # ==========================================
      # 7. Find Abir AI source ZIP
      # ==========================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Abir AI ZIP..."

          ZIP_FILES=()

          while IFS= read -r file; do
            ZIP_FILES+=("$file")
          done < <(
            find . \
              -type f \
              -name "AbirAI-*.zip" \
              -not -path "./.git/*" \
              -print
          )

          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo ""
            echo "ERROR: No Abir AI ZIP found."
            echo ""
            echo "Available ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print || true
            exit 1
          fi

          echo ""
          echo "Found ZIP files:"
          printf '%s\n' "${ZIP_FILES[@]}"

          # Prefer the newest modified AbirAI ZIP
          ZIP_FILE="$(
            printf '%s\n' "${ZIP_FILES[@]}" |
            xargs -r ls -1t |
            head -n 1
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Could not select source ZIP."
            exit 1
          fi

          echo ""
          echo "Selected source ZIP:"
          echo "$ZIP_FILE"

          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 8. Verify ZIP
      # ==========================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP integrity..."

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity: OK"


      # ==========================================
      # 9. Extract
      # ==========================================
      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source extracted."

          echo ""
          echo "Extracted top-level:"
          find extracted \
            -maxdepth 2 \
            -type f \
            | head -100


      # ==========================================
      # 10. Detect Android project
      # ==========================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # --------------------------------------
          # Normal project layout
          # --------------------------------------
          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          # --------------------------------------
          # src layout
          # --------------------------------------
          elif [ -f "extracted/src/package.json" ] &&
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          else

            # ------------------------------------
            # Search for Android project
            # ------------------------------------
            while IFS= read -r android_dir; do

              candidate="$(dirname "$android_dir")"

              if [ -f "$candidate/package.json" ] &&
                 [ -f "$candidate/android/gradlew" ]; then

                PROJECT_DIR="$candidate"
                break

              fi

            done < <(
              find extracted \
                -type d \
                -name android \
                -print
            )

          fi


          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Abir AI Android project not found."

            echo ""
            echo "package.json files:"
            find extracted \
              -type f \
              -name package.json \
              -print

            echo ""
            echo "Android directories:"
            find extracted \
              -type d \
              -name android \
              -print

            exit 1
          fi


          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi


          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi


          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: android/gradlew missing."
            exit 1
          fi


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "ABIR AI PROJECT"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # ==========================================
      # 11. Read project version
      # ==========================================
      - name: Read Abir AI version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          VERSION="$(
            node -p "
              try {
                require('./package.json').version || 'unknown'
              } catch(e) {
                'unknown'
              }
            "
          )"

          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi

          echo "ABIR_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "Abir AI version:"
          echo "$VERSION"


      # ==========================================
      # 12. Verify project files
      # ==========================================
      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"


      # ==========================================
      # 13. Check broken workspace dependency
      # ==========================================
      - name: Check workspace dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if grep -Fq '"@workspace/api-client-react"' package.json; then
            echo ""
            echo "ERROR:"
            echo "@workspace/api-client-react exists in package.json."
            exit 1
          fi

          echo "Workspace dependency check: OK"


      # ==========================================
      # 14. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Installing dependencies..."

          pnpm install \
            --no-frozen-lockfile

          echo ""
          echo "Dependencies installed successfully."


      # ==========================================
      # 15. Verify node_modules
      # ==========================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules: OK"


      # ==========================================
      # 16. Inspect Android project
      # ==========================================
      - name: Inspect Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Android project:"
          pwd

          echo ""
          echo "Gradle wrapper:"
          ls -lh gradlew

          echo ""
          echo "Gradle configuration:"
          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) \
            -print


      # ==========================================
      # 17. Android compatibility fixes
      # ==========================================
      - name: Apply Android compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Applying Kotlin compatibility fixes..."

          find android \
            -type f \
            -name "*.kt" \
            -print0 |
          while IFS= read -r -d '' file; do

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done

          echo "Kotlin compatibility fixes complete."


      # ==========================================
      # 18. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 19. Check Gradle
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # 20. Clean Android
      # ==========================================
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 21. Build Release APK
      # ==========================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING ABIR AI"
          echo "       VERSION: $ABIR_VERSION"
          echo "=========================================="
          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD FINISHED."


      # ==========================================
      # 22. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching for APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory missing."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==========================================
      # 23. Prepare final APK
      # ==========================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          FINAL_APK="release/Abir-AI-${ABIR_VERSION}-release.apk"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"


      # ==========================================
      # 24. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$FINAL_APK"

          FILE_SIZE="$(stat -c%s "$FINAL_APK")"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "ERROR: APK appears too small."
            exit 1
          fi

          echo "APK verification: OK"
          echo "Size: $FILE_SIZE bytes"


      # ==========================================
      # 25. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-${{ env.ABIR_VERSION }}-release
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 30


      # ==========================================
      # 26. Success
      # ==========================================
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "       ABIR AI BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "Version:"
          echo "$ABIR_VERSION"
          echo ""
          echo "APK:"
          ls -lh "$FINAL_APK"
          echo ""
          echo "Artifact:"
          echo "Abir-AI-${ABIR_VERSION}-release"
          echo ""
          echo "=========================================="
