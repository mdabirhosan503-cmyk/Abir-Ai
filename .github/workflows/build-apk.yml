
name: Build Abir AI 5.4.28

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Source ZIP Release Tag"
        required: true
        default: "v5.4.28-source"

permissions:
  contents: read

concurrency:
  group: abir-ai-5.4.28-build
  cancel-in-progress: true

jobs:
  build:
    name: Download Source and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_ASSET: AbirAI-5.4.28-BILINGUAL-BACKGROUND-WHISPER-FIXED.zip
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: --max-old-space-size=6144

    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Download ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ASSET" \
            --dir "$RUNNER_TEMP/abir-source"

          test -s "$RUNNER_TEMP/abir-source/$SOURCE_ASSET"

          echo "Source ZIP downloaded successfully."
          ls -lh "$RUNNER_TEMP/abir-source/"

      - name: Extract and locate project
        id: locate
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-extracted"

          unzip -q \
            "$RUNNER_TEMP/abir-source/$SOURCE_ASSET" \
            -d "$RUNNER_TEMP/abir-extracted"

          GRADLE_FILE=$(find "$RUNNER_TEMP/abir-extracted" \
            -type f -path '*/android/gradlew' -print -quit)

          test -n "$GRADLE_FILE"

          PROJECT_DIR=$(dirname "$(dirname "$GRADLE_FILE")")

          test -f "$PROJECT_DIR/package.json"
          test -f "$PROJECT_DIR/app.json"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          echo "Project located: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"

      - name: Prepare Whisper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f scripts/prepare-whisper.sh
          chmod +x scripts/prepare-whisper.sh

          bash scripts/prepare-whisper.sh \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/whisper.log"

      - name: Prepare Sherpa Bengali
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          test -f scripts/prepare-sherpa.sh
          chmod +x scripts/prepare-sherpa.sh

          bash scripts/prepare-sherpa.sh \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/sherpa.log"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Validate project
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          pnpm exec expo config --type public
          pnpm run typecheck --if-present

      - name: Configure Android
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          chmod +x android/gradlew

          echo "sdk.dir=$ANDROID_HOME" \
            > android/local.properties

      - name: Gradle preflight
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: |
          set -euo pipefail

          ./gradlew --version --no-daemon
          ./gradlew help --no-daemon

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}/android
        run: |
          set -euo pipefail

          ./gradlew clean --no-daemon

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/build.log"

      - name: Verify APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK=$(find android/app/build/outputs/apk/release \
            -type f -name "*.apk" -print -quit)

          test -n "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.28.apk"

          unzip -tq \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.28.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.28.apk" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Release-APK
          path: release/Abir-AI-5.4.28.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Build-Logs
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          
