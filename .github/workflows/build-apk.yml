name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      ZIP_NAME: "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION.zip"
      UNPACK_DIR: "${{ github.workspace }}/abir_extracted"

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      # 5. Find ZIP and extract
      - name: Extract Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          ZIP_PATH="$(find "$GITHUB_WORKSPACE" \
            -type f -name "$ZIP_NAME" \
            -not -path '*/abir_extracted/*' \
            -print -quit)"

          if [[ -z "$ZIP_PATH" ]]; then
            echo "ERROR: Abir AI ZIP not found!"
            find "$GITHUB_WORKSPACE" -type f -name "*.zip"
            exit 1
          fi

          echo "ZIP: $ZIP_PATH"

          rm -rf "$UNPACK_DIR"
          mkdir -p "$UNPACK_DIR"

          unzip -oq "$ZIP_PATH" -d "$UNPACK_DIR"

          echo "Extraction completed."

      # 6. Detect the correct project directory
      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_DIR=""
          BEST_SCORE=-1

          while IFS= read -r -d '' GRADLEW; do
            ANDROID_DIR="$(dirname "$GRADLEW")"
            CANDIDATE="$(dirname "$ANDROID_DIR")"

            if [[ ! -f "$CANDIDATE/package.json" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/app/build.gradle" ]]; then
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/settings.gradle" &&
                  ! -f "$ANDROID_DIR/settings.gradle.kts" ]]; then
              continue
            fi

            SCORE=0

            [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" ]] && SCORE=$((SCORE+3))
            [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]] && SCORE=$((SCORE+3))
            [[ -f "$CANDIDATE/modules/abir-app-launcher/android/build.gradle" ]] && SCORE=$((SCORE+4))
            [[ -f "$CANDIDATE/modules/abir-app-launcher/expo-module.config.json" ]] && SCORE=$((SCORE+2))

            VERSION="$(node -p "require('$CANDIDATE/package.json').version" 2>/dev/null || echo "")"

            [[ "$VERSION" == "5.4.24" ]] && SCORE=$((SCORE+5))

            echo "Candidate: $CANDIDATE"
            echo "Score: $SCORE"

            if (( SCORE > BEST_SCORE )); then
              BEST_SCORE=$SCORE
              BEST_DIR="$CANDIDATE"
            fi

          done < <(find "$UNPACK_DIR" -type f \
            -path '*/android/gradlew' -print0)

          if [[ -z "$BEST_DIR" ]]; then
            echo "ERROR: Android project not found!"

            find "$UNPACK_DIR" -maxdepth 5 \
              \( -name package.json -o -name gradlew \) -print

            exit 1
          fi

          echo "PROJECT_ROOT=$BEST_DIR" >> "$GITHUB_ENV"

          echo "Selected project: $BEST_DIR"

      # 7. Verify project
      - name: Verify project files and version
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          VERSION="$(node -p "require('./package.json').version")"

          echo "Abir AI version: $VERSION"

          if [[ "$VERSION" != "$ABIR_VERSION" ]]; then
            echo "ERROR: Wrong project version!"
            exit 1
          fi

          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/settings.gradle

          if ! grep -Eq "versionName[[:space:]]+['\"]${ABIR_VERSION}['\"]" android/app/build.gradle; then
            echo "ERROR: Android versionName mismatch"
            grep -n versionName android/app/build.gradle || true
            exit 1
          fi

          echo "Project verification successful."

      # 8. Install JavaScript dependencies
      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          pnpm install --no-frozen-lockfile

      # 9. Check Expo packages
      - name: Verify Expo and React Native
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Node: $(node --version)"
          echo "pnpm: $(pnpm --version)"

          node <<'NODE'
          const p = require('./package.json');

          for (const name of ['expo', 'react-native', 'expo-camera']) {
            const version =
              p.dependencies?.[name] ||
              p.devDependencies?.[name] ||
              'NOT DECLARED';

            console.log(`${name}: ${version}`);
          }
          NODE

          echo "Checking Expo CLI..."

          if pnpm exec expo --version; then
            echo "Expo CLI is available."
          else
            echo "WARNING: Expo CLI version check unavailable."
            echo "Continuing with native Android build."
          fi

      # 10. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 11. Install SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 12. Prepare Android
      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          mkdir -p android

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > android/local.properties

          chmod +x android/gradlew

          echo "Android SDK configured."

          if [[ -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "Gradle wrapper JAR found."
          else
            echo "ERROR: Gradle wrapper JAR missing!"
            exit 1
          fi

          if [[ -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            cat android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "ERROR: Gradle wrapper properties missing!"
            exit 1
          fi

          # Fix known Kotlin compatibility issue if present
          while IFS= read -r -d '' FILE; do
            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$FILE"
          done < <(
            grep -RIlZ --exclude-dir=node_modules \
              'ResolveInfoFlags.of(0)' \
              modules android 2>/dev/null || true
          )

      # 13. Gradle memory
      - name: Configure Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

      # 14. Gradle cache
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # 15. Check Gradle
      - name: Check Gradle configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew --version

      # 16. Build APK
      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      # 17. Find APK
      - name: Collect release APK
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail

          APK_DIR="$PROJECT_ROOT/android/app/build/outputs/apk/release"

          APK_PATH="$(find "$APK_DIR" \
            -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK_PATH" ]]; then
            echo "ERROR: APK was not generated!"
            find "$PROJECT_ROOT/android/app/build/outputs" \
              -type f -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK_PATH" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          test -s "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          ls -lh "$GITHUB_WORKSPACE/release/"

      # 18. Upload APK
      - name: Upload Abir AI APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Live-Vision-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      # 19. Upload error logs
      - name: Upload build error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Error-Logs
          path: |
            abir-build.log
            abir_extracted/**/android/build/reports/**
            abir_extracted/**/android/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 7
          
