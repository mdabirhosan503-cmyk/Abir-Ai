name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. pnpm 10
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          "$SDKMANAGER" --version

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo "Installing Android packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==========================================
      # 6. Find 4.6.1 ZIP
      # ==========================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.6.1-Full-Control-Voice-Fixed.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: 4.6.1 ZIP not found."
            echo ""
            echo "ZIP files in repository:"

            find . \
              -maxdepth 3 \
              -type f \
              -name "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "Found:"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # 7. Verify ZIP
      # ==========================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity: OK"


      # ==========================================
      # 8. Extract
      # ==========================================
      - name: Extract Abir AI
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Source extracted."


      # ==========================================
      # 9. Detect project directory
      # ==========================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          elif [ -f "extracted/src/package.json" ] &&
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          else

            ANDROID_DIR="$(find extracted \
              -type d \
              -name android \
              | head -n 1)"

            if [ -n "$ANDROID_DIR" ]; then

              CANDIDATE="$(dirname "$ANDROID_DIR")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi

            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: Abir AI project not found."

            echo ""
            echo "package.json files found:"

            find extracted \
              -name package.json \
              -type f \
              -print

            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: Android directory missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "================================"
          echo "Project:"
          echo "$PROJECT_DIR"
          echo "================================"


      # ==========================================
      # 10. Verify project
      # ==========================================
      - name: Verify project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "package.json: OK"
          echo "android/: OK"
          echo "gradlew: OK"


      # ==========================================
      # 11. Verify broken workspace dependency
      # ==========================================
      - name: Verify workspace dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking workspace dependencies..."

          if grep -Fq '"@workspace/api-client-react"' package.json; then
            echo "ERROR: @workspace/api-client-react still exists in package.json."
            exit 1
          fi

          if grep -R -Fq '"@workspace/api-client-react"' . \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            2>/dev/null; then

            echo "WARNING: workspace reference found outside package.json."
          else

            echo "No broken workspace dependency found."

          fi


      # ==========================================
      # 12. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Installing dependencies..."

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild

          echo ""
          echo "Dependencies installed successfully."


      # ==========================================
      # 13. Verify node_modules
      # ==========================================
      - name: Verify node_modules
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules: OK"


      # ==========================================
      # 14. TypeScript check
      # ==========================================
      - name: TypeScript check
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if pnpm exec tsc \
            -p tsconfig.json \
            --noEmit; then

            echo "TypeScript check: OK"

          else

            echo "ERROR: TypeScript check failed."
            exit 1

          fi


      # ==========================================
      # 15. Android compatibility fixes
      # ==========================================
      - name: Apply Android compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Applying safe Kotlin compatibility fixes..."

          find android \
            -name "*.kt" \
            -type f \
            -print0 |
          while IFS= read -r -d '' file; do

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done

          echo "Kotlin compatibility fixes complete."


      # ==========================================
      # 16. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 17. Check Gradle
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # 18. Clean
      # ==========================================
      - name: Clean Android build
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 19. Build Release APK
      # ==========================================
      - name: Build Abir AI 4.6.1 Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING ABIR AI 4.6.1"
          echo "=========================================="
          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD FINISHED"


      # ==========================================
      # 20. Find APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "Searching for APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory does not exist."
            exit 1
          fi

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==========================================
      # 21. Prepare final APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            release/Abir-AI-4.6.1-release.apk

          echo ""
          echo "Final APK:"
          ls -lh release/Abir-AI-4.6.1-release.apk


      # ==========================================
      # 22. Upload APK
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.6.1-release
          path: release/Abir-AI-4.6.1-release.apk
          if-no-files-found: error


      # ==========================================
      # 23. Success
      # ==========================================
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "      ABIR AI 4.6.1 BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.6.1-release.apk
          echo ""
          echo "Artifact:"
          echo "Abir-AI-4.6.1-release"
          echo ""
          echo "=========================================="
