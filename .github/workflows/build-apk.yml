name: Build Abir AI 5.4.28 Character Voice Upgrade

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: abir-ai-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Download latest Abir AI source ZIP
      - name: Download Abir AI Source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"

          gh release download v5.4.28-source \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "AbirAI-5.4.28-CHARACTER-VOICE-UPGRADE.zip" \
            --dir "$RUNNER_TEMP/abir-source"

          ZIP="$RUNNER_TEMP/abir-source/AbirAI-5.4.28-CHARACTER-VOICE-UPGRADE.zip"

          if [ ! -s "$ZIP" ]; then
            echo "ERROR: Abir AI source ZIP not found."
            exit 1
          fi

          echo "Source ZIP downloaded successfully."
          ls -lh "$ZIP"

      # 3. Extract source and locate Android project
      - name: Extract and Locate Project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/abir-extracted"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "$RUNNER_TEMP/abir-source/AbirAI-5.4.28-CHARACTER-VOICE-UPGRADE.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_ROOT=""

          while IFS= read -r -d '' FILE; do
            CANDIDATE="$(dirname "$FILE")"

            if [ -f "$CANDIDATE/android/gradlew" ] &&
               [ -f "$CANDIDATE/android/gradle/wrapper/gradle-wrapper.properties" ]; then

              if [ -z "$PROJECT_ROOT" ] ||
                 [ "${#CANDIDATE}" -lt "${#PROJECT_ROOT}" ]; then
                PROJECT_ROOT="$CANDIDATE"
              fi
            fi
          done < <(find "$EXTRACT_DIR" -type f -name package.json -print0)

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Android project not found."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Abir AI project found:"
          echo "$PROJECT_ROOT"

          cd "$PROJECT_ROOT"
          ls -la

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 5. Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 6. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      # 8. Verify project files
      - name: Verify Abir AI Project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          test -f package.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/build.gradle

          echo "All required project files found."

          node --version
          pnpm --version
          java -version

          if [ -f pnpm-lock.yaml ]; then
            echo "pnpm lockfile found."
          else
            echo "WARNING: pnpm-lock.yaml is missing."
            echo "Dependencies will be installed without frozen lockfile."
          fi

      # 9. Install JavaScript dependencies
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      # 10. Verify Expo configuration
      - name: Check Expo Configuration
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f app.json ] ||
             [ -f app.config.js ] ||
             [ -f app.config.ts ]; then

            pnpm exec expo config --type public
          else
            echo "Expo configuration not found. Skipping."
          fi

      # 11. TypeScript check
      - name: TypeScript Check
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            pnpm run typecheck
          elif [ -x node_modules/.bin/tsc ]; then
            pnpm exec tsc --noEmit
          else
            echo "WARNING: TypeScript checker not available."
            echo "Continuing to Android build."
          fi

      # 12. Prepare Sherpa ONNX
      - name: Prepare Sherpa ONNX
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          if [ -f scripts/prepare-sherpa.sh ]; then
            chmod +x scripts/prepare-sherpa.sh
            bash scripts/prepare-sherpa.sh
          else
            echo "Sherpa preparation script not found."
            echo "Using libraries already included in source."
          fi

      # 13. Check voice engine files
      - name: Check Voice Engine Files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          echo "Checking Sherpa native libraries..."

          for lib in libsherpa-onnx-jni.so libonnxruntime.so; do
            if find android -type f -name "$lib" -print -quit | grep -q .; then
              echo "FOUND: $lib"
            else
              echo "WARNING: $lib not found."
            fi
          done

          echo "Checking offline voice models..."

          for model in encoder.onnx decoder.onnx joiner.onnx tokens.txt; do
            if find . -type f -name "$model" -print -quit | grep -q .; then
              echo "FOUND: $model"
            else
              echo "WARNING: $model not found."
            fi
          done

      # 14. Build release APK
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"

          chmod +x gradlew

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 15. Find APK
      - name: Find and Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"

          APK_DIR="android/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: Release APK directory not found."
            exit 1
          fi

          APK="$(find "$APK_DIR" -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          echo "APK_PATH=$PROJECT_ROOT/$APK" >> "$GITHUB_ENV"

      # 16. Upload APK artifact
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.28-Character-Voice-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
