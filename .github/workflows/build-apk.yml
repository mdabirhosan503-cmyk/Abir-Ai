name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Project extracted successfully"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy
        run: |
          set -e
          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Check Android project
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          echo "Android project found"

      - name: Fix launcher version
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          BUILD_FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: Launcher build.gradle not found"
            exit 1
          fi

          echo "Launcher build.gradle found"

          if grep -q "versionName" "$BUILD_FILE"; then
            echo "versionName already exists"
          else
            sed -i '/namespace "expo.modules.abirapp"/a\
  defaultConfig {\
    versionName "1.0.0"\
  }' "$BUILD_FILE"

            echo "versionName added"
          fi

      - name: Make Gradle executable
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          chmod +x gradlew

      - name: Build APK
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK_DIR="extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory not found"
            exit 1
          fi

          find "$APK_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-debug-apk
          path: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
