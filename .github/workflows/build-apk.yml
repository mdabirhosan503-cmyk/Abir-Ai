name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Locate and extract project ZIP if needed
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "gradlew" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 4 -type f -name '*.zip' \
              ! -path '*/.git/*' -print -quit || true)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No gradlew or project ZIP found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/abir-project"
            unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/abir-project"

            WRAPPER="$(find "$RUNNER_TEMP/abir-project" \
              -type f -name gradlew -print -quit || true)"

            if [ -z "$WRAPPER" ]; then
              echo "::error::The ZIP does not contain gradlew."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$WRAPPER")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # 3. Install Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 5. Set up Android SDK without deprecated tools package
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Check project files
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f gradlew || {
            echo "::error::gradlew is missing."
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          }

          chmod +x gradlew

          if [ ! -f package.json ]; then
            echo "::error::package.json is missing."
            exit 1
          fi

          echo "Gradle wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo "Project build files:"
          find . -maxdepth 4 -type f \
            \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \
            -o -name 'build.gradle' \
            -o -name 'build.gradle.kts' \) -print

      # 7. Install JavaScript dependencies
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 8. Build release APK
      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

      # 9. Find generated APK
      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abir-apk"

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$RUNNER_TEMP/abir-apk/" \;

          if ! find "$RUNNER_TEMP/abir-apk" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::No release APK was generated."
            exit 1
          fi

          echo "APK files ready for upload:"
          ls -lh "$RUNNER_TEMP/abir-apk"

      # 10. Upload APK to GitHub Actions
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: ${{ runner.temp }}/abir-apk/*.apk
          if-no-files-found: error
          retention-days: 7
