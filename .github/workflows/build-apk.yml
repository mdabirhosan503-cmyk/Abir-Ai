name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AbirAI-*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: abir-ai-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.16 APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. FIND + EXTRACT ABIR AI 5.4.16 ZIP
      # ============================================================
      - name: Find and extract Abir AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Abir AI ZIP..."

          # Prefer the fixed 5.4.16 ZIP.
          ZIP_FILE=""

          if [ -f "$GITHUB_WORKSPACE/AbirAI-5.4.16-NATURAL-CONVERSATION-FIXED.zip" ]; then
            ZIP_FILE="$GITHUB_WORKSPACE/AbirAI-5.4.16-NATURAL-CONVERSATION-FIXED.zip"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name 'AbirAI-5.4.16*.zip' \
              -print | sort | tail -n 1)"
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Abir AI 5.4.16 ZIP file not found."
            echo ""
            echo "ZIP files found:"
            find "$GITHUB_WORKSPACE" \
              -maxdepth 3 \
              -type f \
              -name '*.zip' \
              -print || true
            exit 1
          fi

          echo "=============================================="
          echo "SELECTED ABIR AI ZIP"
          echo "=============================================="
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/extracted"
          mkdir -p "$GITHUB_WORKSPACE/extracted"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo ""
          echo "Extracted project structure:"
          find "$GITHUB_WORKSPACE/extracted" \
            -maxdepth 2 \
            -type f \
            \( -name "package.json" -o -name "gradlew" \) \
            -print || true

          # --------------------------------------------------------
          # Find project root.
          # Expected structure:
          #
          # extracted/
          #   package.json
          #   android/
          #     gradlew
          # --------------------------------------------------------

          PROJECT_DIR=""

          if [ -f "$GITHUB_WORKSPACE/extracted/package.json" ] && \
             [ -f "$GITHUB_WORKSPACE/extracted/android/gradlew" ]; then

            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"

          else

            GRADLEW="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "gradlew" \
              ! -path "*/node_modules/*" \
              -print | head -n 1)"

            if [ -n "${GRADLEW:-}" ]; then
              CANDIDATE="$(dirname "$(dirname "$GRADLEW")")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi
            fi

          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "::error::Could not locate Abir AI project root."

            echo ""
            echo "package.json files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "package.json" \
              -print || true

            echo ""
            echo "gradlew files:"
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              -name "gradlew" \
              -print || true

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json not found."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::android/gradlew not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=============================================="
          echo "ABIR AI PROJECT FOUND"
          echo "=============================================="
          echo "PROJECT_DIR=$PROJECT_DIR"

      # ============================================================
      # 3. NODE.JS
      # ============================================================
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      # ============================================================
      # 4. PNPM
      # ============================================================
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      # ============================================================
      # 5. JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. ANDROID SDK
      #
      # Do NOT use android-actions/setup-android.
      # This avoids the previous obsolete "tools" package error.
      # ============================================================
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found: $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          if [ -z "${SDKMANAGER:-}" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo "SDK Manager:"
          echo "$SDKMANAGER"

      # ============================================================
      # 7. ACCEPT LICENSES
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      # ============================================================
      # 8. INSTALL REQUIRED SDK
      # ============================================================
      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Installed Android SDK packages:"
          "$SDKMANAGER" --list_installed | head -100 || true

      # ============================================================
      # 9. INSTALL JAVASCRIPT DEPENDENCIES
      # ============================================================
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing pnpm dependencies..."

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed successfully."

      # ============================================================
      # 10. VERIFY PROJECT VERSION
      # ============================================================
      - name: Verify Abir AI 5.4.16
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking package.json..."

          node - <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          console.log("package.json version:", pkg.version);

          if (pkg.version !== "5.4.16") {
            console.error(
              `Expected package.json version 5.4.16 but found ${pkg.version}`
            );
            process.exit(1);
          }
          NODE

          echo ""
          echo "Checking Android app version..."

          APP_GRADLE="android/app/build.gradle"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "::error::android/app/build.gradle not found."
            exit 1
          fi

          # Make sure the APK itself reports version 5.4.16.
          sed -i 's/versionName "[^"]*"/versionName "5.4.16"/' "$APP_GRADLE"

          echo ""
          grep -n "versionCode\|versionName" "$APP_GRADLE" || true

          echo ""
          echo "Abir AI version verified as 5.4.16."

      # ============================================================
      # 11. PREPARE GRADLE
      # ============================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK_PATH" ]; then
            echo "::error::Android SDK path is empty."
            exit 1
          fi

          printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties

          echo "local.properties:"
          cat local.properties

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 12. VERIFY IMPORTANT ABIR AI FILES
      # ============================================================
      - name: Verify Abir AI modules
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking important Abir AI files..."

          REQUIRED_FILES=(
            "app/index.tsx"
            "assistant/offlineBrain.ts"
            "assistant/conversationEngine.ts"
            "assistant/voiceInput.ts"
            "modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/CallAssistantService.kt"
            "modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/CallAssistantPrefs.kt"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file not found: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          echo ""
          echo "All required Abir AI files are present."

      # ============================================================
      # 13. CHECK TIME RESPONSE FIX
      # ============================================================
      - name: Verify time response cleanup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="assistant/offlineBrain.ts"

          if [ ! -f "$FILE" ]; then
            echo "::error::offlineBrain.ts not found."
            exit 1
          fi

          echo "Checking offline time-response logic..."

          grep -n -i \
            -E "time|clock|সময়|ঘড়ি" \
            "$FILE" | head -80 || true

          echo ""
          echo "Time response check completed."

      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "BUILDING ABIR AI 5.4.16 RELEASE APK"
          echo "=============================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      # ============================================================
      # 15. COLLECT APK
      # ============================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/release"

          APK="$(find "$PROJECT_DIR/android" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            ! -name '*-unsigned.apk' \
            -print | sort | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "::error::No release APK was generated."

            echo ""
            echo "Searching all APK files:"
            find "$PROJECT_DIR/android" \
              -type f \
              -name '*.apk' \
              -print || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

          echo ""
          echo "Final APK:"
          ls -lh "$GITHUB_WORKSPACE/release/"

      # ============================================================
      # 16. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK does not exist."
            exit 1
          fi

          SIZE="$(stat -c%s "$APK")"

          echo "APK:"
          echo "$APK"

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -le 100000 ]; then
            echo "::error::APK is suspiciously small."
            exit 1
          fi

          if ! file "$APK" | grep -qi "zip\|android"; then
            echo "::error::Generated file does not look like an APK."
            file "$APK" || true
            exit 1
          fi

          echo ""
          echo "APK verification passed."

      # ============================================================
      # 17. UPLOAD APK
      # ============================================================
      - name: Upload Abir AI 5.4.16 APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Release-APK
          path: release/Abir-AI-5.4.16-release.apk
          if-no-files-found: error
          retention-days: 14

      # ============================================================
      # 18. SUCCESS
      # ============================================================
      - name: Build success
        if: success()
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "       ABIR AI 5.4.16 BUILD SUCCESS"
          echo "=============================================="
          echo ""
          echo "APK: Abir-AI-5.4.16-release.apk"
          echo "Artifact: Abir-AI-5.4.16-Release-APK"
          echo ""
