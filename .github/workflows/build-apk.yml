name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f -name "package.json" -o -name "settings.gradle" | head -50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Find project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -type f -name "package.json" \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "package.json" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find package.json"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "Android Gradle project not found."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Android project found."
          ls -la android

      - name: Fix launcher versionName
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "Launcher build.gradle not found:"
            echo "$FILE"
            exit 1
          fi

          if ! grep -q "versionName" "$FILE"; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("modules/abir-app-launcher/android/build.gradle")
          text = p.read_text()

          marker = "defaultConfig {"

          if marker in text:
              text = text.replace(
                  marker,
                  marker + '\n        versionName "1.0.0"',
                  1
              )
          else:
              text = text.replace(
                  "android {",
                  'android {\n    defaultConfig {\n        versionName "1.0.0"\n    }',
                  1
              )

          p.write_text(text)
          PY
          fi

          echo "Launcher versionName check complete."

      - name: Fix launcher Kotlin Contacts code
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          KOTLIN_FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ ! -f "$KOTLIN_FILE" ]; then
            echo "Kotlin file not found:"
            echo "$KOTLIN_FILE"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          p = Path("modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt")
          text = p.read_text()

          text = text.replace(
              '  val phone = ContactsContract.CommonDataKinds.Phone\n',
              ''
          )

          replacements = {
              'phone.CONTACT_ID': 'ContactsContract.CommonDataKinds.Phone.CONTACT_ID',
              'phone.DISPLAY_NAME': 'ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME',
              'phone.NUMBER': 'ContactsContract.CommonDataKinds.Phone.NUMBER',
              'phone.TYPE': 'ContactsContract.CommonDataKinds.Phone.TYPE',
              'phone.LABEL': 'ContactsContract.CommonDataKinds.Phone.LABEL',
              'phone.CONTENT_URI': 'ContactsContract.CommonDataKinds.Phone.CONTENT_URI',
              'phone.getTypeLabel': 'ContactsContract.CommonDataKinds.Phone.getTypeLabel',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          p.write_text(text)
          PY

          echo "Contacts Kotlin fix complete."

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Searching for release APK..."

          find android -type f -name "*.apk" -print

          APK=$(find android -type f -name "*release*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "Release APK not found."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
