name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Abir AI v2 ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for the corrected v2 ZIP..."

          ZIP_FILE=""

          # Prefer the corrected v2 ZIP ONLY
          for f in \
            "AbirAI-5.4.16-NATURAL-CONVERSATION-FIXED-v2.zip" \
            "./AbirAI-5.4.16-NATURAL-CONVERSATION-FIXED-v2.zip" \
            "AbirAI-5.4.16-NATURAL-CONVERSATION-FIXED-v2.ZIP"
          do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Corrected v2 ZIP was not found."
            echo ""
            echo "Files available in repository:"
            find . -maxdepth 3 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          # Extra safety check:
          # The old broken ZIP must never be selected.
          if [[ "$ZIP_FILE" != *"FIXED-v2"* ]]; then
            echo "ERROR: Wrong ZIP selected."
            exit 1
          fi

          cp "$ZIP_FILE" abir-ai-source.zip

      - name: Extract corrected project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q abir-ai-source.zip -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -name gradlew -o -name package.json | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted" -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify corrected AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$GITHUB_WORKSPACE/extracted/modules/abir-app-launcher/android/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: abir-app-launcher AndroidManifest.xml not found."
            exit 1
          fi

          echo "===== AndroidManifest.xml ====="
          cat "$MANIFEST"
          echo "==============================="

          # The CallAssistantService MUST be inside <application>.
          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit("ERROR: <application> element is missing")

          services_in_application = application.findall("service")
          services_in_manifest = root.findall("service")

          print("Services inside <application>:", len(services_in_application))
          print("Services directly inside <manifest>:", len(services_in_manifest))

          if services_in_manifest:
              raise SystemExit(
                  "ERROR: Found <service> directly under <manifest>. "
                  "Manifest is still broken."
              )

          names = [
              s.attrib.get("{http://schemas.android.com/apk/res/android}name", "")
              for s in services_in_application
          ]

          print("Service names:", names)

          if ".CallAssistantService" not in names:
              raise SystemExit(
                  "ERROR: .CallAssistantService is missing from <application>"
              )

          print("Manifest structure is VALID.")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          pnpm install --no-frozen-lockfile

      - name: Fix ResolveInfoFlags compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          find . -type f \( -name "*.kt" -o -name "*.java" \) -print0 |
          xargs -0 -r sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g'

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" |
            head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" "release/Abir-AI-5.4.16-release.apk"

          echo "APK created:"
          ls -lh release/Abir-AI-5.4.16-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Release-APK
          path: release/Abir-AI-5.4.16-release.apk
          if-no-files-found: error
