name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Find and extract Abir AI ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            find . -maxdepth 3 -name "*.zip"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/package.json" ] &&
               [ -f "$dir/android/gradlew" ] &&
               [ -f "$dir/android/settings.gradle" -o -f "$dir/android/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -name gradlew -type f)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found in ZIP"
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Validate project version
        shell: bash
        run: |
          set -e
          node -e '
            const p = require("./" + process.env.PROJECT_DIR + "/package.json");
            console.log("Package version:", p.version);
            if (p.version !== "5.4.24") {
              throw new Error("Expected package version 5.4.24");
            }
          '

          grep -n 'versionName' "$PROJECT_DIR/android/app/build.gradle" || true
          grep -q '5.4.24' "$PROJECT_DIR/android/app/build.gradle"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: pnpm install --no-frozen-lockfile

      - name: Verify required packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          node -e "
            const p = require('./package.json');
            for (const name of ['expo', 'react-native', 'expo-camera']) {
              console.log(name + ':', p.dependencies?.[name] || p.devDependencies?.[name] || 'NOT FOUND');
            }
          "

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f android/app/src/main/java/com/abir/launcher/MainActivity.java ]; then
            sed -i 's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              android/app/src/main/java/com/abir/launcher/MainActivity.java
          fi

          printf "sdk.dir=%s\n" "$ANDROID_HOME" > android/local.properties

          chmod +x android/gradlew

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        env:
          GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false"
        run: |
          ./gradlew --version
          ./gradlew clean
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -e
          mkdir -p release
          find "$PROJECT_DIR/android/app/build/outputs/apk/release" \
            -name "*.apk" -type f -exec cp {} release/Abir-AI-5.4.24-release.apk \;

          test -f release/Abir-AI-5.4.24-release.apk
          ls -lh release/

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Live-Vision-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-Build-Diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/android/build/reports/
            ${{ env.PROJECT_DIR }}/android/app/build/reports/
          if-no-files-found: ignore
