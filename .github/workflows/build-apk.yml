name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            **/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools

      - name: Locate project files
        shell: bash
        run: |
          set -euo pipefail

          WORK="$GITHUB_WORKSPACE"
          EXTRACT="$RUNNER_TEMP/abir-project"
          mkdir -p "$EXTRACT"

          WRAPPER=""

          # 1. Normal project structure
          if [ -f "$WORK/android/gradlew" ]; then
            WRAPPER="$WORK/android/gradlew"

          elif [ -f "$WORK/gradlew" ]; then
            WRAPPER="$WORK/gradlew"

          else
            # 2. Find project ZIP
            mapfile -t ZIP_FILES < <(
              find "$WORK" \
                -maxdepth 5 \
                -type f \
                -name '*.zip' \
                ! -path '*/.git/*' \
                ! -path '*/node_modules/*' \
                -print
            )

            if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
              echo "::error::No project ZIP and no Gradle wrapper found."
              exit 1
            fi

            if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
              echo "::warning::Multiple ZIP files found:"
              printf ' - %s\n' "${ZIP_FILES[@]}"
            fi

            ZIP_FILE="${ZIP_FILES[0]}"

            echo "Extracting project ZIP:"
            echo "$ZIP_FILE"

            unzip -oq "$ZIP_FILE" -d "$EXTRACT"

            WRAPPER="$(
              find "$EXTRACT" \
                -type f \
                -name gradlew \
                ! -path '*/node_modules/*' \
                -print -quit
            )"
          fi

          if [ -z "$WRAPPER" ] || [ ! -f "$WRAPPER" ]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          ANDROID_DIR="$(cd "$(dirname "$WRAPPER")" && pwd)"

          CURRENT="$ANDROID_DIR"
          PROJECT_ROOT=""

          while [ "$CURRENT" != "/" ]; do
            if [ -f "$CURRENT/package.json" ]; then
              PROJECT_ROOT="$CURRENT"
              break
            fi

            CURRENT="$(dirname "$CURRENT")"
          done

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::package.json not found above Android directory."
            echo "Ensure the ZIP contains the complete project."
            exit 1
          fi

          if [ ! -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::error::Gradle wrapper properties are missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo
          echo "Android directory:"
          echo "$ANDROID_DIR"
          echo "================================"

          ls -lh "$PROJECT_ROOT/package.json"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Verify project and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_ROOT"

          test -f package.json
          test -d node_modules

          echo "Node version:"
          node --version

          echo
          echo "NPM version:"
          npm --version

          echo
          echo "Java version:"
          java -version

          echo
          echo "Android SDK:"
          echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not set}}"

          cd "$ANDROID_DIR"

          chmod +x gradlew

          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -n "$SDK_PATH" ] && [ ! -f local.properties ]; then
            printf 'sdk.dir=%s\n' "$SDK_PATH" > local.properties
          fi

          echo
          echo "Gradle version:"
          ./gradlew --version

          echo
          echo "Gradle configuration files:"
          find . -maxdepth 3 -type f \
            \( \
              -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'build.gradle' \
              -o -name 'build.gradle.kts' \
            \) \
            -print

      - name: Build release APK
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail

          cd "$ANDROID_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --build-cache \
            assembleRelease

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/abir-apk"
          mkdir -p "$OUTPUT"

          find "$ANDROID_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$OUTPUT/" \;

          if ! find "$OUTPUT" \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | grep -q .; then

            echo "::error::Release APK was not generated."
            exit 1
          fi

          echo "Generated APK:"
          ls -lh "$OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-release-APK
          path: ${{ runner.temp }}/abir-apk/*.apk
          if-no-files-found: error
          retention-days: 7
