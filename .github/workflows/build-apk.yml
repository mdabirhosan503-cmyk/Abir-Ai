name: Build Abir AI 5.4.24 Dual Offline Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      SOURCE_ZIP: AbirAI-5.4.24-DAILY-OFFLINE-TOOLS-UPGRADE.zip
      RELEASE_TAG: abirai-5.4.24-source
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: 27.1.12297006

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      # 5. Android SDK
      - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
      packages: 'platform-tools'
        

      # 6. Install Android packages
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses || true

      # 7. Download source ZIP from Release
      - name: Download source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p abir_build

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir abir_build

          test -s "abir_build/$SOURCE_ZIP"

          echo "Source ZIP downloaded:"
          ls -lh "abir_build/$SOURCE_ZIP"

          sha256sum "abir_build/$SOURCE_ZIP"

      # 8. Extract source
      - name: Extract Abir AI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p abir_extracted

          unzip -q "abir_build/$SOURCE_ZIP" \
            -d abir_extracted

          echo "ZIP extraction completed."

      # 9. Locate correct project root
      - name: Locate Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          for ROOT in \
            "$GITHUB_WORKSPACE/abir_extracted" \
            "$GITHUB_WORKSPACE/abir_extracted/abir_work"
          do
            if [ -f "$ROOT/package.json" ] && \
               [ -f "$ROOT/android/gradlew" ] && \
               [ -f "$ROOT/scripts/prepare-whisper.sh" ] && \
               [ -f "$ROOT/scripts/prepare-sherpa.sh" ]; then
              FOUND="$ROOT"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "::error::Abir AI project root not found."

            find abir_extracted -maxdepth 4 -type f | head -200

            exit 1
          fi

          echo "PROJECT_PATH=$FOUND" >> "$GITHUB_ENV"

          echo "Project found: $FOUND"

      # 10. Verify project
      - name: Verify project files
        working-directory: ${{ github.workspace }}/abir_extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_PATH/package.json"
          test -f "$PROJECT_PATH/android/gradlew"
          test -f "$PROJECT_PATH/scripts/prepare-whisper.sh"
          test -f "$PROJECT_PATH/scripts/prepare-sherpa.sh"

          echo "Abir AI project verified."

          node --version
          pnpm --version
          java -version

      # 11. Install dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed."

      # 12. Check Expo
      - name: Check Expo configuration
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo config --type public

      # 13. Verify Bengali model
      - name: Verify all seven Bengali model files
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="modules/abir-app-launcher/android/src/main/assets/models/sherpa-bn"

          for FILE in \
            encoder.onnx \
            decoder.onnx \
            joiner.onnx \
            tokens.txt \
            bpe.model \
            unigram_500.vocab.txt \
            opt.py
          do
            if [ ! -s "$MODEL_DIR/$FILE" ]; then
              echo "::error::Missing model file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

      # 14. Prepare Whisper multilingual
      - name: Prepare Whisper Bengali English
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-whisper.sh

          ./scripts/prepare-whisper.sh

          echo "Whisper multilingual prepared."

      # 15. Prepare Sherpa Bengali
      - name: Prepare Sherpa Bengali
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-sherpa.sh

          ./scripts/prepare-sherpa.sh

          echo "Sherpa Bengali prepared."

      # 16. Verify native Whisper sources
      - name: Verify Whisper native sources
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -s modules/abir-app-launcher/android/src/main/cpp/whisper.cpp/CMakeLists.txt

          test -s modules/abir-app-launcher/android/src/main/cpp/whisper_native/CMakeLists.txt

          test -s modules/abir-app-launcher/android/src/main/assets/models/ggml-tiny-q5_1.bin

          echo "Whisper native sources and model verified."

      # 17. Verify Sherpa runtime
      - name: Verify Sherpa runtime
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          JNI_DIR="modules/abir-app-launcher/android/src/main/jniLibs"

          find "$JNI_DIR" -type f -name 'libsherpa-onnx-jni.so' \
            -print -quit | grep -q .

          find "$JNI_DIR" -type f -name 'libonnxruntime.so' \
            -print -quit | grep -q .

          echo "Sherpa runtime verified."

      # 18. Check Android project
      - name: Check Android project
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

      # 19. Build Release APK
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 20. Find APK
      - name: Locate APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          mkdir -p release-apk

          APK_PATH="$(find "$APK_DIR" -type f \
            -name '*release*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."
            find "$APK_DIR" -type f || true
            exit 1
          fi

          cp "$APK_PATH" \
            release-apk/AbirAI-5.4.24-release.apk

          ls -lh release-apk/

      # 21. Upload APK
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release-apk/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 22. Upload diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Logs
          path: |
            abir_build/
            abir_extracted/
          if-no-files-found: ignore
          retention-days: 7
