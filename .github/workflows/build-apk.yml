
name: Build Abir AI 5.4.24 Dual Offline Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      SOURCE_ZIP: AbirAI-5.4.24-DAILY-OFFLINE-TOOLS-UPGRADE.zip
      RELEASE_TAG: abirai-5.4.24-source
      ANDROID_API: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK: "27.1.12297006"

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      # 5. Android SDK
      # Do not install deprecated SDK package "tools".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 6. Install Android SDK, NDK and CMake
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;3.22.1"

          echo "Android SDK packages installed."

          sdkmanager --list_installed

      # 7. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          command -v adb

          sdkmanager --version
          adb version

      # 8. Download source ZIP from GitHub Release
      - name: Download Abir AI source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p abir_build

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir abir_build

          test -s "abir_build/$SOURCE_ZIP"

          echo "Source ZIP downloaded successfully."

          ls -lh "abir_build/$SOURCE_ZIP"

          sha256sum "abir_build/$SOURCE_ZIP"

      # 9. Extract source ZIP
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p abir_extracted

          unzip -q "abir_build/$SOURCE_ZIP" \
            -d abir_extracted

          echo "ZIP extraction completed."

          find abir_extracted \
            -maxdepth 3 \
            -type f \
            -name package.json

      # 10. Locate project root
      - name: Locate Abir AI project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=""

          while IFS= read -r -d '' PACKAGE_FILE; do

            ROOT="$(dirname "$PACKAGE_FILE")"

            if [ -f "$ROOT/android/gradlew" ] && \
               [ -f "$ROOT/scripts/prepare-whisper.sh" ] && \
               [ -f "$ROOT/scripts/prepare-sherpa.sh" ]; then

              FOUND="$ROOT"
              break

            fi

          done < <(
            find "$GITHUB_WORKSPACE/abir_extracted" \
              -type f \
              -name package.json \
              -print0
          )

          if [ -z "$FOUND" ]; then
            echo "::error::Abir AI project root not found."

            find abir_extracted \
              -maxdepth 5 \
              -type f | head -200

            exit 1
          fi

          echo "PROJECT_PATH=$FOUND" >> "$GITHUB_ENV"

          echo "Abir AI project found: $FOUND"

      # 11. Verify project files
      - name: Verify project files
        working-directory: ${{ github.workspace }}/abir_extracted
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_PATH/package.json"
          test -f "$PROJECT_PATH/pnpm-lock.yaml"
          test -f "$PROJECT_PATH/android/gradlew"

          test -f "$PROJECT_PATH/scripts/prepare-whisper.sh"
          test -f "$PROJECT_PATH/scripts/prepare-sherpa.sh"

          echo "All required project files verified."

          node --version
          pnpm --version
          java -version

      # 12. Install dependencies
      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm install --no-frozen-lockfile

          echo "Dependencies installed successfully."

      # 13. Check Expo
      - name: Verify Expo configuration
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo config --type public

          echo "Expo configuration verified."

      # 14. Verify all seven Bengali model files
      - name: Verify seven Bengali model files
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          MODEL_DIR="modules/abir-app-launcher/android/src/main/assets/models/sherpa-bn"

          for FILE in \
            encoder.onnx \
            decoder.onnx \
            joiner.onnx \
            tokens.txt \
            bpe.model \
            unigram_500.vocab.txt \
            opt.py
          do

            if [ ! -s "$MODEL_DIR/$FILE" ]; then
              echo "::error::Missing Bengali model file: $FILE"
              exit 1
            fi

            echo "VERIFIED: $FILE"

          done

          echo "All seven Bengali model files verified."

      # 15. Prepare Whisper multilingual
      - name: Prepare Whisper Bengali and English
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-whisper.sh

          ./scripts/prepare-whisper.sh

          echo "Whisper preparation completed."

      # 16. Prepare Sherpa Bengali
      - name: Prepare Sherpa Bengali
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          chmod +x scripts/prepare-sherpa.sh

          ./scripts/prepare-sherpa.sh

          echo "Sherpa preparation completed."

      # 17. Verify Whisper native sources and model
      - name: Verify Whisper native sources
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          test -s modules/abir-app-launcher/android/src/main/cpp/whisper.cpp/CMakeLists.txt

          test -s modules/abir-app-launcher/android/src/main/cpp/whisper_native/CMakeLists.txt

          test -s modules/abir-app-launcher/android/src/main/assets/models/ggml-tiny-q5_1.bin

          echo "Whisper native sources and model verified."

      # 18. Verify Sherpa native runtime
      - name: Verify Sherpa runtime
        working-directory: ${{ env.PROJECT_PATH }}
        shell: bash
        run: |
          set -euo pipefail

          JNI_DIR="modules/abir-app-launcher/android/src/main/jniLibs"

          if [ ! -d "$JNI_DIR" ]; then
            echo "::error::Sherpa JNI directory missing."
            exit 1
          fi

          find "$JNI_DIR" \
            -type f \
            -name 'libsherpa-onnx-jni.so' \
            -print -quit | grep -q .

          find "$JNI_DIR" \
            -type f \
            -name 'libonnxruntime.so' \
            -print -quit | grep -q .

          echo "Sherpa native runtime verified."

      # 19. Verify Android Gradle
      - name: Verify Android Gradle
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          ./gradlew --version

          echo "Gradle verification completed."

      # 20. Build Release APK
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_PATH }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

          echo "Release build completed."

      # 21. Locate and verify APK
      - name: Locate Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          mkdir -p release-apk

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory not found."
            exit 1
          fi

          APK_PATH="$(find "$APK_DIR" \
            -type f \
            -name '*release*.apk' \
            | sort | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK not found."

            find "$APK_DIR" -type f || true

            exit 1
          fi

          test -s "$APK_PATH"

          cp "$APK_PATH" \
            release-apk/AbirAI-5.4.24-release.apk

          echo "APK successfully located."

          ls -lh release-apk/

          sha256sum release-apk/AbirAI-5.4.24-release.apk

      # 22. Upload APK
      - name: Upload Abir AI Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release-apk/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 23. Upload build log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Logs
          path: abir-build.log
          if-no-files-found: ignore
          retention-days: 7

      # 24. Final status
      - name: Build completion status
        if: success()
        shell: bash
        run: |
          echo "===================================="
          echo "ABIR AI 5.4.24 BUILD SUCCESSFUL"
          echo "===================================="
          echo "Dual Offline Voice build completed."
