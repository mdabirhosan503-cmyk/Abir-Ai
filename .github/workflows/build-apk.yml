name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 3. Setup Node.js 20
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # =========================================================
      # 4. Setup pnpm
      # =========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # =========================================================
      # 5. Check build tools
      # =========================================================
      - name: Check build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD TOOLS"
          echo "=========================================="

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

          echo "=========================================="


      # =========================================================
      # 6. Setup Android SDK
      # =========================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then

            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          elif command -v sdkmanager >/dev/null 2>&1; then

            SDKMANAGER="$(command -v sdkmanager)"

          else

            echo ""
            echo "ERROR: sdkmanager not found."
            echo ""
            exit 1

          fi

          echo ""
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "Android SDK Manager version:"
          "$SDKMANAGER" --version

          echo ""
          echo "Accepting Android licenses..."

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          echo ""
          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "ANDROID SDK READY"
          echo "=========================================="


      # =========================================================
      # 7. Find Abir AI ZIP
      # =========================================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR ABIR AI ZIP"
          echo "=========================================="

          ZIP_FILE=""

          # First look for AbirAI ZIP files.
          while IFS= read -r file; do
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$file"
            else
              CURRENT_TIME="$(stat -c %Y "$file")"
              SELECTED_TIME="$(stat -c %Y "$ZIP_FILE")"

              if [ "$CURRENT_TIME" -gt "$SELECTED_TIME" ]; then
                ZIP_FILE="$file"
              fi
            fi
          done < <(
            find . \
              -type f \
              -name "AbirAI-*.zip" \
              -not -path "./.git/*" \
              -print
          )

          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: Abir AI ZIP was not found."
            echo ""

            echo "Available ZIP files:"
            find . \
              -type f \
              -name "*.zip" \
              -not -path "./.git/*" \
              -print || true

            echo ""
            echo "Repository files:"
            find . \
              -maxdepth 3 \
              -type f \
              -not -path "./.git/*" \
              -print \
              | head -200

            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$ZIP_FILE"

          echo ""
          echo "ZIP size:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================================================
      # 8. Verify ZIP integrity
      # =========================================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -e

          echo "Checking ZIP integrity..."

          unzip -tq "$ZIP_FILE"

          echo ""
          echo "ZIP integrity: OK"


      # =========================================================
      # 9. Extract source
      # =========================================================
      - name: Extract Abir AI source
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "Source extraction complete."

          echo ""
          echo "Extracted files:"
          find extracted \
            -maxdepth 3 \
            -type f \
            | head -200


      # =========================================================
      # 10. Detect Android project
      # =========================================================
      - name: Detect Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          echo "=========================================="
          echo "DETECTING ANDROID PROJECT"
          echo "=========================================="


          # -------------------------------------------------------
          # Layout 1:
          # extracted/package.json
          # extracted/android
          # -------------------------------------------------------
          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ] &&
             [ -f "extracted/android/gradlew" ]; then

            PROJECT_DIR="extracted"

          fi


          # -------------------------------------------------------
          # Layout 2:
          # extracted/src/package.json
          # extracted/src/android
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ] &&
             [ -f "extracted/src/package.json" ] &&
             [ -d "extracted/src/android" ] &&
             [ -f "extracted/src/android/gradlew" ]; then

            PROJECT_DIR="extracted/src"

          fi


          # -------------------------------------------------------
          # Layout 3:
          # Search automatically
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            while IFS= read -r android_dir; do

              CANDIDATE="$(dirname "$android_dir")"

              if [ -f "$CANDIDATE/package.json" ] &&
                 [ -f "$CANDIDATE/android/gradlew" ]; then

                PROJECT_DIR="$CANDIDATE"
                break

              fi

            done < <(
              find extracted \
                -type d \
                -name android \
                -print
            )

          fi


          # -------------------------------------------------------
          # Validate
          # -------------------------------------------------------
          if [ -z "$PROJECT_DIR" ]; then

            echo ""
            echo "ERROR: Abir AI Android project could not be detected."
            echo ""

            echo "package.json files:"
            find extracted \
              -type f \
              -name package.json \
              -print || true

            echo ""
            echo "Android directories:"
            find extracted \
              -type d \
              -name android \
              -print || true

            exit 1

          fi


          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi


          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi


          if [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "ERROR: android/gradlew missing."
            exit 1
          fi


          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


          echo ""
          echo "=========================================="
          echo "ABIR AI PROJECT FOUND"
          echo "=========================================="
          echo "$PROJECT_DIR"


      # =========================================================
      # 11. Read project version
      # =========================================================
      - name: Read Abir AI version
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          VERSION="$(
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              process.stdout.write(String(pkg.version || 'unknown'));
            "
          )"

          if [ -z "$VERSION" ]; then
            VERSION="unknown"
          fi

          echo "ABIR_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "ABIR AI VERSION"
          echo "=========================================="
          echo "$VERSION"


      # =========================================================
      # 12. Verify project files
      # =========================================================
      - name: Verify project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking project..."

          test -f package.json
          test -d android
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"
          echo "Gradle wrapper: OK"


      # =========================================================
      # 13. Check broken workspace dependency
      # =========================================================
      - name: Check workspace dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking package.json dependencies..."

          if grep -Fq '"@workspace/api-client-react"' package.json; then

            echo ""
            echo "ERROR:"
            echo "@workspace/api-client-react was found in package.json."
            echo ""
            exit 1

          fi

          echo ""
          echo "Workspace dependency check: OK"


      # =========================================================
      # 14. Install pnpm dependencies
      # =========================================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLING DEPENDENCIES"
          echo "=========================================="

          if [ -f "pnpm-lock.yaml" ]; then

            echo "pnpm-lock.yaml found."

            pnpm install \
              --no-frozen-lockfile

          else

            echo "No pnpm-lock.yaml found."

            pnpm install \
              --no-frozen-lockfile

          fi

          echo ""
          echo "Dependencies installed successfully."


      # =========================================================
      # 15. Verify node_modules
      # =========================================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -d node_modules

          echo "node_modules: OK"


      # =========================================================
      # 16. Inspect Android project
      # =========================================================
      - name: Inspect Android project
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID PROJECT"
          echo "=========================================="

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Gradle wrapper:"
          ls -lh gradlew

          echo ""
          echo "Gradle configuration files:"

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "gradle-wrapper.properties" \
            \) \
            -print


      # =========================================================
      # 17. Apply Kotlin compatibility fixes
      # =========================================================
      - name: Apply Android compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Applying safe Kotlin compatibility fixes..."

          FOUND_KOTLIN=0

          while IFS= read -r -d '' file; do

            FOUND_KOTLIN=1

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$file"

          done < <(
            find android \
              -type f \
              -name "*.kt" \
              -print0
          )

          if [ "$FOUND_KOTLIN" -eq 1 ]; then
            echo "Kotlin source files inspected."
          else
            echo "No Kotlin source files found."
          fi

          echo "Compatibility fixes complete."


      # =========================================================
      # 18. Prepare Gradle
      # =========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          echo "Gradle wrapper is executable."


      # =========================================================
      # 19. Check Gradle
      # =========================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GRADLE VERSION"
          echo "=========================================="

          ./gradlew --version


      # =========================================================
      # 20. Gradle dependency/cache warmup
      # =========================================================
      - name: Prepare Gradle dependencies
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Preparing Gradle..."

          ./gradlew \
            help \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Gradle preparation complete."


      # =========================================================
      # 21. Clean Android project
      # =========================================================
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "Cleaning Android project..."

          ./gradlew \
            clean \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Clean complete."


      # =========================================================
      # 22. Build Release APK
      # =========================================================
      - name: Build Abir AI Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "       BUILDING ABIR AI"
          echo "=========================================="

          echo ""
          echo "Version:"
          echo "$ABIR_VERSION"

          echo ""

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="


      # =========================================================
      # 23. Find APK
      # =========================================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          if [ ! -d "$APK_DIR" ]; then

            echo ""
            echo "ERROR: APK output directory does not exist."
            echo ""
            echo "Available build outputs:"

            find "${PROJECT_DIR}/android/app/build" \
              -maxdepth 6 \
              -type f \
              -print 2>/dev/null || true

            exit 1

          fi


          echo ""
          echo "APK files:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print


          APK="$(
            find "$APK_DIR" \
              -type f \
              -name "*.apk" \
              | head -n 1
          )"


          if [ -z "$APK" ]; then

            echo ""
            echo "ERROR: No APK was generated."

            exit 1

          fi


          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


          echo ""
          echo "Generated APK:"
          ls -lh "$APK"


      # =========================================================
      # 24. Prepare final APK
      # =========================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          rm -rf release

          mkdir -p release

          FINAL_APK="release/Abir-AI-${ABIR_VERSION}-release.apk"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "================================
