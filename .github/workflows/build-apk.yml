
name: Build Abir AI 5.4.24

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ABIR_VERSION: "5.4.24"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Node.js
      # --------------------------------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --------------------------------------------------
      # 4. pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "pnpm:"
          pnpm --version

          echo "Java:"
          java -version

          echo "Gradle build environment ready."

      # --------------------------------------------------
      # 5. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$ANDROID_SDK_ROOT"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK setup completed."

      # --------------------------------------------------
      # 6. Prepare directories
      # --------------------------------------------------
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/abir-source"
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

          echo "EXTRACT_DIR=$RUNNER_TEMP/abir-source" >> "$GITHUB_ENV"
          echo "LOG_DIR=$GITHUB_WORKSPACE/build-diagnostics" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 7. Find source ZIP
      # --------------------------------------------------
      - name: Find Abir AI 5.4.24 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'AbirAI-5.4.24*.zip' \
              ! -path '*/.git/*' \
              -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d ' ' -f 2-
          )"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Abir AI 5.4.24 source ZIP not found."

            find "$GITHUB_WORKSPACE" \
              -type f -name '*.zip' -print || true

            exit 1
          fi

          echo "Selected source:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # --------------------------------------------------
      # 8. Extract source
      # --------------------------------------------------
      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq "$ZIP_FILE"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          echo "Source archive verified."

          echo "Checking project files:"

          find "$EXTRACT_DIR" -maxdepth 3 -type f \
            \( -name package.json \
               -o -name app.json \
               -o -name pnpm-workspace.yaml \
               -o -name gradlew \
               -o -name settings.gradle \
               -o -name gradle.properties \) \
            -print | sort

      # --------------------------------------------------
      # 9. Detect actual project root
      # --------------------------------------------------
      - name: Detect Abir AI project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          # This ZIP contains the project directly at its root.
          if [ -f "$EXTRACT_DIR/package.json" ] && \
             [ -f "$EXTRACT_DIR/app.json" ] && \
             [ -f "$EXTRACT_DIR/android/gradlew" ]; then

            PROJECT_ROOT="$EXTRACT_DIR"

          else

            while IFS= read -r gradlew; do
              ANDROID_DIR="$(dirname "$gradlew")"
              CANDIDATE="$(dirname "$ANDROID_DIR")"

              if [ -f "$CANDIDATE/package.json" ] && \
                 [ -f "$CANDIDATE/app.json" ]; then
                PROJECT_ROOT="$CANDIDATE"
                break
              fi

            done < <(
              find "$EXTRACT_DIR" -type f -name gradlew -print | sort
            )

          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "::error::Abir AI project root could not be detected."
            exit 1
          fi

          PROJECT_ROOT="$(cd "$PROJECT_ROOT" && pwd)"
          GRADLE_DIR="$PROJECT_ROOT/android"

          if [ ! -f "$GRADLE_DIR/gradlew" ]; then
            echo "::error::Android Gradle wrapper missing."
            exit 1
          fi

          if [ ! -f "$GRADLE_DIR/settings.gradle" ]; then
            echo "::error::Android settings.gradle missing."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

          echo "Project root: $PROJECT_ROOT"
          echo "Gradle root: $GRADLE_DIR"

      # --------------------------------------------------
      # 10. Verify project versions
      # --------------------------------------------------
      - name: Verify Abir AI dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const p = require('./package.json');

          const expo =
            p.dependencies?.expo ||
            p.devDependencies?.expo;

          const reactNative =
            p.dependencies?.['react-native'] ||
            p.devDependencies?.['react-native'];

          console.log('Project:', p.name);
          console.log('Version:', p.version);
          console.log('Expo:', expo);
          console.log('React Native:', reactNative);

          if (p.version !== '5.4.24') {
            throw new Error('Unexpected Abir AI project version.');
          }

          if (!expo || !reactNative) {
            throw new Error('Expo or React Native dependency missing.');
          }
          NODE

          test -f app.json
          test -f pnpm-workspace.yaml

          echo "Project configuration verified."

      # --------------------------------------------------
      # 11. Install dependencies
      # --------------------------------------------------
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing Abir AI dependencies..."

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile \
              2>&1 | tee "$LOG_DIR/pnpm-install.log"
          else
            echo "No pnpm-lock.yaml found in source archive."
            echo "Installing from package.json."

            pnpm install --no-frozen-lockfile \
              2>&1 | tee "$LOG_DIR/pnpm-install.log"
          fi

          echo "Dependency installation completed."

      # --------------------------------------------------
      # 12. Verify Expo Autolinking resolution
      # --------------------------------------------------
      - name: Verify Expo and React Native Autolinking
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Expo package..."

          node --print "require.resolve('expo/package.json')"

          echo "Checking React Native package..."

          node --print "require.resolve('react-native/package.json')"

          echo "Checking React Native Gradle plugin..."

          node --print \
            "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"

          echo "Checking Expo Autolinking using the same resolution as settings.gradle..."

          AUTOLINK_PACKAGE="$(
            node --print \
              "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
          )"

          echo "Expo Autolinking package:"
          echo "$AUTOLINK_PACKAGE"

          test -f "$AUTOLINK_PACKAGE"

          AUTOLINK_DIR="$(dirname "$AUTOLINK_PACKAGE")"

          test -d "$AUTOLINK_DIR/android/expo-gradle-plugin"

          echo "Expo Autolinking Gradle plugin verified."

      # --------------------------------------------------
      # 13. Expo configuration
      # --------------------------------------------------
      - name: Verify Expo configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec expo --version

          pnpm exec expo config --type public --json \
            > "$LOG_DIR/expo-config.json" \
            2> "$LOG_DIR/expo-config-error.log"

          node <<'NODE'
          const fs = require('fs');

          const config = JSON.parse(
            fs.readFileSync(
              process.env.LOG_DIR + '/expo-config.json',
              'utf8'
            )
          );

          console.log('Expo config verified.');
          console.log('Name:', config.name);
          console.log('Slug:', config.slug);
          console.log('Version:', config.version);

          if (config.version !== '5.4.24') {
            throw new Error('Expo configuration version mismatch.');
          }
          NODE

      # --------------------------------------------------
      # 14. Prepare Gradle safely
      # --------------------------------------------------
      - name: Prepare Android Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f "$GRADLE_DIR/gradlew"
          test -f "$GRADLE_DIR/gradle.properties"

          chmod +x "$GRADLE_DIR/gradlew"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > "$GRADLE_DIR/local.properties"

          PROPS="$GRADLE_DIR/gradle.properties"

          # The original source file has no final newline.
          # Add only a newline so a new property cannot join
          # the existing expo.inlineModules.watchedDirectories value.

          LAST_BYTE="$(
            tail -c 1 "$PROPS" |
            od -An -t x1 |
            tr -d '[:space:]'
          )"

          if [ "$LAST_BYTE" != "0a" ]; then
            printf '\n' >> "$PROPS"
          fi

          # Do not overwrite existing project settings.
          # --no-daemon is also supplied to Gradle commands.

          if ! grep -q '^org.gradle.daemon=' "$PROPS"; then
            printf '%s\n' 'org.gradle.daemon=false' >> "$PROPS"
          fi

          if grep -nE \
            '^expo\.inlineModules\.watchedDirectories=.*org\.gradle\.' \
            "$PROPS"; then

            echo "::error::Malformed Gradle properties detected."
            exit 1
          fi

          echo "Gradle properties verified:"
          cat "$PROPS"

          echo "Gradle project prepared."

      # --------------------------------------------------
      # 15. Gradle version
      # --------------------------------------------------
      - name: Verify Gradle wrapper
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --version \
            --no-daemon \
            2>&1 | tee "$LOG_DIR/gradle-version.log"

      # --------------------------------------------------
      # 16. Gradle configuration
      # --------------------------------------------------
      - name: Check Gradle configuration and Autolinking
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG_DIR/gradle-config.log"

          echo "Gradle configuration successful."

      # --------------------------------------------------
      # 17. Build APK
      # --------------------------------------------------
      - name: Build Abir AI Release APK
        working-directory: ${{ env.GRADLE_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Building Abir AI 5.4.24..."

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$LOG_DIR/abir-build.log"

          echo "Gradle release task completed."

      # --------------------------------------------------
      # 18. Verify APK
      # --------------------------------------------------
      - name: Collect and verify Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$GRADLE_DIR/app/build/outputs/apk/release"

          APK="$(
            find "$APK_DIR" -type f -name '*.apk' \
              -print 2>/dev/null | sort | tail -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            find "$GRADLE_DIR/app/build/outputs" \
              -type f -print 2>/dev/null || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          test -s "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          unzip -tq \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          echo "APK successfully generated:"
          ls -lh "$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

      # --------------------------------------------------
      # 19. Upload APK
      # --------------------------------------------------
      - name: Upload Abir AI Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      # --------------------------------------------------
      # 20. Upload logs even if build fails
      # --------------------------------------------------
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          
