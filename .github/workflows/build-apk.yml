name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Node 20
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ==========================================
      # 4. pnpm 10
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false


      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"

          # Do NOT chmod sdkmanager.
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."


      # ==========================================
      # 6. Find ZIP
      # ==========================================
      - name: Verify Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP="AbirAI-4.5.1-Fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."

            echo ""
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort

            exit 1
          fi

          echo "Found:"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # 7. Test ZIP
      # ==========================================
      - name: Test ZIP integrity
        shell: bash
        run: |
          set -e

          unzip -tq "$ZIP_FILE"

          echo "ZIP integrity OK."


      # ==========================================
      # 8. Extract
      # ==========================================
      - name: Extract Abir AI
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction complete."


      # ==========================================
      # 9. Detect project
      # ==========================================
      - name: Detect project directory
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ] &&
             [ -d "extracted/android" ]; then

            PROJECT_DIR="extracted"

          elif [ -f "extracted/src/package.json" ] &&
               [ -d "extracted/src/android" ]; then

            PROJECT_DIR="extracted/src"

          else

            FOUND_ANDROID=$(find extracted \
              -type d \
              -name android \
              | head -n 1)

            if [ -n "$FOUND_ANDROID" ]; then

              CANDIDATE="$(dirname "$FOUND_ANDROID")"

              if [ -f "$CANDIDATE/package.json" ]; then
                PROJECT_DIR="$CANDIDATE"
              fi

            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."

            echo ""
            echo "package.json:"
            find extracted \
              -name package.json \
              -type f \
              -print

            echo ""
            echo "android directories:"
            find extracted \
              -type d \
              -name android \
              -print

            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json missing."
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "ERROR: android directory missing."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 10. Check project
      # ==========================================
      - name: Check project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          test -f package.json
          test -d android
          test -f android/gradlew

          echo "package.json: OK"
          echo "android: OK"
          echo "gradlew: OK"


      # ==========================================
      # 11. Kotlin compatibility
      # ==========================================
      - name: Apply Kotlin compatibility fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -d android ]; then

            find android \
              -name "*.kt" \
              -type f \
              -print0 |
            while IFS= read -r -d '' file; do

              sed -i \
                's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
                "$file" || true

            done

          fi

          echo "Kotlin compatibility check complete."


      # ==========================================
      # 12. Install JS dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Installing dependencies..."

          # IMPORTANT:
          # pnpm 10.12.4 does NOT support
          # --allow-build on pnpm install.
          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed successfully."


      # ==========================================
      # 13. Verify node_modules
      # ==========================================
      - name: Verify dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ ! -d node_modules ]; then
            echo "ERROR: node_modules was not created."
            exit 1
          fi

          echo "node_modules: OK"


      # ==========================================
      # 14. Prepare Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

          echo "Gradle wrapper ready."


      # ==========================================
      # 15. Check Gradle
      # ==========================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew --version

          echo "Gradle check OK."


      # ==========================================
      # 16. Clean
      # ==========================================
      - name: Clean Android build
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 17. Build APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       BUILDING ABIR AI 4.5.1"
          echo "======================================"

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "BUILD COMPLETE"


      # ==========================================
      # 18. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_DIR="${PROJECT_DIR}/android/app/build/outputs/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK directory not found."
            exit 1
          fi

          echo "APK files:"

          find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$APK_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "APK found:"
          ls -lh "$APK"


      # ==========================================
      # 19. Prepare APK
      # ==========================================
      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/Abir-AI-4.5.1-release.apk"

          ls -lh \
            "release/Abir-AI-4.5.1-release.apk"


      # ==========================================
      # 20. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-4.5.1-release
          path: release/Abir-AI-4.5.1-release.apk
          if-no-files-found: error


      # ==========================================
      # 21. Success
      # ==========================================
      - name: Build success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "    ABIR AI 4.5.1 BUILD SUCCESS"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh release/Abir-AI-4.5.1-release.apk
          echo ""
          echo "Artifact:"
          echo "Abir-AI-4.5.1-release"
          echo ""
          echo "======================================"
