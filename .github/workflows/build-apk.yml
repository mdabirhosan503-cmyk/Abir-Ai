name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Abir AI 5.4.24
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.24"
      UNPACK_DIR: "${{ github.workspace }}/abir_extracted"
      ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
      ANDROID_HOME: "/usr/local/lib/android/sdk"

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # 3. NODE 20
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: |
            **/pnpm-lock.yaml


      # ============================================================
      # 4. PNPM
      # ============================================================

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false


      # ============================================================
      # 5. SYSTEM INFORMATION
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=========================================="
          echo "ABIR AI BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Runner:"
          uname -a

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "=========================================="


      # ============================================================
      # 6. LOCATE SDKMANAGER
      # ============================================================

      - name: Locate Android SDK manager
        shell: bash
        run: |
          set -Eeuo pipefail

          SDKMANAGER=""

          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(
              find "$ANDROID_SDK_ROOT/cmdline-tools" \
                -type f \
                -path '*/bin/sdkmanager' \
                -print 2>/dev/null |
              sort -V |
              tail -n 1 || true
            )"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: sdkmanager was not found."

            echo ""
            echo "Available cmdline-tools:"
            find "$ANDROID_SDK_ROOT/cmdline-tools" \
              -maxdepth 6 \
              -type f \
              -name "sdkmanager" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo ""
          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version


      # ============================================================
      # 7. ACCEPT SDK LICENSES
      # ============================================================

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -Eeuo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted/processed."


      # ============================================================
      # 8. INSTALL ONLY REQUIRED SDK PACKAGES
      #
      # IMPORTANT:
      # NEVER install the obsolete package "tools".
      # ============================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Installing required Android SDK packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo ""
          echo "Android SDK installation completed."

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "Checking Android 36:"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          echo "android-36 OK"

          echo ""
          echo "Checking Build Tools 36:"
          test -d "$ANDROID_SDK_ROOT/build-tools/36.0.0"
          echo "build-tools 36.0.0 OK"


      # ============================================================
      # 9. FIND ABIR AI ZIP
      #
      # This accepts:
      # - exact original ZIP
      # - FIXED ZIP
      # - COMPLETE ZIP
      # - any AbirAI 5.4.24 ZIP
      # ============================================================

      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Searching for Abir AI 5.4.24 ZIP..."

          BEST_ZIP=""

          # Prefer COMPLETE/FIXED archive first.
          for PATTERN in \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION-FIXED-COMPLETE.zip" \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION-FIXED.zip" \
            "AbirAI-5.4.24-600-MASTER-FEATURES-LIVE-VISION.zip" \
            "AbirAI-5.4.24-*.zip"
          do

            FOUND="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name "$PATTERN" \
                -not -path '*/abir_extracted/*' \
                -print -quit 2>/dev/null || true
            )"

            if [[ -n "$FOUND" ]]; then
              BEST_ZIP="$FOUND"
              break
            fi

          done

          if [[ -z "$BEST_ZIP" ]]; then

            echo ""
            echo "ERROR: Abir AI 5.4.24 ZIP was not found."

            echo ""
            echo "ZIP files currently available:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -not -path '*/abir_extracted/*' \
              -print || true

            exit 1
          fi

          echo ""
          echo "Selected ZIP:"
          echo "$BEST_ZIP"

          echo "ABIR_ZIP=$BEST_ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VERIFY ZIP
      # ============================================================

      - name: Verify Abir AI ZIP
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Testing ZIP integrity..."

          unzip -tq "$ABIR_ZIP"

          echo ""
          echo "ZIP integrity check PASSED."

          echo ""
          echo "ZIP size:"
          ls -lh "$ABIR_ZIP"


      # ============================================================
      # 11. EXTRACT ZIP
      # ============================================================

      - name: Extract Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          rm -rf "$UNPACK_DIR"

          mkdir -p "$UNPACK_DIR"

          unzip -oq "$ABIR_ZIP" -d "$UNPACK_DIR"

          echo "Abir AI extraction completed."

          echo ""
          echo "Top-level extracted files:"
          find "$UNPACK_DIR" \
            -maxdepth 2 \
            -type f \
            -print | head -n 100 || true


      # ============================================================
      # 12. DETECT CORRECT PROJECT
      # ============================================================

      - name: Detect Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          BEST_DIR=""
          BEST_SCORE=-1

          while IFS= read -r -d '' GRADLEW; do

            ANDROID_DIR="$(dirname "$GRADLEW")"
            CANDIDATE="$(dirname "$ANDROID_DIR")"

            echo ""
            echo "------------------------------------------"
            echo "Checking candidate:"
            echo "$CANDIDATE"
            echo "------------------------------------------"

            if [[ ! -f "$CANDIDATE/package.json" ]]; then
              echo "Missing package.json"
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/app/build.gradle" &&
                  ! -f "$ANDROID_DIR/app/build.gradle.kts" ]]; then
              echo "Missing app Gradle file"
              continue
            fi

            if [[ ! -f "$ANDROID_DIR/settings.gradle" &&
                  ! -f "$ANDROID_DIR/settings.gradle.kts" ]]; then
              echo "Missing settings Gradle file"
              continue
            fi

            SCORE=0

            if [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" ]]; then
              SCORE=$((SCORE + 3))
            fi

            if [[ -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" ]]; then
              SCORE=$((SCORE + 3))
            fi

            if [[ -f "$CANDIDATE/modules/abir-app-launcher/android/build.gradle" ]]; then
              SCORE=$((SCORE + 4))
            fi

            if [[ -f "$CANDIDATE/modules/abir-app-launcher/expo-module.config.json" ]]; then
              SCORE=$((SCORE + 2))
            fi

            VERSION="$(
              node -p "require('$CANDIDATE/package.json').version" \
              2>/dev/null || echo ""
            )"

            echo "Detected package version: $VERSION"

            if [[ "$VERSION" == "$ABIR_VERSION" ]]; then
              SCORE=$((SCORE + 10))
            fi

            echo "Candidate score: $SCORE"

            if (( SCORE > BEST_SCORE )); then
              BEST_SCORE=$SCORE
              BEST_DIR="$CANDIDATE"
            fi

          done < <(
            find "$UNPACK_DIR" \
              -type f \
              -path '*/android/gradlew' \
              -print0
          )

          if [[ -z "$BEST_DIR" ]]; then

            echo ""
            echo "ERROR: No valid Android project found."

            echo ""
            echo "Possible project files:"
            find "$UNPACK_DIR" \
              -maxdepth 8 \
              \( \
                -name package.json \
                -o -name gradlew \
                -o -name settings.gradle \
                -o -name settings.gradle.kts \
              \) \
              -print || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "SELECTED ABIR AI PROJECT"
          echo "=========================================="
          echo "$BEST_DIR"
          echo "Score: $BEST_SCORE"
          echo "=========================================="

          echo "PROJECT_ROOT=$BEST_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 13. VERIFY PROJECT
      # ============================================================

      - name: Verify Abir AI project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Project root:"
          pwd

          echo ""
          echo "Package version:"

          VERSION="$(node -p "require('./package.json').version")"

          echo "$VERSION"

          if [[ "$VERSION" != "$ABIR_VERSION" ]]; then
            echo "ERROR: Expected Abir AI version $ABIR_VERSION"
            echo "Found: $VERSION"
            exit 1
          fi

          test -f android/gradlew

          if [[ ! -f android/app/build.gradle &&
                ! -f android/app/build.gradle.kts ]]; then
            echo "ERROR: app Gradle file missing."
            exit 1
          fi

          if [[ ! -f android/settings.gradle &&
                ! -f android/settings.gradle.kts ]]; then
            echo "ERROR: settings Gradle file missing."
            exit 1
          fi

          APP_GRADLE="android/app/build.gradle"

          if [[ ! -f "$APP_GRADLE" ]]; then
            APP_GRADLE="android/app/build.gradle.kts"
          fi

          echo ""
          echo "Checking Android versionName..."

          if ! grep -Eq \
            "versionName[[:space:]]*[=]?[[:space:]]*['\"]${ABIR_VERSION}['\"]" \
            "$APP_GRADLE"; then

            echo "ERROR: Android versionName does not match $ABIR_VERSION."

            grep -n "versionName" "$APP_GRADLE" || true

            exit 1
          fi

          echo "versionName OK."


      # ============================================================
      # 14. CHECK FOR FORBIDDEN WORKSPACE DEPENDENCY
      # ============================================================

      - name: Check workspace dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          if grep -Rqs \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            '@workspace/api-client-react' \
            package.json \
            pnpm-lock.yaml \
            2>/dev/null; then

            echo "ERROR:"
            echo "Forbidden workspace dependency detected:"
            echo "@workspace/api-client-react"

            exit 1
          fi

          echo "Workspace dependency check passed."


      # ============================================================
      # 15. INSTALL DEPENDENCIES
      # ============================================================

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          pnpm install --no-frozen-lockfile

          echo "JavaScript dependencies installed."


      # ============================================================
      # 16. VERIFY PACKAGE VERSIONS
      # ============================================================

      - name: Verify Expo React Native and Camera
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "ADB:"
          "$ANDROID_SDK_ROOT/platform-tools/adb" version

          echo ""
          echo "Package versions:"

          node <<'NODE'
          const p = require('./package.json');

          const names = [
            'expo',
            'react-native',
            'expo-camera',
            'expo-speech',
            'expo-location'
          ];

          for (const name of names) {
            const version =
              p.dependencies?.[name] ||
              p.devDependencies?.[name] ||
              'NOT DECLARED';

            console.log(`${name}: ${version}`);
          }
          NODE

          echo ""
          echo "Expo CLI:"

          if pnpm exec expo --version; then
            echo "Expo CLI available."
          else
            echo "WARNING: Expo CLI check failed."
            echo "Native Gradle build will continue."
          fi


      # ============================================================
      # 17. PREPARE ANDROID
      # ============================================================

      - name: Prepare Android project
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" \
            > android/local.properties

          chmod +x android/gradlew

          echo "Android local.properties:"
          cat android/local.properties

          echo ""

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "ERROR: Gradle wrapper JAR missing."
            exit 1
          fi

          if [[ ! -f android/gradle/wrapper/gradle-wrapper.properties ]]; then
            echo "ERROR: Gradle wrapper properties missing."
            exit 1
          fi

          echo "Gradle wrapper:"
          cat android/gradle/wrapper/gradle-wrapper.properties


      # ============================================================
      # 18. SAFE KOTLIN COMPATIBILITY FIX
      # ============================================================

      - name: Apply Android Kotlin compatibility fix
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT"

          FOUND=0

          while IFS= read -r -d '' FILE; do

            echo "Patching:"
            echo "$FILE"

            sed -i \
              's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
              "$FILE"

            FOUND=1

          done < <(
            grep -RIlZ \
              --exclude-dir=node_modules \
              --exclude-dir=.git \
              'ResolveInfoFlags\.of(0)' \
              modules \
              android \
              2>/dev/null || true
          )

          if [[ "$FOUND" -eq 1 ]]; then
            echo "Kotlin compatibility patch applied."
          else
            echo "No ResolveInfoFlags compatibility patch required."
          fi


      # ============================================================
      # 19. CONFIGURE GRADLE
      # ============================================================

      - name: Configure Gradle
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

          echo "Gradle configuration:"
          cat "$HOME/.gradle/gradle.properties"


      # ============================================================
      # 20. GRADLE CACHE
      # ============================================================

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 21. CHECK GRADLE
      # ============================================================

      - name: Check Gradle configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew --version


      # ============================================================
      # 22. GRADLE HELP TEST
      # ============================================================

      - name: Test Gradle configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          ./gradlew help \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 23. BUILD RELEASE APK
      # ============================================================

      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$PROJECT_ROOT/android"

          echo "=========================================="
          echo "BUILDING ABIR AI 5.4.24"
          echo "=========================================="

          ./gradlew clean :app:assembleRelease \
            --no-daemon \
            --stack
