name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type d | head -80

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        shell: bash
        run: |
          set -e
          corepack enable
          corepack prepare pnpm@12.14.0 --activate
          pnpm --version

      - name: Install dependencies
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy
        run: |
          set -e
          pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Fix abir-app-launcher versionName
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai
        run: |
          set -e

          BUILD_FILE="modules/abir-app-launcher/android/build.gradle"

          echo "Checking: $BUILD_FILE"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: $BUILD_FILE not found"
            exit 1
          fi

          if grep -q 'versionName' "$BUILD_FILE"; then
            echo "versionName already exists"
          else
            sed -i '/namespace "expo.modules.abirapp"/a\  defaultConfig { versionName "1.0.0" }' "$BUILD_FILE"
            echo "Added versionName"
          fi

          echo "Final build.gradle:"
          cat "$BUILD_FILE"

      - name: Make Gradle executable
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          chmod +x gradlew

      - name: Build APK
        shell: bash
        working-directory: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android
        run: |
          set -e
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-debug-apk
          path: extracted/Bengali-Voice-Buddy/artifacts/abir-ai/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
