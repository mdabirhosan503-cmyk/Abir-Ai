name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AbirAI-*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: abir-ai-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Abir AI ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 2 -type f \
            -name 'AbirAI-*.zip' | head -n 1)"

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Abir AI ZIP file not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          if [ -f "extracted/package.json" ] && \
             [ -f "extracted/android/gradlew" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          else
            PROJECT_DIR="$(find "$GITHUB_WORKSPACE/extracted" \
              -type f -name gradlew -print0 |
              while IFS= read -r -d '' GRADLEW; do
                DIR="$(dirname "$(dirname "$GRADLEW")")"

                if [ -f "$DIR/package.json" ]; then
                  echo "$DIR"
                  break
                fi
              done)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || \
             [ ! -f "$PROJECT_DIR/package.json" ] || \
             [ ! -f "$PROJECT_DIR/android/gradlew" ]; then
            echo "::error::Could not locate a valid Abir AI Android project."
            echo "Project files found:"
            find extracted -maxdepth 5 -type f \
              \( -name package.json -o -name gradlew \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Using project:"
          echo "$PROJECT_DIR"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK_ROOT="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK_ROOT="$ANDROID_SDK_ROOT"
          else
            SDK_ROOT="/usr/local/lib/android/sdk"
          fi

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=""

          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "Android SDK: $SDK_ROOT"
          echo "SDK Manager: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses processed."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --stacktrace \
            assembleRelease

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          find "$PROJECT_DIR/android" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} release/ \;

          if ! ls release/*.apk >/dev/null 2>&1; then
            echo "::error::No release APK was generated."
            echo "Searching for APK files..."
            find "$PROJECT_DIR/android" -type f -name '*.apk' -print
            exit 1
          fi

          echo "Generated APK:"
          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-Release-APK
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
