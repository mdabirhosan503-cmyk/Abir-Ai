
name: Build Abir AI 5.4.24 Dual Offline Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-5-4-24-build
  cancel-in-progress: false

env:
  SOURCE_ZIP: AbirAI-5.4.24-DAILY-OFFLINE-TOOLS-UPGRADE.zip
  RELEASE_TAG: abirai-5.4.24-source

  ABIR_VERSION: "5.4.24"
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  build:
    name: Build Abir AI 5.4.24 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Checkout workflow repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 6. Install Android build components
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"

          echo "Android SDK components installed."

      # 7. Verify tools
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo "Node:"
          node --version

          echo "pnpm:"
          pnpm --version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          adb version

          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

      # 8. Download exact source ZIP from GitHub Release
      - name: Download Abir AI 5.4.24 source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir "$GITHUB_WORKSPACE/source"

          ZIP="$GITHUB_WORKSPACE/source/$SOURCE_ZIP"

          test -s "$ZIP"
          unzip -tq "$ZIP"

          sha256sum "$ZIP" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/source-sha256.txt"

          echo "Source ZIP verified."

      # 9. Extract source
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/abir_extracted"

          unzip -q \
            "$GITHUB_WORKSPACE/source/$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/abir_extracted"

          echo "Source ZIP extracted."

      # 10. Detect the correct project root
      - name: Detect canonical project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT="$GITHUB_WORKSPACE/abir_extracted"
          ROOT=""

          # The supplied ZIP identifies its top-level folder
          # as the canonical project root.
          if [ -f "$EXTRACT/PROJECT_ROOT_NOTICE.md" ] \
            && [ -f "$EXTRACT/package.json" ] \
            && [ -f "$EXTRACT/android/gradlew" ]; then

            ROOT="$EXTRACT"

          elif [ -f "$EXTRACT/package.json" ] \
            && [ -f "$EXTRACT/android/gradlew" ] \
            && [ -f "$EXTRACT/app.json" ]; then

            ROOT="$EXTRACT"

          else
            while IFS= read -r -d '' PACKAGE; do
              CANDIDATE="$(dirname "$PACKAGE")"

              if [ -f "$CANDIDATE/android/gradlew" ] \
                && [ -f "$CANDIDATE/app.json" ] \
                && [ -f "$CANDIDATE/scripts/prepare-whisper.sh" ] \
                && [ -f "$CANDIDATE/scripts/prepare-sherpa.sh" ]; then

                ROOT="$CANDIDATE"
                break
              fi
            done < <(
              find "$EXTRACT" \
                -type f \
                -name package.json \
                -not -path '*/node_modules/*' \
                -print0
            )
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: Canonical Android project root not found."
            find "$EXTRACT" -maxdepth 3 -type f | head -200
            exit 1
          fi

          echo "PROJECT_PATH=$ROOT" >> "$GITHUB_ENV"

          echo "Detected project root:"
          echo "$ROOT"

      # 11. Verify project files
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_PATH/package.json"
          test -f "$PROJECT_PATH/app.json"
          test -f "$PROJECT_PATH/android/gradlew"
          test -f "$PROJECT_PATH/android/settings.gradle"
          test -f "$PROJECT_PATH/android/app/build.gradle"

          test -f "$PROJECT_PATH/scripts/prepare-whisper.sh"
          test -f "$PROJECT_PATH/scripts/prepare-sherpa.sh"

          test -f "$PROJECT_PATH/pnpm-workspace.yaml"

          echo "All essential project files verified."

          if [ -f "$PROJECT_PATH/pnpm-lock.yaml" ]; then
            echo "Existing pnpm lockfile found."
          else
            echo "No pnpm-lock.yaml in ZIP."
            echo "pnpm will generate a new lockfile during installation."
          fi

          node --version
          pnpm --version
          java -version

      # 12. Install dependencies
      - name: Install project dependencies
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          if [ -f pnpm-lock.yaml ]; then
            echo "Installing using existing lockfile."
            pnpm install --no-frozen-lockfile
          else
            echo "Generating a new pnpm lockfile."
            pnpm install
          fi

          test -d node_modules
          test -f node_modules/.modules.yaml

          echo "Dependencies installed."

      # 13. Verify Expo
      - name: Verify Expo configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          pnpm exec expo --version

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

          echo "Expo configuration verified."

      # 14. Prepare Whisper
      - name: Prepare Whisper multilingual offline engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          chmod +x scripts/prepare-whisper.sh

          bash scripts/prepare-whisper.sh

          WHISPER_CPP="modules/abir-app-launcher/android/src/main/cpp/whisper.cpp"

          WHISPER_MODEL="modules/abir-app-launcher/android/src/main/assets/models/ggml-tiny-q5_1.bin"

          test -s "$WHISPER_CPP/CMakeLists.txt"
          test -s "$WHISPER_MODEL"

          echo "Whisper source and model verified."

      # 15. Prepare Sherpa-ONNX
      - name: Prepare Bengali Sherpa ONNX offline engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          chmod +x scripts/prepare-sherpa.sh

          bash scripts/prepare-sherpa.sh

          MODEL_DIR="modules/abir-app-launcher/android/src/main/assets/models/sherpa-bn"

          test -s "$MODEL_DIR/encoder.onnx"
          test -s "$MODEL_DIR/decoder.onnx"
          test -s "$MODEL_DIR/joiner.onnx"
          test -s "$MODEL_DIR/tokens.txt"
          test -s "$MODEL_DIR/bpe.model"
          test -s "$MODEL_DIR/unigram_500.vocab"
          test -s "$MODEL_DIR/opt.py"

          echo "Bengali Sherpa model files verified."

      # 16. Verify native libraries
      - name: Verify offline voice native libraries
        shell: bash
        run: |
          set -euo pipefail

          JNI_DIR="$PROJECT_PATH/modules/abir-app-launcher/android/src/main/jniLibs"

          test -d "$JNI_DIR"

          FOUND_ABI=0

          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            if [ -s "$JNI_DIR/$ABI/libsherpa-onnx-jni.so" ] \
              && [ -s "$JNI_DIR/$ABI/libonnxruntime.so" ]; then

              echo "Verified Sherpa libraries for $ABI"
              FOUND_ABI=$((FOUND_ABI + 1))
            fi
          done

          if [ "$FOUND_ABI" -eq 0 ]; then
            echo "ERROR: Sherpa native libraries not found."
            exit 1
          fi

          test -s "$PROJECT_PATH/modules/abir-app-launcher/android/src/main/cpp/whisper_native/CMakeLists.txt"

          echo "Native voice components verified."

      # 17. Configure Gradle
      - name: Configure Android Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          chmod +x gradlew

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          touch gradle.properties

          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g' >> gradle.properties
          fi

          if ! grep -q '^org.gradle.parallel=' gradle.properties; then
            echo 'org.gradle.parallel=true' >> gradle.properties
          fi

          if ! grep -q '^org.gradle.daemon=' gradle.properties; then
            echo 'org.gradle.daemon=false' >> gradle.properties
          fi

          echo "Gradle configured."

      # 18. Gradle preflight
      - name: Gradle preflight check
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          ./gradlew --version \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-version.log"

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      # 19. Build APK
      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

          echo "Release APK build completed."

      # 20. Collect APK
      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -path '*/release/*' \
            -print \
            | sort \
            | tail -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK not found."
            find "$PROJECT_PATH/android/app/build/outputs" \
              -type f -name '*.apk' || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          test -s "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          unzip -tq \
            "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

          echo "APK collected and verified."

      # 21. Upload APK
      - name: Upload Abir AI APK
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 22. Always upload diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # 23. Final status
      - name: Build result
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "ABIR AI 5.4.24 BUILD SUCCESSFUL"
          echo "Release APK is available in Artifacts."
          echo "======================================"
          
