name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project directory
        shell: bash
        run: |
          set -e

          echo "Searching for package.json..."

          PACKAGE_FILE=$(find . -type f -name "package.json" -print | head -n 1)

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_FILE")

          echo "Project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show project files
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f pnpm-lock.yaml ]; then
            echo "Using pnpm"
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install --frozen-lockfile

          elif [ -f package-lock.json ]; then
            echo "Using npm"
            npm ci

          elif [ -f yarn.lock ]; then
            echo "Using yarn"
            corepack enable
            yarn install --frozen-lockfile

          else
            echo "No lock file found"
            npm install
          fi

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Android project..."

          if [ -d "android" ]; then
            echo "Android folder already exists"
          else
            echo "Android folder not found."
            echo "Generating Android project..."

            npx expo prebuild \
              --platform android \
              --non-interactive
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Generating Android project again..."

            npx expo prebuild \
              --platform android \
              --non-interactive
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew still not found"
            exit 1
          fi

          echo "Android project is ready."

      - name: Make Gradle executable
        shell: bash
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR/android" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
