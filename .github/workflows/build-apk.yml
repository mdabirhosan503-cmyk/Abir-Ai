
name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI 5.4.4
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ABIR_VERSION: "5.4.4"
      ABIR_VERSION_CODE: "43"
      SOURCE_ZIP: "AbirAI-5.4.4-FIXED-FUTURISTIC-DASHBOARD-VOICE-OWNER-SECURITY-OFFLINE-ONLINE.zip"
      NODE_ENV: production

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 — Gradle cache disabled
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Node.js 20 — cache disabled
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false

      # 5. Check environment
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail
          node --version
          pnpm --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 6. Find the exact source ZIP
      - name: Find source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Required ZIP not found: $SOURCE_ZIP"
            echo "ZIP files available in repository:"
            find . -type f -name '*.zip' \
              -not -path './.git/*' -print || true
            exit 1
          fi

          unzip -tq "$SOURCE_ZIP"
          echo "ZIP_FILE=$SOURCE_ZIP" >> "$GITHUB_ENV"
          echo "Source ZIP verified."

      # 7. Extract source
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          echo "Source extracted."

      # 8. Detect the Android project
      - name: Detect project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          while IFS= read -r -d '' gradlew; do
            candidate="$(dirname "$(dirname "$gradlew")")"

            if [ -f "$candidate/package.json" ] &&
               [ -f "$candidate/android/gradlew" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(
            find extracted -type f -path '*/android/gradlew' -print0
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not locate the Expo Android project."
            find extracted -type f \
              \( -name package.json -o -name gradlew \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      # 9. Verify project files and version
      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f package.json
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties

          PACKAGE_VERSION="$(node -p "require('./package.json').version || ''")"

          if [ "$PACKAGE_VERSION" != "$ABIR_VERSION" ]; then
            echo "::error::Expected package version $ABIR_VERSION; found $PACKAGE_VERSION"
            exit 1
          fi

          GRADLE_FILE="android/app/build.gradle"

          VERSION_CODE="$(
            grep -E '^[[:space:]]*versionCode[[:space:]]+[0-9]+' "$GRADLE_FILE" |
            head -n 1 | awk '{print $2}'
          )"

          VERSION_NAME="$(
            grep -E '^[[:space:]]*versionName[[:space:]]+"' "$GRADLE_FILE" |
            head -n 1 | cut -d '"' -f 2
          )"

          echo "Version: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"

          test "$VERSION_NAME" = "$ABIR_VERSION"
          test "$VERSION_CODE" = "$ABIR_VERSION_CODE"

      # 10. Check Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 11. Install Android SDK packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      # 12. Install JS dependencies
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          else
            echo "::error::pnpm-lock.yaml is missing from the project."
            exit 1
          fi

          test -d node_modules
          test -d node_modules/expo
          test -d node_modules/react-native

      # 13. Check custom Android module
      - name: Check location coroutine source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt"

          if [ -f "$FILE" ]; then
            grep -n -A 5 -B 5 'getCurrentLocationJson' "$FILE" || true
          else
            echo "Custom module file not found at expected path."
            echo "Checking project tree..."
            find . -name 'AbirAppLauncherModule.kt' -print
          fi

      # 14. Prepare Gradle
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --version

      # 15. Clean build
      - name: Clean Android
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean --no-daemon --stacktrace

      # 16. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 17. Locate APK
      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/android/app/build/outputs/apk"

          APK="$(
            find "$APK_DIR" -type f -name '*.apk' -print 2>/dev/null |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."
            find "$PROJECT_DIR/android/app/build" \
              -type f -print || true
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Abir-AI-5.4.4-release.apk

          APK_SIZE="$(stat -c%s release/Abir-AI-5.4.4-release.apk)"
          test "$APK_SIZE" -gt 100000

          sha256sum release/Abir-AI-5.4.4-release.apk \
            > release/SHA256SUMS.txt

          {
            echo "Abir AI Release Build"
            echo "Version: $ABIR_VERSION"
            echo "Version Code: $ABIR_VERSION_CODE"
            echo "Source ZIP: $SOURCE_ZIP"
            echo "APK size: $APK_SIZE bytes"
            echo ""
            cat release/SHA256SUMS.txt
          } > release/BUILD_INFO.txt

          cat release/BUILD_INFO.txt

      # 18. Upload APK
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.4-release
          path: |
            release/Abir-AI-5.4.4-release.apk
            release/BUILD_INFO.txt
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
