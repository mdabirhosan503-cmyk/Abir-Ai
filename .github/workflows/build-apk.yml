name: Build Abir AI 2.9.0 Final

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Extract ZIP
      # ==========================================
      - name: Extract Abir AI ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f \
            -name "Bengali-Voice-Buddy-AbirAI-2.9.0-Final.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP NOT FOUND"
            ls -lah
            exit 1
          fi

          echo "Found:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extraction completed."


      # ==========================================
      # 4. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ==========================================
      # 5. pnpm
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
          run_install: false


      # ==========================================
      # 6. Find project
      # ==========================================
      - name: Find Abir AI project
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -path "*/artifacts/abir-ai/package.json" \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Abir AI project not found"
            find extracted -type f -name package.json
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"


      # ==========================================
      # 7. Install dependencies
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT }}
        run: |
          set -e

          pnpm install \
            --no-frozen-lockfile \
            --allow-build=esbuild


      # ==========================================
      # 8. Check Android
      # ==========================================
      - name: Check Android project
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: android/gradlew not found"
            exit 1
          fi

          chmod +x android/gradlew


      # ==========================================
      # 9. Fix ALL Android versionName
      # ==========================================
      - name: Fix Android versionName
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIXING ANDROID VERSION NAMES"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          root = Path("android")

          files = list(root.rglob("build.gradle")) + \
                  list(root.rglob("build.gradle.kts"))

          for p in files:

              try:
                  s = p.read_text()
              except Exception as e:
                  print("READ ERROR:", p, e)
                  continue

              # Only Android projects
              if "android {" not in s:
                  continue

              print("")
              print("Checking:", p)

              # ------------------------------------------------
              # Groovy build.gradle
              # ------------------------------------------------
              if p.name == "build.gradle":

                  # If defaultConfig exists, add versionName if missing
                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n    versionName "2.9.0"',
                              1
                          )

                          print("Added versionName:", p)

                  # If android exists but defaultConfig does not,
                  # create defaultConfig inside android block.
                  else:

                      marker = "android {"

                      if marker in s:

                          s = s.replace(
                              marker,
                              'android {\n    defaultConfig {\n        versionName "2.9.0"\n    }',
                              1
                          )

                          print("Created defaultConfig:", p)

              # ------------------------------------------------
              # Kotlin build.gradle.kts
              # ------------------------------------------------
              elif p.name == "build.gradle.kts":

                  if "defaultConfig {" in s:

                      if "versionName" not in s:

                          s = s.replace(
                              "defaultConfig {",
                              'defaultConfig {\n        versionName = "2.9.0"',
                              1
                          )

                          print("Added Kotlin versionName:", p)

                  else:

                      marker = "android {"

                      if marker in s:

                          s = s.replace(
                              marker,
                              'android {\n    defaultConfig {\n        versionName = "2.9.0"\n    }',
                              1
                          )

                          print("Created Kotlin defaultConfig:", p)

              p.write_text(s)

          print("")
          print("VersionName fixing completed.")
          PY


      # ==========================================
      # 10. Specifically fix abir-app-launcher
      # ==========================================
      - name: Fix Abir App Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find modules \
            -type f \
            -path "*/abir-app-launcher/android/build.gradle" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "abir-app-launcher build.gradle not found."
            exit 0
          fi

          echo "Launcher Gradle:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          # Remove duplicate versionName if our earlier step
          # already added it, then rebuild the android block safely.

          if "android {" in s and "versionName" not in s:

              s = s.replace(
                  'android {\n',
                  'android {\n  defaultConfig {\n    versionName "2.9.0"\n  }\n',
                  1
              )

              p.write_text(s)

              print("abir-app-launcher versionName added.")

          else:
              print("abir-app-launcher already contains versionName.")

          print("")
          print("Final abir-app-launcher/build.gradle:")
          print(p.read_text())
          PY


      # ==========================================
      # 11. Fix Accessibility Service
      # ==========================================
      - name: Fix Accessibility Service
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAccessibilityService.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Accessibility service not found."
            exit 0
          fi

          echo "Accessibility file:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          if "import android.view.accessibility.AccessibilityEvent" not in s:

              marker = "import android.view.accessibility.AccessibilityNodeInfo"

              if marker in s:
                  s = s.replace(
                      marker,
                      "import android.view.accessibility.AccessibilityEvent\n"
                      + marker
                  )

          replacements = {
              "AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityEvent.TYPE_WINDOW_CONTENT_CHANGED": "2048",
              "AccessibilityServiceInfo.TYPE_VIEW_TEXT_CHANGED": "16",
              "AccessibilityServiceInfo.TYPE_WINDOW_STATE_CHANGED": "32",
              "AccessibilityServiceInfo.TYPE_WINDOW_CONTENT_CHANGED": "2048",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)

          print("Accessibility Service fixed.")
          PY


      # ==========================================
      # 12. Fix Contacts
      # ==========================================
      - name: Fix Contacts Kotlin compatibility
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          FILE=$(find . \
            -type f \
            -name "AbirAppLauncherModule.kt" \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "Contacts module not found."
            exit 0
          fi

          echo "Contacts module:"
          echo "$FILE"

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])

          s = p.read_text()

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0)",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          s = s.replace(
              "PackageManager.ResolveInfoFlags.of(0L.toLong())",
              "PackageManager.ResolveInfoFlags.of(0L)"
          )

          p.write_text(s)

          print("Contacts compatibility fixed.")
          PY


      # ==========================================
      # 13. Verify Launcher Gradle
      # ==========================================
      - name: Verify Launcher Gradle
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING LAUNCHER GRADLE"
          echo "=========================================="

          FILE="modules/abir-app-launcher/android/build.gradle"

          if [ -f "$FILE" ]; then
            cat "$FILE"
          else
            echo "Launcher Gradle file not found."
          fi


      # ==========================================
      # 14. Verify Gradle
      # ==========================================
      - name: Verify Gradle
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # 15. Clean
      # ==========================================
      - name: Clean Android build
        working-directory: ${{ env.PROJECT }}/android
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING ANDROID BUILD"
          echo "=========================================="

          ./gradlew clean --no-daemon


      # ==========================================
      # 16. Build Release APK
      # ==========================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT }}/android
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPO_PUBLIC_GEMINI_MODEL: gemini-2.5-flash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING ABIR AI 2.9.0 FINAL"
          echo "=========================================="

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================
      # 17. Find APK
      # ==========================================
      - name: Find Release APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR APK"
          echo "=========================================="

          APK=$(find android \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then

            echo "ERROR: APK NOT FOUND"

            find android \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-2.9.0-Final.apk"

          ls -lh release/Abir-AI-2.9.0-Final.apk


      # ==========================================
      # 18. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-2.9.0-Final
          path: ${{ env.PROJECT }}/release/Abir-AI-2.9.0-Final.apk
          if-no-files-found: error
