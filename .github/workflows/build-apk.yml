
name: Build Abir AI 5.4.24 Dual Offline Voice APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-5-4-24-build
  cancel-in-progress: false

env:
  SOURCE_ZIP: AbirAI-5.4.24-DAILY-OFFLINE-TOOLS-UPGRADE.zip
  RELEASE_TAG: abirai-5.4.24-source
  ANDROID_API: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=6144"

jobs:
  build:
    name: Build Abir AI 5.4.24 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17 - Gradle cache disabled because ZIP is extracted later
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Node.js - npm cache disabled because project is in ZIP
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 4. pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"
          run_install: false

      # 5. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      # 6. Android components
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          test -x "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${CMAKE_VERSION}"

          echo "Android SDK installation completed."

      # 7. Verify environment
      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          java -version
          node --version
          pnpm --version
          adb version

          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

      # 8. Download source ZIP
      - name: Download Abir AI source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_ZIP" \
            --dir "$GITHUB_WORKSPACE/source"

          ZIP="$GITHUB_WORKSPACE/source/$SOURCE_ZIP"

          test -s "$ZIP"
          unzip -tq "$ZIP"

          sha256sum "$ZIP" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/source-sha256.txt"

      # 9. Extract source
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/abir_extracted"

          unzip -q \
            "$GITHUB_WORKSPACE/source/$SOURCE_ZIP" \
            -d "$GITHUB_WORKSPACE/abir_extracted"

          echo "ZIP extracted."

      # 10. Select actual project root
      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/abir_extracted"

          test -f "$ROOT/package.json"
          test -f "$ROOT/app.json"
          test -f "$ROOT/android/gradlew"

          echo "PROJECT_PATH=$ROOT" >> "$GITHUB_ENV"

          echo "Using project root:"
          echo "$ROOT"

      # 11. Verify project
      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          test -f package.json
          test -f app.json
          test -f pnpm-workspace.yaml

          test -f android/gradlew
          test -f android/settings.gradle
          test -f android/app/build.gradle

          test -f scripts/prepare-whisper.sh
          test -f scripts/prepare-sherpa.sh

          if [ -f pnpm-lock.yaml ]; then
            echo "Existing pnpm lockfile found."
          else
            echo "No lockfile found; pnpm will generate one."
          fi

          echo "Project verification successful."

      # 12. Install dependencies
      - name: Install pnpm dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          pnpm install

          test -d node_modules

          echo "Dependencies installed."

      # 13. Expo verification
      - name: Verify Expo configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          pnpm exec expo --version

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

      # 14. Whisper setup
      - name: Prepare Whisper offline engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          chmod +x scripts/prepare-whisper.sh
          bash scripts/prepare-whisper.sh

          WHISPER_CPP="modules/abir-app-launcher/android/src/main/cpp/whisper.cpp"
          WHISPER_MODEL="modules/abir-app-launcher/android/src/main/assets/models/ggml-tiny-q5_1.bin"

          test -s "$WHISPER_CPP/CMakeLists.txt"
          test -s "$WHISPER_MODEL"

          echo "Whisper source and model verified."

      # 15. Sherpa Bengali setup
      - name: Prepare Sherpa Bengali offline engine
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH"

          chmod +x scripts/prepare-sherpa.sh
          bash scripts/prepare-sherpa.sh

          MODEL_DIR="modules/abir-app-launcher/android/src/main/assets/models/sherpa-bn"

          for FILE in \
            encoder.onnx \
            decoder.onnx \
            joiner.onnx \
            tokens.txt \
            bpe.model \
            unigram_500.vocab \
            opt.py \
            SHA256SUMS.txt
          do
            test -s "$MODEL_DIR/$FILE"
          done

          echo "Sherpa Bengali model verified."

      # 16. Verify native libraries
      - name: Verify voice native libraries
        shell: bash
        run: |
          set -euo pipefail

          JNI_DIR="$PROJECT_PATH/modules/abir-app-launcher/android/src/main/jniLibs"

          FOUND=0

          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            if [ -s "$JNI_DIR/$ABI/libsherpa-onnx-jni.so" ] \
              && [ -s "$JNI_DIR/$ABI/libonnxruntime.so" ]; then
              echo "Verified ABI: $ABI"
              FOUND=$((FOUND + 1))
            fi
          done

          test "$FOUND" -gt 0

          test -s "$PROJECT_PATH/modules/abir-app-launcher/android/src/main/cpp/whisper_native/CMakeLists.txt"

      # 17. Configure Gradle
      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          chmod +x gradlew

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          echo "Gradle configuration completed."

      # 18. Gradle preflight
      - name: Gradle preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          ./gradlew --version \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-version.log"

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      # 19. Build release APK
      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_PATH/android"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

      # 20. Collect APK
      - name: Collect release APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_PATH/android/app/build/outputs/apk"

          APK="$(find "$APK_DIR" \
            -type f \
            -name '*.apk' \
            -path '*/release/*' \
            -print | sort | tail -n 1)"

          if [ -z "$APK" ]; then
            echo "Release APK not found."
            find "$PROJECT_PATH/android/app/build/outputs" \
              -type f -name '*.apk' || true
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          test -s "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          unzip -tq "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk"

          sha256sum "$GITHUB_WORKSPACE/release/AbirAI-5.4.24-release.apk" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

      # 21. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Release-APK
          path: release/AbirAI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 30

      # 22. Always upload diagnostics
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AbirAI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      # 23. Success
      - name: Build success
        if: success()
        run: |
          echo "Abir AI 5.4.24 APK build successful."
          echo "Download the APK from GitHub Actions Artifacts."
