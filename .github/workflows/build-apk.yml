name: Build Abir AI 5.4.24

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: abir-ai-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ABIR_VERSION: "5.4.24"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    name: Build Abir AI Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # Gradle cache intentionally disabled
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. SETUP PNPM
      # ==========================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      # ==========================================
      # 4. SETUP NODE
      # pnpm cache intentionally disabled
      # ==========================================
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ==========================================
      # 5. ENVIRONMENT CHECK
      # ==========================================
      - name: Check build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== ABIR AI BUILD =========="
          echo "Version: $ABIR_VERSION"

          echo ""
          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          df -h

      # ==========================================
      # 6. ANDROID SDK
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -print 2>/dev/null |
              head -n 1 || true
            )"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006"

      # ==========================================
      # 7. PREPARE DIRECTORIES
      # ==========================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/abir_build"
          mkdir -p "$GITHUB_WORKSPACE/abir_extracted"
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          mkdir -p "$GITHUB_WORKSPACE/release"

      # ==========================================
      # 8. FIND SOURCE ZIP
      # ==========================================
      - name: Find Abir AI source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'AbirAI-5.4.24*.zip' \
              -not -path '*/.git/*' \
              -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d ' ' -f 2-
          )"

          if [ -z "$ZIP" ]; then
            echo "::error::AbirAI-5.4.24 source ZIP not found."

            echo "Available ZIP files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name '*.zip' \
              -not -path '*/.git/*' \
              -print || true

            exit 1
          fi

          echo "Selected ZIP:"
          echo "$ZIP"

          cp "$ZIP" "$GITHUB_WORKSPACE/abir_build/source.zip"

      # ==========================================
      # 9. VERIFY ZIP
      # ==========================================
      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$GITHUB_WORKSPACE/abir_build/source.zip"

          unzip -tq "$ZIP"

          echo "ZIP integrity verified."

          sha256sum "$ZIP" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/source-sha256.txt"

      # ==========================================
      # 10. EXTRACT SOURCE
      # ==========================================
      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -q \
            "$GITHUB_WORKSPACE/abir_build/source.zip" \
            -d "$GITHUB_WORKSPACE/abir_extracted"

          echo "Source extracted."

          find "$GITHUB_WORKSPACE/abir_extracted" \
            -maxdepth 2 \
            -mindepth 1 \
            -print | head -n 150

      # ==========================================
      # 11. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -euo pipefail

          EXTRACTED="$GITHUB_WORKSPACE/abir_extracted"
          PROJECT_DIR=""

          if [ -f "$EXTRACTED/package.json" ] &&
             [ -f "$EXTRACTED/app.json" ] &&
             [ -f "$EXTRACTED/android/gradlew" ]; then

            PROJECT_DIR="$EXTRACTED"

          else

            PROJECT_DIR="$(
              find "$EXTRACTED" \
                -type f \
                -name package.json \
                -print0 |
              while IFS= read -r -d '' PKG; do

                ROOT="$(dirname "$PKG")"

                if [ -f "$ROOT/app.json" ] &&
                   [ -f "$ROOT/android/gradlew" ]; then
                  echo "$ROOT"
                  break
                fi

              done
            )"

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project not found."

            echo "Found package.json files:"
            find "$EXTRACTED" \
              -name package.json \
              -print || true

            echo "Found Gradle wrappers:"
            find "$EXTRACTED" \
              -name gradlew \
              -print || true

            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project root:"
          echo "$PROJECT_DIR"

      # ==========================================
      # 12. VERIFY PROJECT FILES
      # ==========================================
      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f package.json
          test -f app.json
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "Project structure verified."

          echo ""
          echo "Package information:"

          node -e '
            const p = require("./package.json");
            console.log(JSON.stringify({
              name: p.name,
              version: p.version,
              expo: p.dependencies?.expo,
              reactNative: p.dependencies?.["react-native"],
              expoCamera: p.dependencies?.["expo-camera"]
            }, null, 2));
          '

          echo ""
          echo "Important Abir AI files:"

          for FILE in \
            assistant/voiceManager.ts \
            assistant/androidActions.ts \
            assistant/onlineAssistant.ts \
            app/index.tsx \
            components/ExactReferenceDashboard.tsx \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/WakeWordService.kt \
            modules/abir-app-launcher/android/src/main/java/expo/modules/abirapp/AbirAppLauncherModule.kt
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "NOTICE: Not found: $FILE"
            fi
          done

      # ==========================================
      # 13. GRADLE WRAPPER CHECK
      # ==========================================
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          chmod +x gradlew

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Gradle wrapper properties:"
          cat gradle/wrapper/gradle-wrapper.properties

      # ==========================================
      # 14. INSTALL DEPENDENCIES
      # ==========================================
      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f pnpm-lock.yaml ]; then
            echo "Installing with frozen lockfile..."
            pnpm install --frozen-lockfile
          else
            echo "::warning::pnpm-lock.yaml not found."
            pnpm install
          fi

      # ==========================================
      # 15. VERIFY EXPO
      # ==========================================
      - name: Verify Expo CLI and configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Expo version:"
          pnpm exec expo --version

          echo ""
          echo "Generating Expo configuration..."

          pnpm exec expo config \
            --type public \
            --json \
            > "$GITHUB_WORKSPACE/build-diagnostics/expo-config.json"

          echo "Expo configuration generated."

      # ==========================================
      # 16. GRADLE PROPERTIES
      # ==========================================
      - name: Prepare Gradle properties
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          touch gradle.properties

          if [ -s gradle.properties ]; then
            LAST_BYTE="$(
              tail -c 1 gradle.properties |
              od -An -t x1 |
              tr -d ' '
            )"

            if [ "$LAST_BYTE" != "0a" ]; then
              printf '\n' >> gradle.properties
            fi
          fi

          if ! grep -qxF 'org.gradle.daemon=false' gradle.properties; then
            printf '\norg.gradle.daemon=false\n' >> gradle.properties
          fi

          if ! grep -q '^org.gradle.jvmargs=' gradle.properties; then
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m' \
              >> gradle.properties
          fi

          if grep -nE \
            'expo\.inlineModules\.watchedDirectories=.*org\.gradle\.' \
            gradle.properties; then
            echo "::error::Malformed Gradle properties detected."
            exit 1
          fi

          echo "Gradle properties prepared."

      # ==========================================
      # 17. GRADLE PREFLIGHT
      # ==========================================
      - name: Run Gradle preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          ./gradlew --version \
            --no-daemon \
            --stacktrace \
            --console=plain

          ./gradlew help \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-help.log"

      # ==========================================
      # 18. BUILD RELEASE APK
      # ==========================================
      - name: Build Abir AI Release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/android"

          echo "Building Abir AI $ABIR_VERSION..."

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-clean.log"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            --console=plain \
            2>&1 |
            tee "$GITHUB_WORKSPACE/build-diagnostics/gradle-release-build.log"

      # ==========================================
      # 19. FIND AND VERIFY APK
      # ==========================================
      - name: Collect and verify Release APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/android/app/build/outputs/apk/release"

          echo "Searching for generated APK..."

          if [ ! -d "$APK_DIR" ]; then
            echo "::error::APK output directory does not exist."

            find "$PROJECT_DIR/android/app/build/outputs" \
              -maxdepth 5 \
              -print 2>/dev/null || true

            exit 1
          fi

          APK="$(
            find "$APK_DIR" \
              -type f \
              -name '*.apk' \
              -print |
            sort |
            tail -n 1 || true
          )"

          if [ -z "$APK" ]; then
            echo "::error::Release APK was not generated."

            find "$PROJECT_DIR/android/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          OUTPUT_APK="$GITHUB_WORKSPACE/release/Abir-AI-5.4.24-release.apk"

          cp "$APK" "$OUTPUT_APK"

          test -s "$OUTPUT_APK"

          unzip -tq "$OUTPUT_APK"

          echo "APK verification successful."

          ls -lh "$OUTPUT_APK"

          sha256sum "$OUTPUT_APK" \
            | tee "$GITHUB_WORKSPACE/build-diagnostics/apk-sha256.txt"

      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload Abir AI 5.4.24 Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Release-APK
          path: release/Abir-AI-5.4.24-release.apk
          if-no-files-found: error
          retention-days: 14

      # ==========================================
      # 21. UPLOAD DIAGNOSTICS
      # ==========================================
      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.24-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: warn
          retention-days: 14
