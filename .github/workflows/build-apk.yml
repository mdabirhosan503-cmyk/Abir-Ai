name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Abir AI Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ZIP_NAME: AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip
      PROJECT_DIR: extracted

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. JAVA 17
      # ========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ========================================================
      # 3. NODE 20
      # ========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ========================================================
      # 4. PNPM
      # ========================================================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      # ========================================================
      # 5. FIND ZIP
      # ========================================================
      - name: Find Abir AI ZIP
        shell: bash
        run: |
          set -eux

          ZIP_PATH="$(find . \
            -type f \
            -name "${ZIP_NAME}" \
            -print -quit || true)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: ${ZIP_NAME} not found."

            find . \
              -type f \
              \( -iname "*.zip" -o -iname "*.ZIP" \) \
              -print \
              | sort || true

            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_PATH"

          rm -rf "${PROJECT_DIR}"
          mkdir -p "${PROJECT_DIR}"

          unzip -q "$ZIP_PATH" -d "${PROJECT_DIR}"

      # ========================================================
      # 6. FIND REAL PROJECT ROOT
      # ========================================================
      - name: Detect project root
        shell: bash
        run: |
          set -eux

          PROJECT_ROOT=""

          while IFS= read -r -d '' PACKAGE_FILE; do

            CANDIDATE="$(dirname "$PACKAGE_FILE")"

            if [ -f "$CANDIDATE/android/gradlew" ]; then
              PROJECT_ROOT="$CANDIDATE"
              break
            fi

          done < <(
            find "${PROJECT_DIR}" \
              -type f \
              -name "package.json" \
              -print0
          )

          if [ -z "$PROJECT_ROOT" ]; then
            echo "ERROR: Project root not found."

            find "${PROJECT_DIR}" \
              -maxdepth 6 \
              -type f \
              -print \
              | sort \
              | head -500

            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

      # ========================================================
      # 7. VERIFY PROJECT
      # ========================================================
      - name: Verify project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          test -f package.json
          test -f android/gradlew
          test -f android/settings.gradle

          echo "Project verified."

      # ========================================================
      # 8. INSTALL DEPENDENCIES
      # ========================================================
      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          pnpm install --no-frozen-lockfile

          echo ""
          echo "Dependencies installed."

      # ========================================================
      # 9. VERIFY MAIN PACKAGES
      # ========================================================
      - name: Verify Expo and React Native
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          echo "Node:"
          node --version

          echo ""
          echo "pnpm:"
          pnpm --version

          echo ""
          echo "Expo CLI:"
          pnpm exec expo --version

          echo ""
          echo "Expo package:"
          node -p "require('expo/package.json').version"

          echo ""
          echo "React Native:"
          node -p "require('react-native/package.json').version"

          echo ""
          echo "Verification complete."

      # ========================================================
      # 10. DISCOVER AUTOLINKING PACKAGE
      #
      # Do NOT assume it is directly available from root.
      # ========================================================
      - name: Locate Expo Autolinking
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -u

          echo "========================================"
          echo "LOCATING EXPO AUTOLINKING"
          echo "========================================"

          FOUND=""

          # First try normal Node resolution.
          FOUND="$(node -p \
            "require.resolve('expo-modules-autolinking/package.json')" \
            2>/dev/null || true)"

          if [ -n "$FOUND" ]; then
            echo "Found through Node:"
            echo "$FOUND"
            exit 0
          fi

          # Then search node_modules.
          FOUND="$(find node_modules \
            -path '*/expo-modules-autolinking/package.json' \
            -print \
            -quit \
            2>/dev/null || true)"

          if [ -n "$FOUND" ]; then
            echo "Found inside node_modules:"
            echo "$FOUND"
            exit 0
          fi

          echo ""
          echo "WARNING:"
          echo "expo-modules-autolinking is not directly resolvable."
          echo ""
          echo "Installed Expo-related packages:"
          find node_modules \
            -maxdepth 4 \
            -type d \
            -name '*autolink*' \
            -print \
            2>/dev/null \
            | head -50 || true

          echo ""
          echo "Continuing because Expo Gradle will perform its own resolution."

      # ========================================================
      # 11. VERIFY CUSTOM ABIR MODULE
      # ========================================================
      - name: Verify Abir App Launcher
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          if [ -d "modules/abir-app-launcher" ]; then

            echo "Abir App Launcher found."

            test -f \
              modules/abir-app-launcher/package.json

            test -f \
              modules/abir-app-launcher/expo-module.config.json

            echo ""
            echo "Module config:"
            cat modules/abir-app-launcher/expo-module.config.json

          else

            echo "WARNING: Abir App Launcher module not found."

          fi

      # ========================================================
      # 12. ANDROID SDK
      # ========================================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found."
            exit 1
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -print -quit \
              2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses \
            >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

          echo "Android SDK ready."

      # ========================================================
      # 13. FIX ResolveInfoFlags
      # ========================================================
      - name: Fix Android ResolveInfoFlags
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          grep -RIl \
            "ResolveInfoFlags.of(0)" \
            modules android \
            2>/dev/null \
            | while read -r FILE; do

              echo "Fixing: $FILE"

              sed -i \
                's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g' \
                "$FILE"

            done || true

      # ========================================================
      # 14. VALIDATE PNG
      # ========================================================
      - name: Validate PNG assets
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          BAD=0

          while IFS= read -r -d '' FILE; do

            MAGIC="$(xxd -p -l 8 "$FILE" 2>/dev/null || true)"

            if [ "$MAGIC" != "89504e470d0a1a0a" ]; then
              echo "INVALID PNG:"
              echo "$FILE"
              echo "Signature: $MAGIC"
              BAD=1
            fi

          done < <(
            find . \
              -type f \
              -iname "*.png" \
              -print0
          )

          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          echo "PNG validation passed."

      # ========================================================
      # 15. GRADLE MEMORY
      # ========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -eux

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          kotlin.daemon.jvm.options=-Xmx2g
          EOF

      # ========================================================
      # 16. PREPARE GRADLE
      # ========================================================
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux

          chmod +x gradlew

          ./gradlew --version

      # ========================================================
      # 17. CLEAN
      # ========================================================
      - name: Clean Android project
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -eux

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ========================================================
      # 18. BUILD RELEASE APK
      # ========================================================
      - name: Build Release APK
        working-directory: ${{ env.PROJECT_ROOT }}/android
        shell: bash
        run: |
          set -o pipefail

          chmod +x gradlew

          echo "========================================"
          echo "BUILDING ABIR AI APK"
          echo "========================================"

          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            2>&1 | tee "$GITHUB_WORKSPACE/abir-build.log"

      # ========================================================
      # 19. COLLECT APK
      # ========================================================
      - name: Collect APK
        if: success()
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -eux

          APK="$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."

            find android/app/build/outputs \
              -type f \
              -print \
              | sort || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/release/Abir-AI-5.4.16-release.apk"

      # ========================================================
      # 20. UPLOAD APK
      # ========================================================
      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Release-APK
          path: release/Abir-AI-5.4.16-release.apk
          if-no-files-found: error

      # ========================================================
      # 21. UPLOAD LOG ON FAILURE
      # ========================================================
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-Build-Diagnostics
          path: |
            abir-build.log
            extracted/**/android/build/reports/**
            extracted/**/android/app/build/outputs/logs/**
          if-no-files-found: warn
