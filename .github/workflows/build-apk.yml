name: Build Abir AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Reference UI AAPT FIXED ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Searching for Abir AI AAPT-FIXED ZIP"
          echo "=========================================="

          ZIP_FILE=""

          for f in \
            "AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip" \
            "./AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip" \
            "AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.ZIP"
          do
            if [ -f "$f" ]; then
              ZIP_FILE="$f"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: AAPT-FIXED ZIP was not found."
            echo ""
            echo "ZIP files available in repository:"
            find . -type f -iname "*.zip" -print
            echo ""
            echo "Expected:"
            echo "AbirAI-5.4.16-REFERENCE-UI-EXACT-AAPT-FIXED.zip"
            exit 1
          fi

          echo ""
          echo "Using FIXED ZIP:"
          echo "$ZIP_FILE"
          echo ""

          if [[ "$ZIP_FILE" != *"REFERENCE-UI-EXACT-AAPT-FIXED"* ]]; then
            echo "ERROR: Wrong ZIP selected."
            exit 1
          fi

          cp "$ZIP_FILE" abir-ai-source.zip

          echo "Source ZIP copied successfully."

      - name: Extract Reference UI project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q abir-ai-source.zip -d extracted

          echo "=========================================="
          echo " Extracted project"
          echo "=========================================="

          find extracted \
            -maxdepth 6 \
            \( -name gradlew -o -name package.json \) \
            -print | sort

      - name: Find Android project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            -name gradlew \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Verify Reference UI project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Verifying Reference UI files"
          echo "=========================================="

          echo ""
          echo "UI source files:"

          find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -name "index.tsx" \
              -o -name "index.jsx" \
              -o -name "App.tsx" \
              -o -name "App.jsx" \
            \) \
            -print | sort

          echo ""
          echo "Image/UI assets:"

          find "$GITHUB_WORKSPACE/extracted" \
            -type f \
            \( \
              -iname "*.png" \
              -o -iname "*.jpg" \
              -o -iname "*.jpeg" \
              -o -iname "*.webp" \
            \) \
            -print | head -n 100

      - name: Verify AAPT PNG assets
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Verifying PNG assets"
          echo "=========================================="

          python3 - <<'PY'
          import os
          import struct

          root = "extracted"

          png_files = []

          for base, _, files in os.walk(root):
              for name in files:
                  if name.lower().endswith(".png"):
                      png_files.append(os.path.join(base, name))

          if not png_files:
              print("No PNG files found.")
              raise SystemExit(0)

          print(f"Found {len(png_files)} PNG file(s).")

          PNG_SIGNATURE = b"\x89PNG\r\n\x1a\n"

          for path in png_files:
              with open(path, "rb") as f:
                  signature = f.read(8)

              if signature != PNG_SIGNATURE:
                  raise SystemExit(
                      f"ERROR: Invalid PNG signature: {path}"
                  )

              print("VALID PNG:", path)

          print("")
          print("All PNG assets have valid PNG signatures.")
          PY

      - name: Verify Reference Dashboard Asset
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo " Checking dashboard reference asset"
          echo "=========================================="

          FOUND=0

          while IFS= read -r -d '' FILE; do
            echo "Found:"
            echo "$FILE"
            FOUND=1
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              -type f \
              \( \
                -iname "abirdashboardreference.png" \
                -o -iname "*abirdashboardreference*.png" \
              \) \
              -print0
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "WARNING: Dashboard reference asset was not found."
            echo "Continuing because the project may use another asset path."
          else
            echo ""
            echo "Dashboard reference asset detected."
          fi

      - name: Verify AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$GITHUB_WORKSPACE/extracted/modules/abir-app-launcher/android/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found."
            exit 1
          fi

          echo "=========================================="
          echo " AndroidManifest.xml"
          echo "=========================================="

          cat "$MANIFEST"

          echo ""
          echo "Checking manifest structure..."

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path = sys.argv[1]

          tree = ET.parse(path)
          root = tree.getroot()

          application = root.find("application")

          if application is None:
              raise SystemExit(
                  "ERROR: <application> element is missing."
              )

          services_in_application = application.findall("service")
          services_in_manifest = root.findall("service")

          print(
              "Services inside <application>:",
              len(services_in_application)
          )

          print(
              "Services directly inside <manifest>:",
              len(services_in_manifest)
          )

          if services_in_manifest:
              raise SystemExit(
                  "ERROR: <service> found directly under <manifest>."
              )

          names = [
              s.attrib.get(
                  "{http://schemas.android.com/apk/res/android}name",
                  ""
              )
              for s in services_in_application
          ]

          print("Service names:")

          for name in names:
              print(" -", name)

          if ".CallAssistantService" not in names:
              raise SystemExit(
                  "ERROR: .CallAssistantService is missing "
                  "from <application>."
              )

          print("")
          print("Manifest structure is VALID.")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Gradle memory
        shell: bash
        run: |
          set -e

          GRADLE_PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$GRADLE_PROPERTIES"

          if grep -q "^org.gradle.jvmargs=" "$GRADLE_PROPERTIES"; then
            sed -i '/^org.gradle.jvmargs=/d' "$GRADLE_PROPERTIES"
          fi

          cat >> "$GRADLE_PROPERTIES" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          EOF

          echo "Gradle memory configuration:"
          grep "^org.gradle" "$GRADLE_PROPERTIES" || true

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          pnpm install --no-frozen-lockfile

      - name: Fix ResolveInfoFlags compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          find . \
            -type f \
            \( -name "*.kt" -o -name "*.java" \) \
            -print0 |
          xargs -0 -r sed -i \
            's/ResolveInfoFlags\.of(0)/ResolveInfoFlags.of(0L)/g'

      - name: Clean Android build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "=========================================="
          echo " Cleaning previous Android build"
          echo "=========================================="

          ./gradlew clean --no-daemon

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "=========================================="
          echo " Building Abir AI 5.4.16"
          echo " Reference UI EXACT"
          echo " AAPT-FIXED"
          echo "=========================================="

          ./gradlew \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*.apk" |
            head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          mkdir -p release

          cp "$APK" \
            "release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk"

          echo ""
          echo "=========================================="
          echo " APK CREATED SUCCESSFULLY"
          echo "=========================================="

          ls -lh \
            "release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Abir-AI-5.4.16-REFERENCE-UI-EXACT
          path: release/Abir-AI-5.4.16-REFERENCE-UI-EXACT.apk
          if-no-files-found: error
